    // MINI-JUEGO 1: ATRAPA REGALOS
    const CatchGiftGameModal = ({ onClose, onWin }) => {
      const [timeLeft, setTimeLeft] = useState(18);
      const [score, setScore] = useState(0);
      const [target, setTarget] = useState({ x: 50, y: 40, emoji: '🎁' });
      const [finished, setFinished] = useState(false);
      const emojis = ['🎁', '❄️', '🍪', '⭐', '🎄'];

      useEffect(() => {
        if (finished) return;
        const timer = setInterval(() => {
          setTimeLeft(t => {
            if (t <= 1) {
              clearInterval(timer);
              setFinished(true);
              return 0;
            }
            return t - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [finished]);

      useEffect(() => {
        if (finished) return;
        const mover = setInterval(() => {
          setTarget({
            x: 15 + Math.random() * 70,
            y: 15 + Math.random() * 70,
            emoji: emojis[Math.floor(Math.random() * emojis.length)]
          });
        }, 950);
        return () => clearInterval(mover);
      }, [finished]);

      const hit = () => {
        if (finished) return;
        setScore(s => s + 1);
        setTarget({
          x: 15 + Math.random() * 70,
          y: 15 + Math.random() * 70,
          emoji: emojis[Math.floor(Math.random() * emojis.length)]
        });
      };

      const earnedPts = Math.min(35, score * 2);

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-md flex items-center justify-center p-5 z-50">
          <div className="liquid-glass rounded-[34px] max-w-sm w-full p-5 shadow-2xl animate-sheet space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-extrabold text-[#E94B77]">🎁 Atrapa el Regalo</span>
              <span className="text-xs font-extrabold text-[#2D2229]">{timeLeft}s • {score} pts</span>
            </div>

            {!finished ? (
              <div className="relative h-64 rounded-3xl bg-gradient-to-b from-[#1E1B4B] to-[#312E81] overflow-hidden border border-white/40">
                <button
                  type="button"
                  onClick={hit}
                  style={{ left: `${target.x}%`, top: `${target.y}%`, transform: 'translate(-50%, -50%)' }}
                  className="absolute text-4xl active:scale-125 transition-all duration-150 cursor-pointer select-none"
                >
                  {target.emoji}
                </button>
              </div>
            ) : (
              <div className="py-6 text-center space-y-2 bg-white/75 rounded-3xl p-4">
                <p className="text-2xl">🎉</p>
                <p className="text-sm font-extrabold text-[#2D2229]">¡Atrapaste {score} regalos!</p>
                <p className="text-xs font-bold text-[#E94B77]">Ganaste +{earnedPts} pts {score >= 10 ? '+ 1 Decoración sorpresa 🎁' : ''}</p>
                <button
                  onClick={() => { onWin(earnedPts, score >= 10); onClose(); }}
                  className="mt-2 w-full py-2.5 rounded-full bg-[#E94B77] text-white text-xs font-extrabold"

                  Reclamar premio

            )}
          </div>
        </div>

    // MINI-JUEGO 2: MEMORAMA INVERNAL
    const MemoryGameModal = ({ onClose, onWin }) => {
      const baseIcons = ['🎄', '⛄', '🎁', '🍪', '🧣', '⭐'];
      const [cards, setCards] = useState(() =>
        [...baseIcons, ...baseIcons]
          .sort(() => Math.random() - 0.5)
          .map((icon, i) => ({ id: i, icon, flipped: false, matched: false }))
      );
      const [selected, setSelected] = useState([]);
      const [moves, setMoves] = useState(0);

      const allMatched = cards.every(c => c.matched);

      const handleFlip = (idx) => {
        if (selected.length === 2 || cards[idx].flipped || cards[idx].matched) return;
        const next = cards.map((c, i) => i === idx ? { ...c, flipped: true } : c);
        const nextSel = [...selected, idx];
        setCards(next);
        setSelected(nextSel);

        if (nextSel.length === 2) {
          setMoves(m => m + 1);
          const [a, b] = nextSel;
          if (next[a].icon === next[b].icon) {
            setTimeout(() => {
              setCards(curr => curr.map((c, i) => (i === a || i === b) ? { ...c, matched: true } : c));
              setSelected([]);
            }, 350);
          } else {
            setTimeout(() => {
              setCards(curr => curr.map((c, i) => (i === a || i === b) ? { ...c, flipped: false } : c));
              setSelected([]);
            }, 650);
          }
        }
      };

      const rewardPts = Math.max(15, 35 - moves);

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-md flex items-center justify-center p-5 z-50">
          <div className="liquid-glass rounded-[34px] max-w-sm w-full p-5 shadow-2xl animate-sheet space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-extrabold text-[#5B4BDB]">❄️ Memorama Invernal</span>
              <span className="text-xs font-bold text-[#6B5460]">Intentos: {moves}</span>
            </div>

            {!allMatched ? (
              <div className="grid grid-cols-4 gap-2">
                {cards.map((c, idx) => (
                  <button
                    key={c.id} type="button" onClick={() => handleFlip(idx)}
                    className={`h-16 rounded-2xl text-2xl flex items-center justify-center transition active:scale-95 border ${
                      c.flipped || c.matched ? 'bg-white border-[#E94B77]' : 'bg-gradient-to-br from-[#FF8DA8] to-[#E94B77] text-white border-white/60'
                    }`}
                  >
                    {c.flipped || c.matched ? c.icon : '✨'}
                  </button>
                ))}
              </div>
            ) : (
              <div className="py-5 text-center space-y-2 bg-white/80 rounded-3xl p-4">
                <p className="text-2xl">🏆</p>
                <p className="text-sm font-extrabold text-[#2D2229]">¡Completado en {moves} intentos!</p>
                <p className="text-xs font-bold text-[#E94B77]">+{rewardPts} pts + 1 Decoración sorpresa 🎁</p>
                <button
                  onClick={() => { onWin(rewardPts, true); onClose(); }}
                  className="mt-2 w-full py-2.5 rounded-full bg-[#E94B77] text-white text-xs font-extrabold"
                >
                  Reclamar premio
                </button>
              </div>
            )}

            {!allMatched && <button onClick={onClose} className="w-full py-2.5 rounded-full liquid-pill text-xs font-bold text-[#6B5460]">Salir</button>}
          </div>
        </div>
      );
    };

    // MINI-JUEGO 3: SECUENCIA LUMI
    const SimonGameModal = ({ onClose, onWin }) => {
      const pads = [
        { id: 0, color: 'bg-rose-400', active: 'bg-rose-200 scale-105', emoji: '❤️' },
        { id: 1, color: 'bg-emerald-400', active: 'bg-emerald-200 scale-105', emoji: '🎄' },
        { id: 2, color: 'bg-amber-400', active: 'bg-amber-200 scale-105', emoji: '⭐' },
        { id: 3, color: 'bg-indigo-400', active: 'bg-indigo-200 scale-105', emoji: '❄️' }
      ];
      const [seq, setSeq] = useState([Math.floor(Math.random() * 4)]);
      const [userIdx, setUserIdx] = useState(0);
      const [lit, setLit] = useState(null);
      const [playingSeq, setPlayingSeq] = useState(true);
      const [status, setStatus] = useState('playing');

      const playSequence = (list) => {
        setPlayingSeq(true);
        list.forEach((padId, i) => {
          setTimeout(() => setLit(padId), i * 600 + 300);
          setTimeout(() => setLit(null), i * 600 + 650);
        });
        setTimeout(() => setPlayingSeq(false), list.length * 600 + 700);
      };

      useEffect(() => { playSequence(seq); }, [seq]);

      const handlePad = (id) => {
        if (playingSeq || status !== 'playing') return;
        setLit(id);
        setTimeout(() => setLit(null), 220);

        if (id !== seq[userIdx]) {
          setStatus('lost');
          return;
        }
        if (userIdx + 1 === seq.length) {
          if (seq.length >= 5) {
            setStatus('won');
          } else {
            setUserIdx(0);
            setSeq(prev => [...prev, Math.floor(Math.random() * 4)]);
          }
        } else {
          setUserIdx(u => u + 1);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-md flex items-center justify-center p-5 z-50">
          <div className="liquid-glass rounded-[34px] max-w-sm w-full p-5 shadow-2xl animate-sheet space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-extrabold text-[#2D2229]">🎵 Secuencia Lumi</span>
              <span className="text-xs font-bold text-[#E94B77]">Nivel {seq.length}/5</span>
            </div>

            {status === 'playing' ? (
              <div className="space-y-2">
                <p className="text-[11px] font-bold text-center text-[#6B5460]">
                  {playingSeq ? 'Observa la secuencia...' : '¡Tu turno! Repítela'}
                </p>
                <div className="grid grid-cols-2 gap-3">
                  {pads.map(p => (
                    <button
                      key={p.id} type="button" onClick={() => handlePad(p.id)}
                      className={`h-24 rounded-3xl text-3xl flex items-center justify-center transition shadow-md ${lit === p.id ? p.active : p.color}`}
                    >
                      {p.emoji}
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="py-5 text-center space-y-2 bg-white/80 rounded-3xl p-4">
                <p className="text-2xl">{status === 'won' ? '🌟' : '😅'}</p>
                <p className="text-sm font-extrabold text-[#2D2229]">
                  {status === 'won' ? '¡Memoria perfecta!' : `Llegaste al nivel ${seq.length}`}
                </p>
                <p className="text-xs font-bold text-[#E94B77]">
                  +{status === 'won' ? 30 : seq.length * 4} pts {status === 'won' ? '+ 1 Decoración sorpresa 🎁' : ''}
                </p>
                <button
                  onClick={() => { onWin(status === 'won' ? 30 : seq.length * 4, status === 'won'); onClose(); }}
                  className="mt-2 w-full py-2.5 rounded-full bg-[#E94B77] text-white text-xs font-extrabold"
                >
                  Reclamar
                </button>
              </div>
            )}

            {status === 'playing' && <button onClick={onClose} className="w-full py-2.5 rounded-full liquid-pill text-xs font-bold text-[#6B5460]">Salir</button>}
          </div>
        </div>
      );
    };

    const BreathingGameModal = ({ onClose, onCompleteSession }) => {
      const [secondsLeft, setSecondsLeft] = useState(45);

      const canvasRef = useRef(null);
      const drawingRef = useRef(false);

      useEffect(() => {
        if (scratched || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = 280;
        canvas.height = 92;
        ctx.fillStyle = '#E94B77';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Rasca aquí para revelar tu cupón', canvas.width / 2, canvas.height / 2 + 4);
      }, [scratched]);

      const handleMove = (clientX, clientY) => {
        if (scratched || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = ((clientX - rect.left) / rect.width) * canvas.width;
        const y = ((clientY - rect.top) / rect.height) * canvas.height;
        const ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.fill();

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let transparent = 0;
        for (let i = 3; i < data.length; i += 4) if (data[i] === 0) transparent++;
        if (transparent / (data.length / 4) > 0.35) onScratch(coupon.id);
      };

      return (
        <div className="relative rounded-2xl bg-gradient-to-r from-white/85 to-[#FFE4EC]/85 border border-white p-3.5 overflow-hidden min-h-[92px] flex flex-col justify-center">

              ref={canvasRef}
              onMouseDown={() => { drawingRef.current = true; }}
              onMouseUp={() => { drawingRef.current = false; }}
              onMouseLeave={() => { drawingRef.current = false; }}
              onMouseMove={(e) => { if (drawingRef.current) handleMove(e.clientX, e.clientY); }}
              onTouchStart={(e) => { if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY); }}
              onTouchMove={(e) => { if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY); }}

    function parseLocalDate(dateStr) {
      const [y, m, d] = (dateStr || getTodayLocal()).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);

    function formatDateES(dateStr, includeYear = true) {
      if (!dateStr) return '';

      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      return includeYear ? `${d} de ${months[m - 1]} ${y}` : `${d} de ${months[m - 1]}`;

      return `${months[m - 1]} ${y}`;
    }

      const dt = parseLocalDate(dateStr);

                        type="text"
                        value={settings.customCouponSub || ''}
                        onChange={e => persistCloud(events, { ...settings, customCouponSub: e.target.value })}
                        placeholder="Nota extra"
                        className="w-full bg-white/80 rounded-2xl px-3 py-2 text-xs"
                      />
                    </div>
                  )}
                </div>
              )}

              {activeTab === 'history' && (
                <div className="space-y-4">
                  <div className="liquid-glass rounded-[26px] p-5">
                    <p className="text-[11px] font-bold uppercase text-[#8C7380]">Ciclo EWMA (±{cycleAnalytics.marginDays}d)</p>
                    <p className="text-2xl font-extrabold text-[#2D2229]">{cycleAnalytics.baseCycleLength} días</p>
                    <p className="text-[11px] text-[#7A6370]">Desviación σ: {cycleAnalytics.stdDev}d • Fase lútea: {cycleAnalytics.lutealLength}d</p>
                  </div>
                  <div className="liquid-glass rounded-[26px] p-5 space-y-2">
                    <p className="text-xs font-extrabold text-[#2D2229]">Curva de Temperatura Basal (BBT)</p>
                    <BbtChart logs={cycleAnalytics.tempLogs} coverline={cycleAnalytics.coverline} />
                  </div>
                </div>
              )}
            </div>
          </div>

          <nav className="fixed bottom-3 left-3 right-3 z-40 no-print">
            <div className="max-w-md md:max-w-xl mx-auto liquid-nav rounded-[32px] grid grid-cols-5 py-2.5 px-2">
              {[
                { id: 'today', label: 'Hoy', icon: 'home' },
                { id: 'calendar', label: 'Calendario', icon: 'calendar' },
                { id: 'lumi', label: 'Lumi', icon: 'lumi' },
                { id: 'games', label: 'Juegos', icon: 'games' },
                { id: 'history', label: 'Análisis', icon: 'chart' }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => handleSwitchTab(tab.id)}
                  className={`flex flex-col items-center gap-1 py-1 rounded-2xl transition ${activeTab === tab.id ? 'bg-white/80 text-[#E94B77]' : 'text-[#8C7380]'}`}
                >
                  <Icon name={tab.icon} className="w-5 h-5" />
                  <span className="text-[10px] font-extrabold">{tab.label}</span>
                </button>
              ))}
            </div>
          </nav>

          {catchGameOpen && <CatchGiftGameModal onClose={() => setCatchGameOpen(false)} onWin={handleGameWin} />}
          {memoryGameOpen && <MemoryGameModal onClose={() => setMemoryGameOpen(false)} onWin={handleGameWin} />}
          {simonGameOpen && <SimonGameModal onClose={() => setSimonGameOpen(false)} onWin={handleGameWin} />}
          {breathingOpen && <BreathingGameModal onClose={() => setBreathingOpen(false)} onCompleteSession={() => handleGameWin(10, false)} />}

          {settingsDrawerOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-end sm:items-center justify-center sm:p-4 z-50">
              <div className="liquid-glass rounded-t-[34px] sm:rounded-[34px] max-w-md w-full p-6 shadow-2xl animate-sheet max-h-[85vh] overflow-y-auto space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-extrabold text-[#2D2229]">Perfil & Ajustes (v{APP_VERSION})</h3>
                  <button onClick={() => setSettingsDrawerOpen(false)} className="w-8 h-8 rounded-full liquid-pill text-xs font-bold">✕</button>
                </div>
                <div className="bg-white/60 rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <p className="text-xs font-extrabold">Notificaciones Push</p>
                    <p className="text-[11px] text-[#7A6370]">{pushEnabled ? `Activo (${viewMode})` : 'Pendiente'}</p>
                  </div>
                  <button onClick={handleEnablePush} className="px-4 py-2 rounded-full bg-[#E94B77] text-white text-xs font-bold">Activar</button>
                </div>
                <button
                  onClick={() => {
                    const map = new Map(events.map(e => [e.id, e]));
                    INITIAL_EVENTS.forEach(e => { if (!map.has(e.id)) map.set(e.id, e); });
                    const merged = Array.from(map.values()).sort((a, b) => b.date.localeCompare(a.date));
                    persistCloud(merged, settings);
                    setSettingsDrawerOpen(false);
                    setRewardToast('¡Registros base restaurados en la nube!');
                    setTimeout(() => setRewardToast(''), 3000);
                  }}
                  className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-bold"
                >
                  Restaurar registros base (Ago–Nov)
                </button>
                <button
                  onClick={() => {
                    setIsUnlocked(false);
                    setSettingsDrawerOpen(false);
                    try { sessionStorage.removeItem('ciclo_unlocked_v7'); } catch {}
                  }}
                  className="w-full py-3 rounded-full liquid-pill text-[#6B5460] text-xs font-bold"
                >
                  Bloquear sesión
                </button>
              </div>
            </div>
          )}

          {updateModalOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-center justify-center p-5 z-50">
              <div className="liquid-glass rounded-[32px] max-w-sm w-full p-6 shadow-2xl animate-sheet relative">
                <span className="inline-block text-[10px] font-extrabold uppercase liquid-pill text-[#E94B77] px-3 py-1 rounded-full">v{CHANGELOG.version}</span>
                <h3 className="text-lg font-extrabold text-[#2D2229] mt-2">{CHANGELOG.title}</h3>
                <div className="space-y-2.5 my-4">
                  {CHANGELOG.items.map((it, idx) => (
                    <div key={idx} className="flex items-start gap-2.5 bg-white/70 p-3 rounded-2xl">
                      <span className="text-lg">{it.icon}</span>
                      <div>
                        <p className="text-xs font-extrabold">{it.title}</p>
                        <p className="text-[11px] text-[#6B5460]">{it.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
                <button onClick={dismissUpdateModal} className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-extrabold">¡A probarlo!</button>
              </div>
            </div>
          )}

          {safeDaysModalOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-center justify-center p-5 z-50">
              <div className="liquid-glass rounded-[30px] max-w-sm w-full p-6 shadow-2xl space-y-3">
                <h3 className="text-base font-extrabold">Índice fértil ({fertilityScore.pct}%)</h3>
                <p className="text-xs text-[#6B5460]">Cálculo estadístico EWMA. No sustituye un método anticonceptivo.</p>
                <button onClick={() => setSafeDaysModalOpen(false)} className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-bold">Entendido</button>
              </div>
            </div>
          )}

          {modalOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-end sm:items-center justify-center sm:p-4 z-50">
              <div className="liquid-glass rounded-t-[34px] sm:rounded-[34px] max-w-md w-full p-6 shadow-2xl animate-sheet max-h-[88vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-base font-extrabold text-[#2D2229]">Nuevo registro</h3>
                  <button onClick={() => setModalOpen(false)} className="w-8 h-8 rounded-full liquid-pill text-xs font-bold">✕</button>
                </div>
                <form onSubmit={handleSaveEvent} className="space-y-3">
                  <div className="grid grid-cols-2 gap-1.5">
                    {EVENT_TYPE_OPTIONS.map(opt => (
                      <button
                        key={opt.id}
                        type="button"
                        onClick={() => handleSelectModalType(opt)}
                        className={`p-2.5 rounded-2xl border text-left text-[11px] font-extrabold flex items-center gap-2 transition ${
                          newEventType === opt.id
                            ? 'bg-[#E94B77] text-white border-[#E94B77] shadow-sm'
                            : 'bg-white/75 text-[#2D2229] border-white'
                        }`}
                      >
                        <span className="text-sm">{opt.icon}</span>
                        <span className="leading-tight">{opt.label}</span>
                      </button>
                    ))}
                  </div>

                  <input
                    type="text"
                    value={newEventTitle}
                    onChange={e => setNewEventTitle(e.target.value)}
                    placeholder="Título del registro"
                    required
                    className="w-full bg-white/85 rounded-2xl px-3.5 py-2.5 text-xs font-bold text-[#2D2229]"
                  />

                  <div className="grid grid-cols-2 gap-2">
                    <input type="date" value={newEventDate} onChange={e => setNewEventDate(e.target.value)} required className="bg-white/85 rounded-2xl px-3 py-2 text-xs font-bold" />
                    <input type="number" step="0.01" value={newEventTemp} onChange={e => setNewEventTemp(e.target.value)} placeholder="Temp °C (opcional)" className="bg-white/85 rounded-2xl px-3 py-2 text-xs font-bold" />
                  </div>

                  {newEventType === 'period_start' && (
                    <div className="grid grid-cols-4 gap-1.5">
                      {FLOW_LEVELS.map(fl => (
                        <button
                          key={fl.id}
                          type="button"
                          onClick={() => setNewEventFlow(fl.id)}
                          className={`py-2 rounded-xl border text-[10px] font-bold ${newEventFlow === fl.id ? fl.active : 'bg-white/70 text-[#6B5460] border-white'}`}
                        >
                          {fl.label}
                        </button>
                      ))}
                    </div>
                  )}

                  <textarea rows="2" value={newEventDetails} onChange={e => setNewEventDetails(e.target.value)} placeholder="Notas adicionales..." className="w-full bg-white/85 rounded-2xl px-3.5 py-2 text-xs"></textarea>
                  <button type="submit" className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-extrabold shadow-md">Guardar registro</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
