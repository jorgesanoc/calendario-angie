<!DOCTYPE html>
<html lang="es">
<head>

  <title>Ciclo & Bienestar • Espacio Privado</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background: linear-gradient(155deg, #FFF5F8 0%, #F8F4FF 48%, #FFF7F0 100%);
      color: #2D2229;
      overscroll-behavior-y: none;
      min-height: 100vh;
    }
    .liquid-glass {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.78) 0%, rgba(255, 255, 255, 0.45) 100%);
      backdrop-filter: blur(26px) saturate(190%);
      -webkit-backdrop-filter: blur(26px) saturate(190%);
      border: 1px solid rgba(255, 255, 255, 0.90);
      box-shadow: 0 12px 32px -12px rgba(130, 65, 95, 0.14), inset 0 1.5px 1px rgba(255, 255, 255, 0.98);
    }
    .liquid-pill {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.88) 0%, rgba(255, 255, 255, 0.60) 100%);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 6px 16px -6px rgba(130, 65, 95, 0.14), inset 0 1px 0 rgba(255, 255, 255, 1);
    }
    .liquid-nav {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.84) 0%, rgba(255, 255, 255, 0.68) 100%);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border: 1px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 16px 38px -10px rgba(95, 45, 75, 0.20), inset 0 1.5px 1px rgba(255, 255, 255, 1);
    }
    .liquid-orb-ring {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.25));
      backdrop-filter: blur(24px) saturate(200%);
      -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1.5px solid rgba(255, 255, 255, 0.94);
      box-shadow: 0 24px 50px -14px rgba(233, 75, 119, 0.25), inset 0 2px 4px rgba(255, 255, 255, 0.98);
    }
    .hero-glow {
      background: radial-gradient(circle at 28% 22%, #FF96B0 0%, #E94B77 56%, #C73660 100%);
      box-shadow: 0 16px 36px -10px rgba(233, 75, 119, 0.50), inset 0 2px 5px rgba(255, 255, 255, 0.65);
    }
    .hero-glow-green {
      background: radial-gradient(circle at 28% 22%, #68DBB0 0%, #24A378 58%, #187D5B 100%);
      box-shadow: 0 16px 36px -10px rgba(36, 163, 120, 0.45), inset 0 2px 5px rgba(255, 255, 255, 0.65);
    }
    .hero-glow-amber {
      background: radial-gradient(circle at 28% 22%, #FCD34D 0%, #F59E0B 58%, #D97706 100%);
      box-shadow: 0 16px 36px -10px rgba(245, 158, 11, 0.45), inset 0 2px 5px rgba(255, 255, 255, 0.65);
    }
    .hero-glow-partner {
      background: radial-gradient(circle at 28% 22%, #A59BFF 0%, #6354E8 58%, #4839C7 100%);
      box-shadow: 0 16px 36px -10px rgba(99, 84, 232, 0.45), inset 0 2px 5px rgba(255, 255, 255, 0.65);
    }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes bounceSoft { 0%, 100% { transform: scale(1); } 40% { transform: scale(1.13, 0.90); } 75% { transform: scale(0.95, 1.05); } }
    @keyframes tabSlideRight { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes tabSlideLeft { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes sheetUp { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes shakePin { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    @keyframes blobDrift1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(24px, -18px) scale(1.08); } }
    @keyframes blobDrift2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-20px, 22px) scale(0.95); } }
    @keyframes sparkleFloat { 0%, 100% { opacity: 0.35; transform: translateY(0) scale(0.9); } 50% { opacity: 0.95; transform: translateY(-8px) scale(1.15); } }
    @keyframes splashRing { 0% { transform: scale(0.85); opacity: 0.7; } 100% { transform: scale(1.45); opacity: 0; } }
    @keyframes progressFill { from { width: 0%; } to { width: 100%; } }

    .animate-lumi-idle { animation: floatSlow 3.4s ease-in-out infinite; }
    .animate-lumi-bounce { animation: bounceSoft 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .animate-tab-right { animation: tabSlideRight 0.25s ease-out; }
    .animate-tab-left { animation: tabSlideLeft 0.25s ease-out; }
    .animate-sheet { animation: sheetUp 0.28s cubic-bezier(0.22, 1, 0.36, 1); }
    .animate-shake { animation: shakePin 0.36s ease-in-out; }
    .animate-blob-1 { animation: blobDrift1 11s ease-in-out infinite; }
    .animate-blob-2 { animation: blobDrift2 13s ease-in-out infinite; }
    .animate-sparkle { animation: sparkleFloat 2.6s ease-in-out infinite; }
    .animate-splash-ring { animation: splashRing 2s ease-out infinite; }
    .animate-splash-lumi { animation: floatSlow 2.4s ease-in-out infinite; }
    .animate-progress { animation: progressFill 2.5s linear forwards; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="pb-28">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect, useRef } = React;

    // =========================================================================
    // 1. CONSTANTES DE CONFIGURACIÓN Y EVIDENCIA CLÍNICA EMBEBIDA
    // =========================================================================
    const APP_VERSION = "9.0.0";
    const ACCESS_PIN = "0411";
    const DEFAULT_CLOUD_URL = "";
    const SOS_WEBHOOK_URL = "";
    const TAB_ORDER = ['today', 'calendar', 'lumi', 'games', 'history'];

    const CHANGELOG = {
      version: "9.0.0",
      title: "Motor Clínico Wilcox + Farmacología Real",
      items: [
        { icon: "💊", title: "Femelle One vs. Postday", desc: "Desplazamiento real de ovulación (+5d Ulipristal) y detección de sangrado por deprivación (Levonorgestrel)." },
        { icon: "📊", title: "Curva Empírica de Wilcox", desc: "Cálculo asimétrico basado en viabilidad real del óvulo (12–24h) y supervivencia espermática (5d)." },
        { icon: "🧪", title: "Cronómetro Clínico OMS/ACOG", desc: "Recordatorios automáticos a +14d y +21d tras relación sin protección o anticoncepción de emergencia." }
      ]
    };

    // Estándares clínicos FIGO, Sensiplan y ACOG/OMS
    const CLINICAL_STANDARDS = {
      figo: {
        minNormalCycleDays: 24,
        maxNormalCycleDays: 38,
        maxRegularityVariationDays: 8,
        maxNormalBleedDays: 8
      },
      luteal: {
        defaultDays: 14,
        minPhysiologicalDays: 10,
        maxPhysiologicalDays: 17
      },
      bbt: {
        thirdDayElevationCelsius: 0.20
      },
      pregnancyTesting: {
        earlyUrineTestDays: 14,
        definitiveUrineTestDays: 21,
        latePeriodAlertBufferDays: 7
      }
    };

    // Vector empírico de probabilidad de concepción por acto según Wilcox et al. (NEJM)
    const WILCOX_FERTILITY_VECTOR = {
      "-6": 0.03,
      "-5": 0.10,
      "-4": 0.16,
      "-3": 0.14,
      "-2": 0.27,
      "-1": 0.31,
      "0": 0.33,
      "1": 0.04,
      "2": 0.01
    };

    // Base farmacológica real (Monografías OMS / EMA / FSRH)
    const PHARMACOLOGY_DB = {
      ulipristal: {
        id: 'ulipristal',
        brands: 'Femelle One / EllaOne',
        shortName: 'Acetato de Ulipristal 30 mg',
        pharmacologicalClass: 'Modulador Selectivo del Receptor de Progesterona (SPRM)',
        windowHours: 120,
        halfLifeHours: 32,
        ovulationShiftDays: 5,
        expectedPeriodDelayDays: 3,
        extendedDelayMaxDays: 7,
        withdrawalBleedRange: null,
        bbtThermogenicDays: 0,
        mechanism: 'Retrasa la ruptura folicular al menos 5 días incluso cuando ya inició el ascenso de LH, antes del pico máximo.',
        cycleEffect: 'Mueve la ventana fértil +5 días hacia adelante y retrasa la siguiente regla un promedio de +2 a +3 días (hasta +7d en ~20% de casos). No suele causar sangrado inmediato.',
        postTakeRule: 'No tomar progestinas (Postday o pastillas diarias) en los siguientes 5 días (regla FSRH) porque anulan el efecto del Ulipristal. Usar condón hasta la próxima regla.',
        bmiNote: 'Mantiene eficacia alta hasta IMC ~30–35 kg/m².'
      },
      levonorgestrel: {
        id: 'levonorgestrel',
        brands: 'Postday / Glanique / Oportuna',
        shortName: 'Levonorgestrel 1.5 mg',
        pharmacologicalClass: 'Progestina sintética pura',
        windowHours: 72,
        halfLifeHours: 27,
        ovulationShiftDays: 3,
        expectedPeriodDelayDays: 2,
        extendedDelayMaxDays: 5,
        withdrawalBleedRange: [3, 7],
        bbtThermogenicDays: 5,
        mechanism: 'Inhibe o retrasa el pico de LH únicamente si se administra antes del inicio del ascenso de LH. No detiene la ovulación una vez iniciado el pico.',
        cycleEffect: 'Suele provocar sangrado por deprivación entre 3 y 7 días después de la toma (que no reinicia el Día 1 si ocurre antes del Día 18) y desplaza la regla ±3 a 5 días.',
        postTakeRule: 'Eleva artificialmente la temperatura basal (BBT) durante 2 a 5 días por efecto termogénico. Usar condón hasta confirmar menstruación real.',
        bmiNote: 'Su eficacia puede disminuir en IMC > 25–30 kg/m².'
      }
    };

    function resolvePillKind(ev) {
      if (!ev) return 'levonorgestrel';
      if (ev.pillKind && PHARMACOLOGY_DB[ev.pillKind]) return ev.pillKind;
      const txt = `${ev.title || ''} ${ev.details || ''}`.toLowerCase();
      if (txt.includes('ulipristal') || txt.includes('femelle') || txt.includes('ellaone')) return 'ulipristal';
      return 'levonorgestrel';
    }

    // Estaciones y pantallas de bienvenida
    function getCurrentSeason() {
      const m = new Date().getMonth();
      if (m === 11 || m === 0 || m === 1) return 'winter';
      if (m >= 2 && m <= 4) return 'spring';
      if (m >= 5 && m <= 7) return 'summer';
      return 'winter';
    }

    const SEASON_SPLASHES = {
      winter: [
        { badge: 'Espacio Privado • Invierno', greeting: 'Hola, Angie ✨', subtitle: 'Tu rincón cálido y seguro', bg: 'linear-gradient(155deg, #FFF5F8 0%, #EEF4FF 55%, #FFF7F0 100%)', orb1: '#FF96B0', orb2: '#93C5FD', titleGrad: 'from-[#E94B77] to-[#5B4BDB]', emojis: ['❄️', '✨', '💖'] },
        { badge: 'Bienestar & Calma', greeting: 'Qué bonito verte 🌸', subtitle: 'Cuidándote en cada etapa', bg: 'linear-gradient(155deg, #FDF2F8 0%, #F5F3FF 55%, #FFFBEB 100%)', orb1: '#F472B6', orb2: '#A78BFA', titleGrad: 'from-[#DB2777] to-[#7C3AED]', emojis: ['🧸', '🌙', '✨'] }
      ],
      spring: [
        { badge: 'Espacio Privado • Primavera', greeting: 'Hola, Angie 🌸', subtitle: 'Floreciendo a tu propio ritmo', bg: 'linear-gradient(155deg, #FFF5F8 0%, #ECFDF5 55%, #FFFBEB 100%)', orb1: '#FF96B0', orb2: '#6EE7B7', titleGrad: 'from-[#E94B77] to-[#10B981]', emojis: ['🌸', '🦋', '✨'] }
      ],
      summer: [
        { badge: 'Espacio Privado • Verano', greeting: 'Hola, Angie ☀️', subtitle: 'Tu espacio ligero y seguro', bg: 'linear-gradient(155deg, #FFF7ED 0%, #FFF5F8 55%, #FEFCE8 100%)', orb1: '#FDBA74', orb2: '#FF96B0', titleGrad: 'from-[#EA580C] to-[#E94B77]', emojis: ['☀️', '🍓', '✨'] }
      ],
      autumn: [
        { badge: 'Espacio Privado • Otoño', greeting: 'Hola, Angie 🍂', subtitle: 'Tu refugio cálido cada día', bg: 'linear-gradient(155deg, #FFF7ED 0%, #FDF2F8 55%, #FEF3C7 100%)', orb1: '#F59E0B', orb2: '#F472B6', titleGrad: 'from-[#D97706] to-[#E94B77]', emojis: ['🍂', '☕', '💖'] }
      ]
    };

    const SOS_OPTIONS = [
      { id: 'cramps', emoji: '🧸', label: 'Cólicos', note: 'Necesita apapacho, bolsa caliente o té.' },
      { id: 'craving', emoji: '🍫', label: 'Antojo dulce', note: 'Se le antojó algo rico o chocolate.' },
      { id: 'hug', emoji: '🤍', label: 'Abrazo', note: 'Día sensible: necesita compañía tranquila.' },
      { id: 'tired', emoji: '😴', label: 'Sin batería', note: 'Energía baja hoy, plan relajado.' }
    ];

    const JORGE_PING_OPTIONS = [
      { id: 'thinking', emoji: '💌', label: 'Pensando en ti', note: 'Jorge te mandó un recordatorio de cariño.' },
      { id: 'snack', emoji: '🍓', label: '¿Antojo?', note: 'Jorge pregunta qué se te antoja hoy.' },
      { id: 'onway', emoji: '🚗', label: 'En camino', note: 'Jorge va en camino a verte.' }
    ];

    const SELFCARE_ROULETTE = {
      menstrual: ['Té caliente de manzanilla y manta suave', '15 min de estiramientos suaves de espalda baja', 'Ver tu peli favorita sin culpa', 'Compresa tibia en el abdomen 20 min'],
      folicular: ['Caminata al aire libre con música favorita', 'Probar una receta fresca o smoothie', 'Organizar una idea creativa nueva', 'Bailar 2 canciones que te suban el ánimo'],
      ovulatory: ['Planear una cita o salida especial', 'Hacer tu rutina favorita de ejercicio', 'Tomarte fotos bonitas hoy', 'Compartir un momento divertido juntos'],
      luteal: ['Baño tibio relajante antes de dormir', 'Escribir 3 cosas buenas de tu semana', 'Snack saludable con chocolate amargo', 'Desconectarte de pantallas 30 min antes']
    };

    const DEFAULT_COUPONS = [
      { id: 'cp_massage', title: 'Vale por 20 min de masaje', subtitle: 'Canjeable cualquier día de cólicos o cansancio' },
      { id: 'cp_craving', title: 'Vale por tu antojo favorito', subtitle: 'Postre, café o cena elegida 100% por ti' },
      { id: 'cp_movie', title: 'Noche de peli y apapacho', subtitle: 'Tú eliges la película y los snacks' }
    ];

    const FOOD_MENU = [
      { id: 'tea', icon: '🍵', label: 'Té tibio', cost: 0, hunger: 12, mood: 8, energy: 6 },
      { id: 'berry', icon: '🍓', label: 'Fresas', cost: 5, hunger: 20, mood: 12, energy: 10 },
      { id: 'choco', icon: '🍫', label: 'Chocolate', cost: 10, hunger: 25, mood: 20, energy: 15 }
    ];

    const ACCESSORY_SHOP = [
      { id: 'santa_hat', icon: '🎅', label: 'Gorrito', cost: 0 },
      { id: 'bow', icon: '🎀', label: 'Moñito', cost: 15 },
      { id: 'crown', icon: '👑', label: 'Corona', cost: 30 },
      { id: 'glasses', icon: '🕶️', label: 'Lentecitos', cost: 25 }
    ];

    const ROOM_CATALOG = [
      { id: 'w_01', cat: 'wall', icon: '🌸', label: 'Pared Rosa', cost: 0, bg: 'from-rose-100 to-purple-100' },
      { id: 'w_02', cat: 'wall', icon: '🌌', label: 'Noche Estrellada', cost: 20, bg: 'from-indigo-200 to-purple-200' },
      { id: 'r_01', cat: 'rug', icon: '🧶', label: 'Tapete Crema', cost: 0 },
      { id: 'r_02', cat: 'rug', icon: '💖', label: 'Tapete Corazón', cost: 15 },
      { id: 'win_01', cat: 'window', icon: '🪟', label: 'Ventana Día', cost: 0 },
      { id: 'win_02', cat: 'window', icon: '🌙', label: 'Ventana Luna', cost: 15 },
      { id: 'sh_01', cat: 'shelf', icon: '📚', label: 'Repisa Libros', cost: 0 },
      { id: 'sh_02', cat: 'shelf', icon: '🪴', label: 'Plantitas', cost: 15 },
      { id: 'd_01', cat: 'decor', icon: '🕯️', label: 'Velita', cost: 0 },
      { id: 'd_02', cat: 'decor', icon: '🧸', label: 'Osito', cost: 20 }
    ];

    // =========================================================================
    // COMPONENTES VISUALES DE FONDO Y MASCOTA LUMI
    // =========================================================================
    const AnimatedPhaseBackground = ({ phaseKey, viewMode, discreetMode }) => {
      const bgStyle = discreetMode
        ? 'linear-gradient(155deg, #F8FAFC 0%, #F1F5F9 100%)'
        : viewMode === 'jorge'
          ? 'linear-gradient(155deg, #EEF2FF 0%, #F5F3FF 50%, #FFF5F8 100%)'
          : phaseKey === 'menstrual'
            ? 'linear-gradient(155deg, #FFF1F5 0%, #FCE7F3 50%, #FFF7F0 100%)'
            : phaseKey === 'ovulatory'
              ? 'linear-gradient(155deg, #FFFBEB 0%, #FFF5F8 50%, #FEF3C7 100%)'
              : 'linear-gradient(155deg, #ECFDF5 0%, #F5F3FF 50%, #FFF5F8 100%)';

      return (
        <div className="fixed inset-0 -z-10 pointer-events-none overflow-hidden transition-all duration-700" style={{ background: bgStyle }}>
          <div className="absolute -top-24 -left-24 w-80 h-80 rounded-full bg-pink-200/35 blur-3xl animate-blob-1"></div>
          <div className="absolute top-1/2 -right-24 w-80 h-80 rounded-full bg-indigo-200/30 blur-3xl animate-blob-2"></div>
        </div>
      );
    };

    const LumiMascot = ({ phaseKey, viewMode, animState = 'idle', onTap, size = 'w-20 h-20', equipped = [], sleeping = false }) => {
      const bodyColor = viewMode === 'jorge' ? '#818CF8' : phaseKey === 'menstrual' ? '#FB7185' : phaseKey === 'ovulatory' ? '#FBBF24' : '#34D399';
      return (
        <button
          type="button"
          onClick={onTap}
          className={`${size} relative flex items-center justify-center select-none focus:outline-none ${animState === 'bounce' ? 'animate-lumi-bounce' : 'animate-lumi-idle'}`}
        >
          <svg viewBox="0 0 120 120" className="w-full h-full drop-shadow-md">
            <ellipse cx="42" cy="28" rx="10" ry="18" fill={bodyColor} transform="rotate(-12 42 28)" />
            <ellipse cx="78" cy="28" rx="10" ry="18" fill={bodyColor} transform="rotate(12 78 28)" />
            <circle cx="60" cy="66" r="38" fill={bodyColor} />
            <ellipse cx="60" cy="72" rx="28" ry="22" fill="#FFFFFF" opacity="0.92" />
            {sleeping ? (
              <g stroke="#2D2229" strokeWidth="3" fill="none" strokeLinecap="round">
                <path d="M42 66 Q48 71 54 66" />
                <path d="M66 66 Q72 71 78 66" />
              </g>
            ) : (
              <g fill="#2D2229">
                <circle cx="48" cy="65" r="4.2" />
                <circle cx="72" cy="65" r="4.2" />
                <circle cx="49.5" cy="63.5" r="1.4" fill="#FFFFFF" />
                <circle cx="73.5" cy="63.5" r="1.4" fill="#FFFFFF" />
              </g>

            <ellipse cx="39" cy="73" rx="5" ry="3" fill="#FDA4AF" opacity="0.8" />
            <ellipse cx="81" cy="73" rx="5" ry="3" fill="#FDA4AF" opacity="0.8" />
            <path d="M55 74 Q60 79 65 74" stroke="#2D2229" strokeWidth="2.8" fill="none" strokeLinecap="round" />

            {equipped.includes('bow') && <text x="82" y="34" textAnchor="middle" fontSize="20">🎀</text>}
            {equipped.includes('santa_hat') && <text x="60" y="24" textAnchor="middle" fontSize="22">🎅</text>}
            {equipped.includes('glasses') && <text x="60" y="71" textAnchor="middle" fontSize="22">🕶️</text>}
          </svg>
        </button>
      );
    };

    const LumiRoomTab = ({ phaseKey, viewMode, settings, onFeed, onPetCare, onToggleSleep, onBuyOrToggleAcc, onEquipRoomItem }) => {
      const pet = settings.lumiPet || { hunger: 80, energy: 85, happiness: 90, sleeping: false };
      const unlockedAcc = settings.unlockedAccessories || [];
      const equipped = settings.equipped || [];
      const unlockedRoom = settings.unlockedRoom || ['w_01', 'r_01', 'win_01', 'sh_01', 'd_01'];
      const roomEq = settings.roomEquipped || { wall: 'w_01', rug: 'r_01', window: 'win_01', shelf: 'sh_01', decor: 'd_01' };
      const activeWall = ROOM_CATALOG.find(w => w.id === roomEq.wall) || ROOM_CATALOG[0];

      return (
        <div className="space-y-4">
          <div className={`rounded-[30px] p-5 bg-gradient-to-br ${activeWall.bg} border border-white shadow-lg relative overflow-hidden`}>
            <div className="flex items-center justify-between text-xs font-extrabold text-[#2D2229] mb-2">
              <span>🏠 Cuarto de Lumi</span>
              <span className="liquid-pill px-3 py-1 rounded-full text-[#E94B77]">✨ {settings.lumiPoints || 0} pts</span>
            </div>

            <div className="flex items-center justify-between px-3 py-2 text-2xl">
              <span>{ROOM_CATALOG.find(x => x.id === roomEq.window)?.icon || '🪟'}</span>
              <span>{ROOM_CATALOG.find(x => x.id === roomEq.shelf)?.icon || '📚'}</span>
            </div>

            <div className="flex flex-col items-center justify-center py-3 relative">
              <LumiMascot phaseKey={phaseKey} viewMode={viewMode} onTap={onPetCare} size="w-28 h-28" equipped={equipped} sleeping={pet.sleeping} />
              <div className="mt-1 text-xl">{ROOM_CATALOG.find(x => x.id === roomEq.rug)?.icon || '🧶'} {ROOM_CATALOG.find(x => x.id === roomEq.decor)?.icon || '🕯️'}</div>
            </div>

            <div className="grid grid-cols-3 gap-2 mt-2 text-[10px] font-extrabold text-center">
              <div className="bg-white/80 rounded-2xl p-2">🍓 Saciedad: {pet.hunger}%</div>

    // =========================================================================
    // MINI-JUEGOS Y GRÁFICA DE TEMPERATURA BASAL
    // =========================================================================
    const CatchGiftGameModal = ({ onClose, onWin }) => {
      const [timeLeft, setTimeLeft] = useState(18);
      const [score, setScore] = useState(0);
      const [giftPos, setGiftPos] = useState({ top: 35, left: 45, emoji: '🎁' });

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(t => {

      }, []);

      const tapGift = () => {
        if (timeLeft <= 0) return;
        const icons = ['🎁', '💖', '🍓', '✨'];
        setScore(s => s + 1);
        setGiftPos({
          top: 15 + Math.floor(Math.random() * 65),
          left: 12 + Math.floor(Math.random() * 72),
          emoji: icons[Math.floor(Math.random() * icons.length)]
        });

      return (

          <div className="liquid-glass rounded-[34px] max-w-sm w-full p-5 shadow-2xl animate-sheet space-y-3">
            <div className="flex items-center justify-between text-xs font-extrabold">
              <span>🎁 Atrapa el Regalo</span>

                  onClick={tapGift}

                  className="absolute text-3xl transition-all duration-150 active:scale-125"
                >

                </button>
              </div>
            ) : (
              <div className="py-6 text-center bg-white/80 rounded-3xl space-y-2">
                <p className="text-2xl">🎉</p>
                <p className="text-sm font-extrabold">¡Atrapaste {score} regalos!</p>
                <button onClick={() => { onWin(Math.max(10, score * 2), score >= 10); onClose(); }} className="px-5 py-2.5 rounded-full bg-[#E94B77] text-white text-xs font-extrabold">
                  Reclamar +{Math.max(10, score * 2)} pts
                </button>

      );
    };

    const MemoryGameModal = ({ onClose, onWin }) => {
      const symbols = ['❄️', '💖', '🍓', '🌙', '🧸', '✨'];
      const [cards, setCards] = useState(() =>
        [...symbols, ...symbols].sort(() => Math.random() - 0.5).map((sym, idx) => ({ id: idx, sym, flipped: false, matched: false }))
      );
      const [selected, setSelected] = useState([]);
      const allMatched = cards.every(c => c.matched);

      const handleFlip = (idx) => {
        if (selected.length === 2 || cards[idx].flipped || cards[idx].matched) return;
        const next = cards.map((c, i) => i === idx ? { ...c, flipped: true } : c);
        const nextSel = [...selected, idx];
        setCards(next);
        setSelected(nextSel);

        if (nextSel.length === 2) {
          const [a, b] = nextSel;
          if (next[a].sym === next[b].sym) {
            setTimeout(() => {
              setCards(prev => prev.map((c, i) => (i === a || i === b) ? { ...c, matched: true } : c));
              setSelected([]);
            }, 300);
          } else {
            setTimeout(() => {
              setCards(prev => prev.map((c, i) => (i === a || i === b) ? { ...c, flipped: false } : c));
              setSelected([]);
            }, 650);
          }
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-md flex items-center justify-center p-5 z-50">
          <div className="liquid-glass rounded-[34px] max-w-sm w-full p-5 shadow-2xl animate-sheet space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-extrabold text-[#2D2229]">❄️ Memorama Invernal</span>
              <span className="text-xs font-bold text-[#5B4BDB]">{cards.filter(c => c.matched).length / 2}/6 pares</span>
            </div>
            {!allMatched ? (
              <div className="grid grid-cols-4 gap-2">
                {cards.map((c, idx) => (
                  <button key={c.id} onClick={() => handleFlip(idx)} className={`h-16 rounded-2xl text-2xl flex items-center justify-center font-bold transition ${c.flipped || c.matched ? 'bg-white shadow-sm' : 'bg-[#E94B77] text-white'}`}>
                    {c.flipped || c.matched ? c.sym : '?'}
                  </button>
                ))}
              </div>
            ) : (
              <div className="py-5 text-center bg-white/80 rounded-3xl space-y-2">
                <p className="text-2xl">🏆</p>
                <p className="text-sm font-extrabold">¡Completaste todos los pares!</p>
                <button onClick={() => { onWin(25, true); onClose(); }} className="px-5 py-2.5 rounded-full bg-[#E94B77] text-white text-xs font-extrabold">Reclamar premio</button>
              </div>
            )}
            {!allMatched && <button onClick={onClose} className="w-full py-2.5 rounded-full liquid-pill text-xs font-bold text-[#6B5460]">Salir</button>}
          </div>
        </div>
      );
    };

    const SimonGameModal = ({ onClose, onWin }) => {
      const pads = [
        { id: 0, color: 'bg-rose-400', active: 'bg-rose-200 scale-105', emoji: '❤️' },
        { id: 1, color: 'bg-emerald-400', active: 'bg-emerald-200 scale-105', emoji: '🎄' },
        { id: 2, color: 'bg-amber-400', active: 'bg-amber-200 scale-105', emoji: '⭐' },
        { id: 3, color: 'bg-indigo-400', active: 'bg-indigo-200 scale-105', emoji: '❄️' }
      ];
      const [seq, setSeq] = useState([Math.floor(Math.random() * 4)]);
      const [userIdx, setUserIdx] = useState(0);
      const [lit, setLit] = useState(null);
      const [playingSeq, setPlayingSeq] = useState(true);
      const [status, setStatus] = useState('playing');

      const playSequence = (list) => {
        setPlayingSeq(true);
        list.forEach((padId, i) => {
          setTimeout(() => setLit(padId), i * 600 + 300);
          setTimeout(() => setLit(null), i * 600 + 650);
        });
        setTimeout(() => setPlayingSeq(false), list.length * 600 + 700);
      };

      useEffect(() => { playSequence(seq); }, [seq]);

      const handlePad = (id) => {
        if (playingSeq || status !== 'playing') return;
        setLit(id);
        setTimeout(() => setLit(null), 220);

        if (id !== seq[userIdx]) { setStatus('lost'); return; }
        if (userIdx + 1 === seq.length) {
          if (seq.length >= 5) setStatus('won');
          else {
            setUserIdx(0);
            setSeq(prev => [...prev, Math.floor(Math.random() * 4)]);
          }
        } else {
          setUserIdx(u => u + 1);
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-md flex items-center justify-center p-5 z-50">
          <div className="liquid-glass rounded-[34px] max-w-sm w-full p-5 shadow-2xl animate-sheet space-y-3">
            <div className="flex items-center justify-between">
              <span className="text-xs font-extrabold text-[#2D2229]">🎵 Secuencia Lumi</span>
              <span className="text-xs font-bold text-[#E94B77]">Nivel {seq.length}/5</span>
            </div>
            {status === 'playing' ? (
              <div className="space-y-2">
                <p className="text-[11px] font-bold text-center text-[#6B5460]">{playingSeq ? 'Observa la secuencia...' : '¡Tu turno! Repítela'}</p>
                <div className="grid grid-cols-2 gap-3">
                  {pads.map(p => (
                    <button key={p.id} type="button" onClick={() => handlePad(p.id)} className={`h-24 rounded-3xl text-3xl flex items-center justify-center transition shadow-md ${lit === p.id ? p.active : p.color}`}>
                      {p.emoji}
                    </button>
                  ))}
                </div>
              </div>
            ) : (
              <div className="py-5 text-center space-y-2 bg-white/80 rounded-3xl p-4">
                <p className="text-2xl">{status === 'won' ? '🌟' : '😅'}</p>
                <p className="text-sm font-extrabold text-[#2D2229]">{status === 'won' ? '¡Memoria perfecta!' : `Llegaste al nivel ${seq.length}`}</p>
                <p className="text-xs font-bold text-[#E94B77]">+{status === 'won' ? 30 : seq.length * 4} pts {status === 'won' ? '+ 1 Decoración sorpresa 🎁' : ''}</p>
                <button onClick={() => { onWin(status === 'won' ? 30 : seq.length * 4, status === 'won'); onClose(); }} className="mt-2 w-full py-2.5 rounded-full bg-[#E94B77] text-white text-xs font-extrabold">Reclamar</button>
              </div>
            )}
            {status === 'playing' && <button onClick={onClose} className="w-full py-2.5 rounded-full liquid-pill text-xs font-bold text-[#6B5460]">Salir</button>}
          </div>
        </div>
      );
    };

    const BreathingGameModal = ({ onClose, onCompleteSession }) => {
      const [secondsLeft, setSecondsLeft] = useState(45);
      const [cycleSec, setCycleSec] = useState(0);

      useEffect(() => {
        const t = setInterval(() => {
          setSecondsLeft(prev => {
            if (prev <= 1) { clearInterval(t); onCompleteSession(); return 0; }
            return prev - 1;
          });
          setCycleSec(c => (c + 1) % 14);
        }, 1000);
        return () => clearInterval(t);
      }, []);

      const phaseInfo = cycleSec < 4
        ? { label: 'Inhala suave', scale: 'scale-110', bg: 'from-[#FF8DA8] to-[#E94B77]' }
        : cycleSec < 8
          ? { label: 'Sostén', scale: 'scale-110', bg: 'from-[#A78BFA] to-[#6366F1]' }
          : { label: 'Exhala lento', scale: 'scale-90', bg: 'from-[#5ED4A8] to-[#1F9D74]' };

      return (
        <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-center justify-center p-5 z-50">
          <div className="liquid-glass rounded-[34px] max-w-sm w-full p-6 shadow-2xl animate-sheet text-center space-y-4">
            <div className="flex items-center justify-between">
              <span className="text-[11px] font-extrabold uppercase tracking-wider text-[#E94B77]">Respiración 4-4-6</span>
              <span className="text-xs font-bold text-[#8C7380]">{secondsLeft}s</span>
            </div>
            <div className="py-5 flex items-center justify-center">
              <div className={`w-40 h-40 rounded-full bg-gradient-to-br ${phaseInfo.bg} text-white flex flex-col items-center justify-center shadow-xl transition-transform duration-1000 ${phaseInfo.scale}`}>
                <span className="text-sm font-extrabold">{phaseInfo.label}</span>
                <span className="text-[11px] text-white/85 mt-1">Respira con calma</span>
              </div>
            </div>
            <button onClick={onClose} className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-bold">Cerrar</button>
          </div>
        </div>
      );
    };

    const ScratchCouponCard = ({ coupon, scratched, onScratch, onDelete }) => {
      const canvasRef = useRef(null);
      const drawingRef = useRef(false);

      useEffect(() => {
        if (scratched || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = 280;
        canvas.height = 92;
        ctx.fillStyle = '#E94B77';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Rasca aquí para revelar tu cupón', canvas.width / 2, canvas.height / 2 + 4);
      }, [scratched]);

      const handleMove = (clientX, clientY) => {
        if (scratched || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = ((clientX - rect.left) / rect.width) * canvas.width;
        const y = ((clientY - rect.top) / rect.height) * canvas.height;
        const ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.fill();

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let transparent = 0;
        for (let i = 3; i < data.length; i += 4) if (data[i] === 0) transparent++;
        if (transparent / (data.length / 4) > 0.35) onScratch(coupon.id);
      };

      return (
        <div className="relative rounded-2xl bg-gradient-to-r from-white/85 to-[#FFE4EC]/85 border border-white p-3.5 pr-10 overflow-hidden min-h-[92px] flex flex-col justify-center">
          <p className="text-xs font-extrabold text-[#2D2229]">{coupon.title}</p>
          <p className="text-[11px] text-[#7A6370] mt-0.5">{coupon.subtitle}</p>
          {scratched && <span className="inline-block mt-1 text-[10px] font-extrabold text-emerald-700">✓ Revelado</span>}
          {!scratched && (
            <canvas
              ref={canvasRef}
              onMouseDown={() => { drawingRef.current = true; }}
              onMouseUp={() => { drawingRef.current = false; }}
              onMouseLeave={() => { drawingRef.current = false; }}
              onMouseMove={(e) => { if (drawingRef.current) handleMove(e.clientX, e.clientY); }}
              onTouchStart={(e) => { if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY); }}
              onTouchMove={(e) => { if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY); }}
              className="absolute inset-0 w-full h-full cursor-pointer touch-none"
            />
          )}
          {onDelete && (
            <button
              type="button"
              onClick={(e) => { e.stopPropagation(); onDelete(coupon.id); }}
              title="Eliminar cupón"
              className={`absolute top-2 right-2 z-10 w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-extrabold transition active:scale-90 ${scratched ? 'bg-white/90 text-[#8C7380] shadow-xs' : 'bg-black/25 text-white'}`}
            >✕</button>
          )}
        </div>
      );
    };

    const BbtChart = ({ logs, coverline }) => {
      if (!logs || logs.length < 2) {
        return <div className="text-xs text-[#7A6370] py-4 text-center bg-white/55 rounded-2xl">Registra al menos 2 temperaturas basales (°C) para ver tu curva térmica.</div>;
      }
      const recent = logs.slice(-14);
      const temps = recent.map(l => l.temp);
      const minT = Math.min(...temps, coverline || 36.2) - 0.15;
      const maxT = Math.max(...temps, coverline || 36.8) + 0.15;
      const range = Math.max(0.4, maxT - minT);
      const w = 320, h = 135, padX = 24, padY = 18;
      const getX = (i) => padX + (i / Math.max(1, recent.length - 1)) * (w - padX * 2);
      const getY = (t) => h - padY - ((t - minT) / range) * (h - padY * 2);
      const cleanPoints = recent.map((l, i) => ({ ...l, x: getX(i), y: getY(l.temp) }));
      const linePath = cleanPoints.filter(p => !p.noisy).map((p, idx) => `${idx === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

      return (
        <div className="w-full overflow-hidden space-y-1.5">
          <svg viewBox={`0 0 ${w} ${h}`} className="w-full h-auto">
            {coverline && (
              <g>
                <line x1={padX} y1={getY(coverline)} x2={w - padX} y2={getY(coverline)} stroke="#E94B77" strokeWidth="1.3" strokeDasharray="4 4" opacity="0.7" />
                <text x={w - padX} y={getY(coverline) - 4} textAnchor="end" fontSize="9" fill="#E94B77" fontWeight="700">Línea base {coverline}°C</text>
              </g>
            )}
            {linePath && <path d={linePath} fill="none" stroke="#5B4BDB" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round" />}
            {cleanPoints.map((p, i) => (
              <g key={i}>
                <circle cx={p.x} cy={p.y} r={p.noisy ? 3.8 : 4.2} fill={p.thermogenicNoise ? '#F59E0B' : p.noisy ? '#CBD5E1' : '#5B4BDB'} stroke="#FFFFFF" strokeWidth="1.5" />
                <text x={p.x} y={h - 3} textAnchor="middle" fontSize="8" fill="#8C7380">{p.date.slice(8)}</text>
              </g>
            ))}
          </svg>
          <div className="flex flex-wrap items-center gap-3 text-[10px] font-bold text-[#7A6370]">
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-[#5B4BDB]"></span>BBT válida</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-amber-500"></span>Excluida por Levonorgestrel (+5d)</span>
            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-slate-300"></span>Mal sueño</span>
          </div>
        </div>
      );
    };

    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        home: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 10.5L12 3l9 7.5V20a1 1 0 01-1 1h-5.5v-6.5h-5V21H4a1 1 0 01-1-1v-9.5z" />,
        calendar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
        lumi: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 21s-7-4.35-7-10a4 4 0 017-2.65A4 4 0 0119 11c0 5.65-7 10-7 10z" />,
        games: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664zM21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,
        chart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 19h16M7 16V9m5 7V5m5 11v-4" />,
        settings: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15a3 3 0 100-6 3 3 0 000 6zm7.4-3a7.4 7.4 0 00-.1-1.3l2-1.5-2-3.4-2.4 1a7.6 7.6 0 00-2.2-1.3L14.3 3h-4.6l-.4 2.5a7.6 7.6 0 00-2.2 1.3l-2.4-1-2 3.4 2 1.5a7.4 7.4 0 000 2.6l-2 1.5 2 3.4 2.4-1a7.6 7.6 0 002.2 1.3l.4 2.5h4.6l.4-2.5a7.6 7.6 0 002.2-1.3l2.4 1 2-3.4-2-1.5c.1-.4.1-.9.1-1.3z" />,
        eyeOff: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-5 0-9-4-9-7 0-1.1.5-2.3 1.4-3.4M6.2 6.2A9.9 9.9 0 0112 5c5 0 9 4 9 7 0 1.4-.8 3-2.2 4.3M3 3l18 18" />,
        bell: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.4-1.4A2 2 0 0118 14.2V11a6 6 0 10-12 0v3.2a2 2 0 01-.6 1.4L4 17h5m6 0a3 3 0 01-6 0" />,
        drop: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z" />,
        chevLeft: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M15 19l-7-7 7-7" />,
        chevRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M9 5l7 7-7 7" />
      };
      return <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" className={className}>{icons[name]}</svg>;

    // =========================================================================

    function getTodayLocal() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }
    function parseLocalDate(dateStr) {
      const [y, m, d] = (dateStr || getTodayLocal()).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }
    function formatDateES(dateStr, includeYear = true) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      return includeYear ? `${d} de ${months[m - 1]} ${y}` : `${d} de ${months[m - 1]}`;
    }
    function formatMonthYear(dateStr) {
      const [y, m] = dateStr.split('-').map(Number);
      const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      return `${months[m - 1]} ${y}`;
    }
    function addDays(dateStr, days) {
      const dt = parseLocalDate(dateStr);
      dt.setDate(dt.getDate() + days);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    }
    function diffDays(startStr, endStr) {
      return Math.round((parseLocalDate(endStr) - parseLocalDate(startStr)) / (1000 * 60 * 60 * 24));
    }

    function mergeEventsById(localList, remoteList, deletedIds = []) {
      const deletedSet = new Set(deletedIds);
      const map = new Map();
      [...localList, ...remoteList].forEach(ev => {
        if (!ev || !ev.id || deletedSet.has(ev.id)) return;
        const prev = map.get(ev.id);
        if (!prev || (ev.updatedAt || 0) >= (prev.updatedAt || 0)) {
          map.set(ev.id, ev);
        }
      });
      return Array.from(map.values()).sort((a, b) => b.date.localeCompare(a.date));
    }

          const curr = periodStarts[i];
          const next = periodStarts[i + 1];
          const length = next ? diffDays(curr.date, next.date) : null;
          const pillsBetween = next
            ? events.filter(ev => ev.type === 'pill' && ev.date >= curr.date && ev.date < next.date)
            : [];
          const hasPillBetween = pillsBetween.length > 0;

          let bleedDays = 1;
          while (periodDaySet.has(addDays(curr.date, bleedDays)) && bleedDays < 12) bleedDays++;
          const estimatedBleedDays = bleedDays > 1 ? bleedDays : 5;

          const isOutOfFigoRange = length !== null && (
            length < CLINICAL_STANDARDS.figo.minNormalCycleDays ||
            length > CLINICAL_STANDARDS.figo.maxNormalCycleDays
          );
          const isAltered = Boolean(hasPillBetween || curr.alteredCycle || next?.alteredCycle || isOutOfFigoRange);

          if (length !== null && !isAltered) rawNaturalLengths.push(length);

          if (next) {
            const lhEvent = events.find(ev => (ev.tags || []).includes('test_ov_pos') && ev.date >= curr.date && ev.date < next.date);
            if (lhEvent) {
              const luteal = diffDays(addDays(lhEvent.date, 1), next.date);
              if (luteal >= CLINICAL_STANDARDS.luteal.minPhysiologicalDays && luteal <= CLINICAL_STANDARDS.luteal.maxPhysiologicalDays) {
                observedLutealLengths.push(luteal);
              }
            }
          }

          historyRows.push({
            id: curr.id,
            start: curr.date,
            end: addDays(curr.date, estimatedBleedDays - 1),
            bleedDays: estimatedBleedDays,
            length,
            isAltered,
            pillsUsed: pillsBetween.map(p => PHARMACOLOGY_DB[resolvePillKind(p)].brands)
          });
        }

        let cleanLengths = [...rawNaturalLengths];
        if (cleanLengths.length >= 4) {
          const mean0 = cleanLengths.reduce((a, b) => a + b, 0) / cleanLengths.length;
          const sd0 = Math.sqrt(cleanLengths.reduce((a, b) => a + Math.pow(b - mean0, 2), 0) / cleanLengths.length) || 1;
          const filtered = cleanLengths.filter(x => Math.abs(x - mean0) <= 2 * sd0);
          if (filtered.length >= 2) cleanLengths = filtered;
        }

        let ewmaCycle = 28;
        if (cleanLengths.length > 0) {
          ewmaCycle = cleanLengths[0];
          for (let i = 1; i < cleanLengths.length; i++) ewmaCycle = 0.35 * cleanLengths[i] + 0.65 * ewmaCycle;
        }
        const predictedCycleLength = Math.round(ewmaCycle);
        const stdDev = cleanLengths.length >= 2
          ? Number(Math.sqrt(cleanLengths.reduce((a, b) => a + Math.pow(b - ewmaCycle, 2), 0) / cleanLengths.length).toFixed(1))
          : 2.0;
        const marginDays = Math.max(1, Math.min(5, Math.round(stdDev)));
        const lutealLength = observedLutealLengths.length > 0
          ? Math.round(observedLutealLengths.reduce((a, b) => a + b, 0) / observedLutealLengths.length)
          : CLINICAL_STANDARDS.luteal.defaultDays;

        const peakOvulationOffset = Math.max(10, predictedCycleLength - lutealLength);

        const lngDates = events
          .filter(ev => ev.type === 'pill' && resolvePillKind(ev) === 'levonorgestrel')
          .map(ev => ev.date);

        const tempLogs = events
          .filter(ev => typeof ev.bbt === 'number' && !Number.isNaN(ev.bbt))
          .map(ev => {
            const poorSleep = (ev.tags || []).includes('poor_sleep');
            const thermogenicNoise = lngDates.some(pDate => {
              const d = diffDays(pDate, ev.date);
              return d >= 0 && d <= PHARMACOLOGY_DB.levonorgestrel.bbtThermogenicDays;
            });
            return {
              date: ev.date,
              temp: ev.bbt,
              poorSleep,
              thermogenicNoise,
              noisy: poorSleep || thermogenicNoise
            };
          })
          .sort((a, b) => a.date.localeCompare(b.date));

        const cleanTemps = tempLogs.filter(x => !x.noisy);
        let coverline = null;
        let thermalConfirmedDate = null;
        if (cleanTemps.length >= 9) {
          for (let i = 6; i <= cleanTemps.length - 3; i++) {
            const highest6 = Math.max(...cleanTemps.slice(i - 6, i).map(x => x.temp));
            if (
              cleanTemps[i].temp > highest6 &&
              cleanTemps[i + 1].temp > highest6 &&
              cleanTemps[i + 2].temp >= highest6 + CLINICAL_STANDARDS.bbt.thirdDayElevationCelsius
            ) {
              coverline = Number(highest6.toFixed(2));
              thermalConfirmedDate = cleanTemps[i + 2].date;
            }
          }
        }
        if (coverline === null && cleanTemps.length > 0) {
          coverline = Number((cleanTemps.reduce((a, c) => a + c.temp, 0) / cleanTemps.length).toFixed(2));
        }

        const isFigoRegular = stdDev <= CLINICAL_STANDARDS.figo.maxRegularityVariationDays / 2;

        return {
          starts,
          periodDaySet,
          withdrawalDaySet,
          historyRows: historyRows.reverse(),
          baseCycleLength: predictedCycleLength,
          stdDev,
          marginDays,
          lutealLength,
          isFigoRegular,
          naturalCyclesUsed: cleanLengths,
          safeFertileStartOffset: Math.max(5, peakOvulationOffset - (5 + Math.min(2, marginDays))),
          peakStartOffset: Math.max(7, peakOvulationOffset - 2),
          peakOvulationOffset,
          peakEndOffset: peakOvulationOffset + 1,
          safeFertileEndOffset: Math.min(predictedCycleLength - 3, peakOvulationOffset + 2),
          tempLogs,
          coverline,
          thermalConfirmedDate
        };
      }, [events, todayStr]);

      // =======================================================================
      // 3. CONVOLUCIÓN EMPÍRICA DE WILCOX + MOTOR FARMACOLÓGICO POR FECHA
      // =======================================================================
      const computeWilcoxConvolvedProbability = (cDay, effectiveOvDay, sigma) => {
        const s = Math.max(1.2, sigma);
        let totalProb = 0;
        let weightSum = 0;
        for (let shift = -6; shift <= 6; shift++) {
          const candidateOv = effectiveOvDay + shift;
          const weight = Math.exp(-(shift * shift) / (2 * s * s));
          const relDay = String(cDay - candidateOv);
          const empiricalP = WILCOX_FERTILITY_VECTOR[relDay] !== undefined ? WILCOX_FERTILITY_VECTOR[relDay] : 0.01;
          totalProb += empiricalP * weight;
          weightSum += weight;
        }
        return Math.max(1, Math.min(33, Math.round((totalProb / (weightSum || 1)) * 100)));
      };

      const evaluateFertilityForDate = (targetDate) => {
        const validStarts = cycleAnalytics.starts.filter(d => d <= targetDate);
        const cycleStart = validStarts.length ? validStarts[validStarts.length - 1] : cycleAnalytics.starts[0];
        const cDay = Math.max(1, diffDays(cycleStart, targetDate) + 1);

        const pillsInCycle = events
          .filter(ev => ev.type === 'pill' && ev.date >= cycleStart && ev.date <= targetDate)
          .sort((a, b) => b.date.localeCompare(a.date));
        const pillInCycle = pillsInCycle[0] || null;

        const lhInCycle = events.find(ev => (ev.tags || []).includes('test_ov_pos') && ev.date >= cycleStart && ev.date <= targetDate);
        const baseOvDay = cycleAnalytics.peakOvulationOffset + 1;
        const sigma = Math.max(1.5, cycleAnalytics.stdDev);

        const dayEvs = events.filter(e => e.date === targetDate);
        const hasEggwhite = dayEvs.some(e => (e.tags || []).includes('discharge_eggwhite'));
        const hasLhPos = dayEvs.some(e => (e.tags || []).includes('test_ov_pos')) || (lhInCycle && diffDays(lhInCycle.date, targetDate) <= 1);
        const hasThermalConfirmed = Boolean(
          cycleAnalytics.thermalConfirmedDate &&
          targetDate >= cycleAnalytics.thermalConfirmedDate &&
          cycleAnalytics.thermalConfirmedDate >= cycleStart
        );

        if (pillInCycle && cDay > 4) {
          const compoundKey = resolvePillKind(pillInCycle);
          const compound = PHARMACOLOGY_DB[compoundKey];
          const daysSincePill = diffDays(pillInCycle.date, targetDate);
          const pillCycleDay = Math.max(1, diffDays(cycleStart, pillInCycle.date) + 1);

          const shiftedOvDay = compoundKey === 'ulipristal' && pillCycleDay <= baseOvDay + 1
            ? baseOvDay + compound.ovulationShiftDays
            : compoundKey === 'levonorgestrel' && pillCycleDay < baseOvDay - 1
              ? baseOvDay + compound.ovulationShiftDays
              : baseOvDay;

          const wilcoxShiftedPct = computeWilcoxConvolvedProbability(cDay, shiftedOvDay, sigma);

          const priorUnprotected = events
            .filter(ev => ev.type === 'intimacy_unprotected' && ev.date <= pillInCycle.date && diffDays(ev.date, pillInCycle.date) <= 7)
            .sort((a, b) => b.date.localeCompare(a.date))[0] || null;
          const intakeDelayDays = priorUnprotected ? diffDays(priorUnprotected.date, pillInCycle.date) : null;
          const intakeWindowStatus = intakeDelayDays === null
            ? 'Sin relación previa registrada'
            : intakeDelayDays * 24 <= compound.windowHours
              ? `En ventana terapéutica (${intakeDelayDays === 0 ? '<24h' : `${intakeDelayDays}d`} ≤ ${compound.windowHours}h)`
              : `Fuera de ventana óptima (${intakeDelayDays}d > ${compound.windowHours}h)`;

          const hasProgestinConflict = pillsInCycle.length >= 2 &&
            pillsInCycle.some(p => resolvePillKind(p) === 'ulipristal') &&
            pillsInCycle.some(p => resolvePillKind(p) === 'levonorgestrel');

          const inWithdrawalBleedWindow = Boolean(
            compound.withdrawalBleedRange &&
            daysSincePill >= compound.withdrawalBleedRange[0] &&
            daysSincePill <= compound.withdrawalBleedRange[1]
          );

          const isNearShiftedOv = Math.abs(cDay - shiftedOvDay) <= 2;

          return {
            pct: wilcoxShiftedPct,
            label: isNearShiftedOv
              ? `Pico Desplazado (${compound.brands})`
              : `Ajuste ${compound.brands}`,
            isHormoneAltered: true,
            isShiftedPeak: isNearShiftedOv,
            compoundKey,
            compound,
            pillDate: pillInCycle.date,
            daysSincePill,
            intakeDelayDays,
            intakeWindowStatus,
            hasProgestinConflict,
            inWithdrawalBleedWindow,
            cycleStart,
            cDay,
            ovDay: baseOvDay,
            shiftedOvDay,
            sigma,
            wilcoxPct: wilcoxShiftedPct,
            reason: `${compound.brands} (${compound.shortName}) • ${formatDateES(pillInCycle.date, false)} (hace ${daysSincePill}d)`,
            explanation: compoundKey === 'ulipristal'
              ? `Se registró Acetato de Ulipristal (Femelle One, 30 mg). Al ser un modulador SPRM, retrasa la ruptura folicular al menos 5 días (desplazando la ovulación estimada del Día ${baseOvDay} al Día ${shiftedOvDay}) y mueve el próximo periodo en promedio +${compound.expectedPeriodDelayDays} días (hasta +7d). Probabilidad biológica Wilcox hoy: ${wilcoxShiftedPct}% — el algoritmo bloquea días verdes hasta la siguiente regla real.`
              : `Se registró Levonorgestrel (Postday, 1.5 mg). Inhibe la ovulación únicamente si se tomó antes del pico de LH y puede provocar sangrado por deprivación entre los días +3 y +7 post-toma (no cuenta como regla real si ocurre antes del Día 18). Probabilidad biológica Wilcox hoy: ${wilcoxShiftedPct}% — usar barrera hasta confirmar regla.`
          };
        }

        if (cDay <= 4) {
          return {
            pct: 1,
            label: 'Mínima (Menstruación)',
            isHormoneAltered: false,
            isShiftedPeak: false,
            compoundKey: null,
            compound: null,
            cycleStart,
            cDay,
            ovDay: baseOvDay,
            shiftedOvDay: baseOvDay,
            sigma,
            wilcoxPct: 1,
            reason: `Fase menstrual (Día ${cDay} del ciclo)`,
            explanation: `Durante los primeros 4 días de menstruación real el endometrio se descama y el reclutamiento folicular apenas comienza. Probabilidad biológica Wilcox: 1%.`
          };
        }

        let wilcoxPct = computeWilcoxConvolvedProbability(cDay, baseOvDay, sigma);
        const dist = cDay - baseOvDay;
        let reason = `Curva Wilcox + EWMA (Día ${cDay} vs Ovulación est. Día ${baseOvDay})`;
        let explanation = `Con base en tu ciclo EWMA de ${cycleAnalytics.baseCycleLength} días menos ${cycleAnalytics.lutealLength} días de fase lútea, tu ovulación estimada cae en el Día ${baseOvDay} (±${cycleAnalytics.marginDays}d). Según la curva empírica de Wilcox (pico real 33%), hoy estás a ${Math.abs(dist)} ${Math.abs(dist) === 1 ? 'día' : 'días'} ${dist < 0 ? 'antes' : dist > 0 ? 'después' : 'exactos'} de la ovulación.`;

        if (hasEggwhite) {
          wilcoxPct = Math.max(wilcoxPct, 29);
          reason = 'Moco cervical fértil (clara de huevo)';
          explanation += ' Se registró moco cervical estrogénico fértil, lo que maximiza la supervivencia espermática.';
        }
        if (hasLhPos) {
          wilcoxPct = 33;
          reason = 'Test de ovulación LH (+) • Pico biológico (33%)';
          explanation = 'El pico positivo de LH indica que la ovulación ocurrirá en las próximas 12 a 36 horas (probabilidad biológica máxima por acto: 31%–33% según Wilcox et al.).';
        }
        if (hasThermalConfirmed) {
          wilcoxPct = 1;
          reason = 'Ovulación confirmada por BBT (Regla 3 sobre 6)';
          explanation = `Tu temperatura basal se mantuvo elevada por 3 días consecutivos sobre la línea base (${cycleAnalytics.coverline}°C), confirmando fase lútea post-ovulatoria (<1% de riesgo biológico).`;
        }

        const label = hasThermalConfirmed
          ? 'Mínima (Post-ovulación BBT)'
          : wilcoxPct >= 22
            ? 'Pico Fértil (Wilcox)'
            : wilcoxPct >= 10
              ? 'Ventana Fértil'
              : wilcoxPct >= 4
                ? 'Baja'
                : 'Mínima';

        return {
          pct: wilcoxPct,
          label,
          isHormoneAltered: false,
          isShiftedPeak: false,
          compoundKey: null,
          compound: null,
          cycleStart,
          cDay,
          ovDay: baseOvDay,
          shiftedOvDay: baseOvDay,
          sigma,
          wilcoxPct,
          reason,
          explanation
        };
      };

      const activePeriodStart = useMemo(() => {
        const valid = cycleAnalytics.starts.filter(d => d <= referenceDate);
        return valid.length ? valid[valid.length - 1] : cycleAnalytics.starts[0];
      }, [cycleAnalytics.starts, referenceDate]);

      const activeLhInCycle = useMemo(
        () => events.find(ev => (ev.tags || []).includes('test_ov_pos') && ev.date >= activePeriodStart && ev.date <= referenceDate),
        [events, activePeriodStart, referenceDate]
      );

      const fertilityScore = useMemo(
        () => evaluateFertilityForDate(referenceDate),
        [cycleAnalytics, events, referenceDate]
      );

      const pregnancyTestMilestones = useMemo(() => {
        const riskEvents = events
          .filter(ev => (ev.type === 'intimacy_unprotected' || ev.type === 'pill') && ev.date >= activePeriodStart)
          .sort((a, b) => b.date.localeCompare(a.date));
        if (riskEvents.length === 0) return null;
        const latest = riskEvents[0];
        const earlyDate = addDays(latest.date, CLINICAL_STANDARDS.pregnancyTesting.earlyUrineTestDays);
        const definitiveDate = addDays(latest.date, CLINICAL_STANDARDS.pregnancyTesting.definitiveUrineTestDays);
        return {
          triggerEvent: latest,
          earlyDate,
          definitiveDate,
          daysToEarly: diffDays(referenceDate, earlyDate),
          daysToDefinitive: diffDays(referenceDate, definitiveDate)
        };
      }, [events, activePeriodStart, referenceDate]);

      const cycleDay = Math.max(1, diffDays(activePeriodStart, referenceDate) + 1);
      const pillDelayShift = fertilityScore.isHormoneAltered && fertilityScore.compound
        ? fertilityScore.compound.expectedPeriodDelayDays
        : 0;

      const nextPeriodEst = activeLhInCycle
        ? addDays(activeLhInCycle.date, cycleAnalytics.lutealLength + 1)
        : addDays(activePeriodStart, cycleAnalytics.baseCycleLength + pillDelayShift);
      const daysUntilNext = diffDays(referenceDate, nextPeriodEst);
      const nextPeriodMin = addDays(nextPeriodEst, -cycleAnalytics.marginDays);
      const nextPeriodMax = addDays(
        nextPeriodEst,
        cycleAnalytics.marginDays + (fertilityScore.compoundKey === 'ulipristal' ? 4 : fertilityScore.compoundKey === 'levonorgestrel' ? 3 : 0)
      );

      const projectedPeriodStarts = useMemo(() => {
        const lastReal = cycleAnalytics.starts[cycleAnalytics.starts.length - 1];
        const activeShift = evaluateFertilityForDate(todayStr).compound?.expectedPeriodDelayDays || 0;
        return Array.from({ length: 6 }).map((_, i) =>
          addDays(lastReal, cycleAnalytics.baseCycleLength * (i + 1) + activeShift)
        );
      }, [cycleAnalytics.starts, cycleAnalytics.baseCycleLength, events, todayStr]);

      const currentPhaseKey = cycleDay <= 5
        ? 'menstrual'
        : fertilityScore.pct >= 10
          ? 'ovulatory'
          : cycleDay < fertilityScore.shiftedOvDay
            ? 'folicular'
            : 'luteal';

      useEffect(() => {
        const pool = MESSAGE_LIBRARY[currentPhaseKey] || MESSAGE_LIBRARY.folicular;
        setLumiMsg(pool[0]);
      }, [currentPhaseKey]);

      const handleTapLumi = () => {
        setLumiAnim('bounce');
        const pool = MESSAGE_LIBRARY[currentPhaseKey] || MESSAGE_LIBRARY.folicular;
        setLumiMsg(pool[Math.floor(Math.random() * pool.length)]);
        if (!greetedLumiToday) {
          setGreetedLumiToday(true);
          try { localStorage.setItem('ciclo_lumi_greeted', todayStr); } catch {}
          persistCloud(events, { ...settings, lumiPoints: (settings.lumiPoints || 0) + 5 });
        }
        setTimeout(() => setLumiAnim('idle'), 450);
      };

      const handleSpinRoulette = () => {
        if (rouletteSpinning) return;
        setRouletteSpinning(true);
        const options = SELFCARE_ROULETTE[currentPhaseKey] || SELFCARE_ROULETTE.folicular;
        setTimeout(() => {
          setRouletteResult(options[Math.floor(Math.random() * options.length)]);
          setRouletteSpinning(false);
        }, 700);
      };

      const phase = useMemo(() => {
        if (cycleDay <= 5) return { name: 'Fase Menstrual', glow: 'hero-glow', partnerTip: 'Energía baja y posible sensibilidad física. Ideal consentirla.' };
        if (fertilityScore.isHormoneAltered) {
          const isUli = fertilityScore.compoundKey === 'ulipristal';
          return {
            name: isUli ? 'Ajuste Femelle One (Ulipristal)' : 'Ajuste Postday (Levonorgestrel)',
            glow: 'hero-glow-amber',
            partnerTip: isUli
              ? 'Femelle One pospone la ovulación +5d y puede mover la regla +2 a +7d. Usar condón siempre.'
              : 'Postday puede causar sangrado por deprivación (3–7d) sin ser regla real. Usar condón siempre.'
          };
        }
        if (fertilityScore.pct >= 22) return { name: 'Pico Fértil (Wilcox)', glow: 'hero-glow', partnerTip: 'Máxima fertilidad biológica (hasta 33%). Precaución absoluta.' };
        if (fertilityScore.pct >= 10) return { name: 'Ventana Fértil', glow: 'hero-glow-amber', partnerTip: 'Zona de precaución activa.' };
        if (cycleDay < fertilityScore.shiftedOvDay) return { name: 'Fase Folicular', glow: 'hero-glow-green', partnerTip: 'Energía en subida. Gran momento para planes activos.' };
        return { name: 'Fase Lútea', glow: 'hero-glow-green', partnerTip: 'Etapa premenstrual: planes relajados y apapacho.' };
      }, [cycleDay, fertilityScore]);

      const getDayStatus = (dateStr) => {
        const allStarts = [...cycleAnalytics.starts, ...projectedPeriodStarts];
        const explicitBleed = cycleAnalytics.periodDaySet.has(dateStr);
        const isWithdrawalBleed = cycleAnalytics.withdrawalDaySet.has(dateStr);
        const periodMatch = allStarts.find(s => dateStr >= s && dateStr <= addDays(s, 4));
        const isProjected = !explicitBleed && !isWithdrawalBleed && Boolean(periodMatch && projectedPeriodStarts.includes(periodMatch));
        const isPeriod = !isWithdrawalBleed && (explicitBleed || Boolean(periodMatch));

        const firstTrackedStart = cycleAnalytics.starts[0];
        const evalData = evaluateFertilityForDate(dateStr);

        const isHormoneAltered = !isPeriod && !isProjected && evalData.isHormoneAltered;
        const isPeak = !isPeriod && !isHormoneAltered && (
          allStarts.some(s => dateStr >= addDays(s, cycleAnalytics.peakStartOffset) && dateStr <= addDays(s, cycleAnalytics.peakEndOffset)) ||
          evalData.pct >= 22
        );
        const isFertile = !isPeriod && !isHormoneAltered && !isPeak && (
          allStarts.some(s => dateStr >= addDays(s, cycleAnalytics.safeFertileStartOffset) && dateStr <= addDays(s, cycleAnalytics.safeFertileEndOffset)) ||
          evalData.pct >= 10
        );
        const isSafe = !isPeriod && !isHormoneAltered && !isPeak && !isFertile && (!firstTrackedStart || dateStr >= firstTrackedStart);

        const isEarlyTestDay = pregnancyTestMilestones && pregnancyTestMilestones.earlyDate === dateStr;
        const isDefinitiveTestDay = pregnancyTestMilestones && pregnancyTestMilestones.definitiveDate === dateStr;

        return {
          isPeriod,
          isProjectedPeriod: isProjected,
          isWithdrawalBleed,
          isHormoneAltered,
          isPeak,
          isFertile,
          isSafe,
          isEarlyTestDay,
          isDefinitiveTestDay,
          evalData,
          dayEvents: events.filter(e => e.date === dateStr)
        };
      };

      const weekStrip = useMemo(() => {
        const dayNames = ['Do', 'Lu', 'Ma', 'Mi', 'Ju', 'Vi', 'Sá'];
        return Array.from({ length: 7 }).map((_, idx) => {
          const dStr = addDays(referenceDate, idx - 3);
          const dt = parseLocalDate(dStr);
          return { dateStr: dStr, label: dayNames[dt.getDay()], dayNum: dt.getDate(), isSelected: dStr === referenceDate, status: getDayStatus(dStr) };
        });
      }, [referenceDate, events, cycleAnalytics, projectedPeriodStarts, pregnancyTestMilestones]);

      const todayBleedEvent = useMemo(
        () => events.find(e => e.date === referenceDate && (e.type === 'period_day' || e.type === 'period_start' || e.type === 'withdrawal_bleed')),
        [events, referenceDate]
      );

      const checkIsLikelyWithdrawalBleed = (dateStr) => {
        const recentLng = events
          .filter(ev => ev.type === 'pill' && resolvePillKind(ev) === 'levonorgestrel' && ev.date <= dateStr)
          .sort((a, b) => b.date.localeCompare(a.date))[0];
        if (!recentLng) return null;
        const daysAfterPill = diffDays(recentLng.date, dateStr);
        const prevRealStart = cycleAnalytics.starts.filter(s => s < dateStr).slice(-1)[0];
        const daysSinceLastRealPeriod = prevRealStart ? diffDays(prevRealStart, dateStr) : 99;
        if (daysAfterPill >= 2 && daysAfterPill <= 8 && daysSinceLastRealPeriod < 18) {
          return { pillDate: recentLng.date, daysAfterPill, daysSinceLastRealPeriod };
        }
        return null;
      };

      const toggleBleedingDay = (dateStr, flowLevel = 'medium') => {
        const existing = events.find(e => e.date === dateStr && (e.type === 'period_day' || e.type === 'period_start' || e.type === 'withdrawal_bleed'));
        if (existing) {
          if (existing.flow === flowLevel) handleDeleteEvent(existing.id);
          else persistCloud(events.map(e => e.id === existing.id ? { ...e, flow: flowLevel, updatedAt: Date.now() } : e));
        } else {
          const withdrawalCheck = checkIsLikelyWithdrawalBleed(dateStr);
          const hadPrev = events.some(e => e.date === addDays(dateStr, -1) && (e.type === 'period_day' || e.type === 'period_start'));
          const evType = withdrawalCheck ? 'withdrawal_bleed' : hadPrev ? 'period_day' : 'period_start';
          const created = {
            id: String(Date.now()),
            date: dateStr,
            type: evType,
            title: withdrawalCheck
              ? 'Sangrado por Deprivación (Postday)'
              : hadPrev ? 'Día de Periodo' : 'Inicio de Periodo',
            details: withdrawalCheck
              ? `Sangrado ${withdrawalCheck.daysAfterPill}d después de Postday (Día ${withdrawalCheck.daysSinceLastRealPeriod} del ciclo). No reinicia ciclo real.`
              : `Flujo ${FLOW_LEVELS.find(f => f.id === flowLevel)?.label.toLowerCase()}.`,
            tags: [],
            flow: flowLevel,
            alteredCycle: false,
            updatedAt: Date.now()
          };
          persistCloud(
            [...events, created].sort((a, b) => b.date.localeCompare(a.date)),

          nextSettings.customCouponTitle = '';
          nextSettings.customCouponSub = '';

      const handleClearScratchedCoupons = () => {
        const scratched = Array.isArray(settings.scratchedCoupons) ? settings.scratchedCoupons : [];
        if (scratched.length === 0) return;
        const deleted = Array.isArray(settings.deletedCoupons) ? settings.deletedCoupons : [];
        const nextDeleted = Array.from(new Set([...deleted, ...scratched]));

          ...settings,
          deletedCoupons: nextDeleted,
          scratchedCoupons: []
        };

      const openAddModal = (type, dateOverride, pillKindOverride = 'ulipristal') => {

        const parsedTemp = newEventTemp !== '' ? parseFloat(String(newEventTemp).replace(',', '.')) : undefined;

        const defaultDetail = newEventType === 'pill'

        const payload = {

          type: newEventType,
