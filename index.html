  <style>

    }
    .hero-glow-partner {

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(1.5deg); }
    }
    @keyframes blobDrift1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(28px, 34px) scale(1.12); }
    }
    @keyframes blobDrift2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-30px, -24px) scale(1.15); }
    }
    @keyframes slideFromRight {
      0% { opacity: 0; transform: translateX(36px) scale(0.98); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slideFromLeft {
      0% { opacity: 0; transform: translateX(-36px) scale(0.98); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes splashRing {
      0% { transform: scale(0.6); opacity: 0.7; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    @keyframes splashLumiIn {
      0% { opacity: 0; transform: scale(0.3) translateY(30px) rotate(-12deg); }
      65% { opacity: 1; transform: scale(1.12) translateY(-6px) rotate(4deg); }
      100% { opacity: 1; transform: scale(1) translateY(0) rotate(0deg); }
    }
    @keyframes splashTextUp {
      0% { opacity: 0; transform: translateY(18px); letter-spacing: 0.08em; }
      100% { opacity: 1; transform: translateY(0); letter-spacing: -0.02em; }
    }
    @keyframes sparkleRise {
      0% { opacity: 0; transform: translateY(25px) scale(0.5); }
      40% { opacity: 0.9; }
      100% { opacity: 0; transform: translateY(-70px) scale(1.2); }
    }
    @keyframes progressFill {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    @keyframes popBounce {
      0% { transform: scale(1); }
      40% { transform: scale(1.16) rotate(-5deg); }
      70% { transform: scale(0.94) rotate(3deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(28px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .animate-float { animation: floatSlow 3.6s ease-in-out infinite; }
    .animate-blob-1 { animation: blobDrift1 11s ease-in-out infinite; }
    .animate-blob-2 { animation: blobDrift2 14s ease-in-out infinite; }
    .animate-tab-right { animation: slideFromRight 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-tab-left { animation: slideFromLeft 0.34s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-splash-ring { animation: splashRing 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
    .animate-splash-lumi { animation: splashLumiIn 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .animate-splash-text { animation: splashTextUp 0.7s 0.35s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .animate-sparkle { animation: sparkleRise 2.2s ease-out infinite; }
    .animate-progress { animation: progressFill 2.5s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-pop { animation: popBounce 0.45s cubic-bezier(0.16, 1, 0.3, 1); }
    .animate-sheet { animation: slideUp 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-shake { animation: shake 0.35s ease-in-out; }
    @media print {
      .no-print { display: none !important; }

      const palettes = {

    const LumiMascot = ({ phaseKey, viewMode, bouncing, onTap, size = "w-20 h-20", equipped = [] }) => {

            {/* Ojitos */}
            {phaseKey === 'menstrual' && viewMode !== 'jorge' ? (
              <g stroke="#2D2229" strokeWidth="3" strokeLinecap="round" fill="none">
                <path d="M40 62 Q45 67 50 62" />
                <path d="M70 62 Q75 67 80 62" />
              </g>
            ) : (
              <g>
                <circle cx="45" cy="60" r="4.5" fill="#2D2229" />
                <circle cx="75" cy="60" r="4.5" fill="#2D2229" />
                <circle cx="46.5" cy="58.5" r="1.5" fill="#FFFFFF" />
                <circle cx="76.5" cy="58.5" r="1.5" fill="#FFFFFF" />
              </g>
            )}
            {/* Chapitas */}
            <ellipse cx="36" cy="69" rx="5.5" ry="3.2" fill={st.cheek} opacity="0.45" />
            <ellipse cx="84" cy="69" rx="5.5" ry="3.2" fill={st.cheek} opacity="0.45" />
            {/* Sonrisa */}
            <path d="M53 71 Q60 78 67 71" stroke="#2D2229" strokeWidth="2.8" strokeLinecap="round" fill="none" />

            {/* Accesorios */}
            {eq.includes('crown') && (
              <path d="M42 22 L48 10 L60 18 L72 10 L78 22 Z" fill="#FBBF24" stroke="#D97706" strokeWidth="1.8" strokeLinejoin="round" />
            )}
            {eq.includes('bow') && (
              <g transform="translate(74, 22) rotate(18)">
                <path d="M0 0 L-12 -7 L-12 7 Z" fill="#FF4D8D" stroke="#FFFFFF" strokeWidth="1.2" />
                <path d="M0 0 L12 -7 L12 7 Z" fill="#FF4D8D" stroke="#FFFFFF" strokeWidth="1.2" />

    // VENTANA DEDICADA: CUARTO DE LUMI
    const LumiRoomModal = ({ phaseKey, viewMode, points, unlocked, equipped, onBuyOrToggle, onClose, onPet }) => {
      const [petBounce, setPetBounce] = useState(false);
      const [roomMsg, setRoomMsg] = useState("¡Tócame o pruébame accesorios nuevos!");

      const handlePetLumi = () => {
        setPetBounce(true);
        const msgs = ["¡Me encanta este look! ✨", "¡Gracias por cuidarme, Angie! 💖", "¡Vamos por más puntos hoy!", "Qué a gusto estar aquí contigo 🌸"];
        setRoomMsg(msgs[Math.floor(Math.random() * msgs.length)]);
        onPet();
        setTimeout(() => setPetBounce(false), 450);
      };

      return (
        <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4 z-50">
          <div className="bg-white rounded-t-[34px] sm:rounded-[34px] max-w-md w-full p-6 shadow-2xl animate-sheet max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between mb-3">
              <div>
                <h3 className="text-lg font-extrabold text-[#2D2229]">Cuarto de Lumi</h3>
                <p className="text-[11px] font-semibold text-[#8C7380]">Desbloquea una vez y combínalos gratis</p>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-extrabold bg-[#FFF0F4] text-[#E94B77] px-3 py-1 rounded-full">
                  ✨ {points} pts
                </span>
                <button onClick={onClose} className="w-8 h-8 rounded-full bg-slate-100 text-[#6B5460] font-bold text-xs">✕</button>
              </div>
            </div>

            {/* Escenario de Lumi */}
            <div className="rounded-[28px] bg-gradient-to-b from-[#FFF3F7] to-[#F5EEFF] p-6 flex flex-col items-center justify-center relative overflow-hidden mb-5">
              <div className="bg-white/90 px-4 py-1.5 rounded-full text-xs font-bold text-[#2D2229] shadow-xs mb-3">
                {roomMsg}
              </div>
              <LumiMascot
                phaseKey={phaseKey}
                viewMode={viewMode}
                bouncing={petBounce}
                onTap={handlePetLumi}
                size="w-36 h-36"
                equipped={equipped}
              />
              <div className="w-28 h-3 rounded-full bg-rose-200/60 blur-xs mt-1"></div>
            </div>

            {/* Armario de accesorios */}
            <p className="text-[11px] font-extrabold uppercase tracking-wider text-[#9C8290] mb-2.5">Armario de accesorios</p>
            <div className="grid grid-cols-2 gap-2.5 mb-4">
              {LUMI_ACCESSORIES.map(acc => {
                const isUnlocked = unlocked.includes(acc.id);
                const isEquipped = equipped.includes(acc.id);
                const canBuy = points >= acc.cost;

                return (
                  <button
                    key={acc.id}
                    type="button"
                    onClick={() => {
                      onBuyOrToggle(acc);
                      setPetBounce(true);
                      setRoomMsg(isEquipped ? `Me quité: ${acc.label}` : isUnlocked ? `¡Me puse: ${acc.label}!` : canBuy ? `¡Desbloqueaste ${acc.label}! 🎉` : `Te faltan ${acc.cost - points} pts`);

                    }}
                    className={`p-3 rounded-2xl border text-left transition active:scale-95 flex items-center justify-between ${
                      isEquipped
                        ? 'bg-[#E94B77] text-white border-[#E94B77] shadow-md shadow-rose-200'
                        : isUnlocked
                          ? 'bg-[#FFF5F8] text-[#2D2229] border-rose-200'
                          : canBuy
                            ? 'bg-white text-[#2D2229] border-slate-200 hover:border-rose-300'
                            : 'bg-slate-50 text-[#9C8290] border-slate-100 opacity-75'
                    }`}
                  >
                    <div className="flex items-center gap-2">
                      <span className="text-lg">{acc.emoji}</span>
                      <div>
                        <p className="text-xs font-extrabold leading-tight">{acc.label}</p>
                        <p className={`text-[10px] font-bold mt-0.5 ${isEquipped ? 'text-white/85' : 'text-[#8C7380]'}`}>
                          {isEquipped ? 'Puesto ✓' : isUnlocked ? 'Tocar para poner' : `${acc.cost} pts`}
                        </p>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>

            <button onClick={onClose} className="w-full py-3 rounded-full bg-[#2D2229] text-white text-xs font-bold">
              Listo
            </button>
          </div>
        </div>
      );
    };

    // MINIJUEGO DE RESPIRACIÓN 4-4-6
    const BreathingGameModal = ({ onClose, onCompleteSession }) => {
      const [secondsLeft, setSecondsLeft] = useState(45);
      const [cycleSec, setCycleSec] = useState(0);

      useEffect(() => {
        const t = setInterval(() => {
          setSecondsLeft(prev => {
            if (prev <= 1) {
              clearInterval(t);
              onCompleteSession();
              return 0;
            }
            return prev - 1;
          });
          setCycleSec(c => (c + 1) % 14);
        }, 1000);
        return () => clearInterval(t);
      }, []);

      const phaseInfo = cycleSec < 4

    const ScratchCouponCard = ({ coupon, scratched, onScratch }) => {
      const canvasRef = useRef(null);
      const drawingRef = useRef(false);

      useEffect(() => {
        if (scratched || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        canvas.width = 280;
        canvas.height = 92;
        ctx.fillStyle = '#E94B77';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFFFFF';
        ctx.font = 'bold 13px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Rasca aquí para revelar tu cupón', canvas.width / 2, canvas.height / 2 + 4);
      }, [scratched]);

      const handleMove = (clientX, clientY) => {
        if (scratched || !canvasRef.current) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const x = ((clientX - rect.left) / rect.width) * canvas.width;
        const y = ((clientY - rect.top) / rect.height) * canvas.height;
        const ctx = canvas.getContext('2d');
        ctx.globalCompositeOperation = 'destination-out';
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.fill();

        const data = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let transparent = 0;
        for (let i = 3; i < data.length; i += 4) {
          if (data[i] === 0) transparent++;
        }
        if (transparent / (data.length / 4) > 0.35) {
          onScratch(coupon.id);
        }
      };

      return (
        <div className="relative rounded-2xl bg-gradient-to-r from-[#FFF0F4] to-[#FFE4EC] border border-rose-200 p-3.5 overflow-hidden min-h-[92px] flex flex-col justify-center">
          <p className="text-xs font-extrabold text-[#2D2229]">{coupon.title}</p>
          <p className="text-[11px] text-[#7A6370] mt-0.5">{coupon.subtitle}</p>
          {!scratched && (
            <canvas
              ref={canvasRef}
              onMouseDown={() => { drawingRef.current = true; }}
              onMouseUp={() => { drawingRef.current = false; }}
              onMouseLeave={() => { drawingRef.current = false; }}
              onMouseMove={(e) => { if (drawingRef.current) handleMove(e.clientX, e.clientY); }}
              onTouchStart={(e) => { if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY); }}
              onTouchMove={(e) => { if (e.touches[0]) handleMove(e.touches[0].clientX, e.touches[0].clientY); }}
              className="absolute inset-0 w-full h-full cursor-pointer touch-none"
            />
          )}
        </div>
      );

      const range = Math.max(0.4, maxT - minT);

    function parseLocalDate(dateStr) {
      const [y, m, d] = (dateStr || getTodayLocal()).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }
    function formatDateES(dateStr, includeYear = true) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      return includeYear ? `${d} de ${months[m - 1]} ${y}` : `${d} de ${months[m - 1]}`;

      return `${months[m - 1]} ${y}`;
    }
    function addDays(dateStr, days) {
      const dt = parseLocalDate(dateStr);
      dt.setDate(dt.getDate() + days);

                    ))}
                  </div>

                  <textarea rows="2" value={newEventDetails} onChange={e => setNewEventDetails(e.target.value)} placeholder="Notas opcionales..." className="w-full bg-[#FFF9FA] border border-[#F5DCE4] rounded-2xl px-3 py-2 text-xs"></textarea>

                  <div className="flex gap-2">
                    <button type="button" onClick={() => setModalOpen(false)} className="flex-1 py-3 rounded-full bg-[#FFF0F4] text-[#E94B77] text-xs font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 py-3 rounded-full bg-[#E94B77] text-white text-xs font-bold shadow-md shadow-rose-200">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
