    function getTodayLocal() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function parseLocalDate(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatDateES(dateStr, includeYear = true) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      return includeYear ? `${d} de ${months[m - 1]} ${y}` : `${d} de ${months[m - 1]}`;
    }

    function addDays(dateStr, days) {
      const dt = parseLocalDate(dateStr);
      dt.setDate(dt.getDate() + days);
      const yy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    function diffDays(startStr, endStr) {
      const dt1 = parseLocalDate(startStr);
      const dt2 = parseLocalDate(endStr);
      return Math.round((dt2 - dt1) / (1000 * 60 * 60 * 24));

          }
        }
        return pool;
      };

        folicular: buildPhasePool(phaseOpeners.folicular, wisdomClosings),

      const storageKey = `ciclo_seen_msgs_${phaseKey}_v1`;
      let seen = [];
      try { seen = JSON.parse(localStorage.getItem(storageKey) || '[]'); } catch { seen = []; }
      if (seen.length >= pool.length) seen = [];
      const available = [];
      for (let i = 0; i < pool.length; i++) {
        if (!seen.includes(i)) available.push(i);
      }
      const chosenIdx = available[Math.floor(Math.random() * available.length)];
      seen.push(chosenIdx);
      try { localStorage.setItem(storageKey, JSON.stringify(seen)); } catch {}
      return { ...pool[chosenIdx], number: seen.length, total: pool.length };
    }

          .filter(e => e.type === 'period_start')
          .sort((a, b) => a.date.localeCompare(b.date));

        const periodDaySet = new Set(
          events.filter(e => e.type === 'period_day' || e.type === 'period_start').map(e => e.date)
        );

        const starts = periodStarts.length ? periodStarts.map(e => e.date) : [todayStr];
        const historyRows = [];
        const naturalLengths = [];

        for (let i = 0; i < periodStarts.length; i++) {
          const curr = periodStarts[i];
          const next = periodStarts[i + 1];
          const length = next ? diffDays(curr.date, next.date) : null;
          const hasPillBetween = next
            ? events.some(ev => ev.type === 'pill' && ev.date >= curr.date && ev.date < next.date)
            : false;

          let bleedDays = 1;
          while (periodDaySet.has(addDays(curr.date, bleedDays)) && bleedDays < 12) {
            bleedDays++;
          }
          const estimatedBleedDays = bleedDays > 1 ? bleedDays : 5;

          if (length !== null && !hasPillBetween && !next?.alteredCycle && length >= 21 && length <= 45) {
            naturalLengths.push(length);
          }

          historyRows.push({
            id: curr.id,
            start: curr.date,
            end: addDays(curr.date, estimatedBleedDays - 1),
            bleedDays: estimatedBleedDays,
            length,
            isAltered: Boolean(hasPillBetween || next?.alteredCycle || (length !== null && length < 21)),
            title: curr.title
          });

          ? Math.round(naturalLengths.reduce((a, b) => a + b, 0) / naturalLengths.length)

          if (!st) return false;
          const d = diffDays(st, x.date) + 1;
          return d >= 6 && d <= safeFertileStartOffset + 2;
        });
        const baselineTemp = folicularTemps.length > 0
          ? Number((folicularTemps.reduce((acc, cur) => acc + cur.temp, 0) / folicularTemps.length).toFixed(2))

            : null;

            return diff >= 1 && diff <= 3;
          });

            (ev.tags || []).forEach(tid => {
              prePeriodTagCounts[tid] = (prePeriodTagCounts[tid] || 0) + 1;
            });

        const correlatedSymptoms = Object.entries(prePeriodTagCounts)
          .filter(([, count]) => count >= 2)
          .map(([tid, count]) => {
            const tagObj = SYMPTOM_TAGS.find(t => t.id === tid);
            return tagObj ? { ...tagObj, count } : null;
          })
          .filter(Boolean);

          starts,
          periodDaySet,
          historyRows: historyRows.reverse(),
          baseCycleLength: avgCycleLength,
          minObservedCycle,
          maxObservedCycle,
          variation,
          isIrregular,
          safeFertileStartOffset,
          peakStartOffset,
          peakOvulationOffset,

            name: 'Ventana Fértil Ampliada',
            fertility: 'Alta (Margen Seguridad)',
            desc: `Dentro del margen de seguridad (Días ${fStart}–${fEnd}) que cubre variaciones naturales del ciclo.`,
            partnerTip: `Zona de precaución activa. Mantener uso estricto de protección de barrera hasta pasar el día ${fEnd}.`,
            possibleSymptoms: ['Buen ánimo', 'Aumento de flujo', 'Energía estable'],
            ringColor: '#F59E0B',
            badgeBg: 'bg-amber-100 text-amber-800',
            emoji: '☀️'
          };
        }
        if (day < fStart) {
          return {
            name: 'Fase Folicular Temprana',
            fertility: 'Baja (No es anticonceptivo)',
            desc: 'Días inmediatos posteriores al periodo antes de abrir la ventana fértil.',
            partnerTip: 'Buen ánimo, claridad mental y energía en subida. Buen momento para salidas o planes activos juntos.',
            possibleSymptoms: ['Energía en subida', 'Buen ánimo', 'Claridad mental'],
            ringColor: '#10B981',
            badgeBg: 'bg-emerald-100 text-emerald-800',
            emoji: '🌱'
          };
        }
        return {
          name: 'Fase Lútea',
          fertility: 'Mínima (No es anticonceptivo)',
          desc: 'Etapa posterior al margen fértil ampliado hasta el inicio del siguiente periodo.',
          partnerTip: 'Etapa premenstrual: puede haber cansancio, antojos o sensibilidad. Ideal planes relajados, comida rica y apapacho.',
          possibleSymptoms: ['Antojos', 'Cansancio', 'Sensibilidad emocional', 'Inflamación'],
          ringColor: '#10B981',
          badgeBg: 'bg-emerald-100 text-emerald-800',
          emoji: '🌙'
        };
      };

      const phase = getPhaseInfo(cycleDay);

      const getDayStatus = (dateStr) => {
        const allPeriodStarts = [...cycleAnalytics.starts, ...projectedPeriodStarts];
        const explicitBleed = cycleAnalytics.periodDaySet.has(dateStr);

        const allPeriods = allPeriodStarts.map(s => {
          const hist = cycleAnalytics.historyRows.find(r => r.start === s);
          const dur = hist ? hist.bleedDays - 1 : 4;
          return { start: s, end: addDays(s, dur), isProjected: projectedPeriodStarts.includes(s) };
        });
        const periodMatch = allPeriods.find(r => dateStr >= r.start && dateStr <= r.end);

        const isAlteredActive = Boolean(activePillInCycle && dateStr >= activePillInCycle.date && dateStr < projectedPeriodStarts[0]);
        const isPeak = allPeriodStarts.some(s => dateStr >= addDays(s, cycleAnalytics.peakStartOffset) && dateStr <= addDays(s, cycleAnalytics.peakEndOffset));
        const isFertile = isAlteredActive || allPeriodStarts.some(s => dateStr >= addDays(s, cycleAnalytics.safeFertileStartOffset) && dateStr <= addDays(s, cycleAnalytics.safeFertileEndOffset));
        const isLowRisk = !isAlteredActive && allPeriodStarts.some(s => {
          const d6 = addDays(s, 5);
          const dPreEnd = addDays(s, cycleAnalytics.safeFertileStartOffset - 1);
          const dPostStart = addDays(s, cycleAnalytics.safeFertileEndOffset + 1);
          const dEnd = addDays(s, cycleAnalytics.baseCycleLength - 1);
          return (dateStr >= d6 && dateStr <= dPreEnd) || (dateStr >= dPostStart && dateStr <= dEnd);
        });

        const dayEvents = events.filter(e => e.date === dateStr);
        return {
          isPeriod: explicitBleed || Boolean(periodMatch),
          isProjectedPeriod: !explicitBleed && Boolean(periodMatch && periodMatch.isProjected),
          isFertile, isPeak, isLowRisk, isAlteredActive, dayEvents
        };
      };

      const activeReactiveInsights = useMemo(() => {
        const dayEvs = events.filter(e => e.date === referenceDate);
        const tagsToday = new Set();
        dayEvs.forEach(ev => (ev.tags || []).forEach(t => tagsToday.add(t)));
        return Object.entries(REACTIVE_INSIGHTS)
          .filter(([key]) => tagsToday.has(key))
          .map(([key, val]) => ({ id: key, ...val }));
      }, [events, referenceDate]);

      const todayBleedEvent = useMemo(() => {
        return events.find(e => e.date === referenceDate && (e.type === 'period_day' || e.type === 'period_start'));
      }, [events, referenceDate]);

      const weekStrip = useMemo(() => {
        const dayLetters = ['D', 'L', 'M', 'M', 'J', 'V', 'S'];
        return Array.from({ length: 7 }).map((_, idx) => {
          const dStr = addDays(referenceDate, idx - 3);
          const dt = parseLocalDate(dStr);
          return {
            dateStr: dStr,
            letter: dayLetters[dt.getDay()],
            dayNum: dt.getDate(),
            isToday: dStr === todayStr,
            isSelected: dStr === referenceDate,
            status: getDayStatus(dStr)
          };
        });
      }, [referenceDate, todayStr, events, cycleAnalytics, projectedPeriodStarts, activePillInCycle]);

      const openAddModal = (type, dateOverride) => {
        const targetDate = dateOverride || referenceDate;
        setNewEventType(type);
        setNewEventDate(targetDate);
        const defaultTitles = {
          period_start: 'Inicio de Periodo',
          intimacy_protected: 'Relación con Condón',
          intimacy_unprotected: 'Relación sin Protección',
          pill: 'Pastilla de Emergencia',
          medical: 'Registro de Síntomas / Flujo / BBT'
        };
        setNewEventTitle(defaultTitles[type] || '');
        setNewEventDetails('');
        setNewEventTags(type === 'pill' ? ['altered_cycle'] : []);
        setNewEventAltered(false);
        setNewEventFlow('medium');
        setNewEventTemp('');
        setModalOpen(true);
      };

      const toggleTag = (tagId) => {
        setNewEventTags(prev => prev.includes(tagId) ? prev.filter(t => t !== tagId) : [...prev, tagId]);
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        if (!newEventTitle.trim()) return;
        const parsedTemp = newEventTemp !== '' ? parseFloat(String(newEventTemp).replace(',', '.')) : undefined;
        const validTemp = parsedTemp !== undefined && !Number.isNaN(parsedTemp) && parsedTemp >= 34 && parsedTemp <= 41 ? parsedTemp : undefined;

        const created = {
          id: String(Date.now()),
          date: newEventDate,
          type: newEventType,
          title: newEventTitle.trim(),
          details: newEventDetails.trim() || (validTemp ? `Temperatura basal: ${validTemp}°C.` : 'Registrado en bitácora.'),
          tags: newEventTags,
          alteredCycle: newEventType === 'period_start' ? newEventAltered : false,
          flow: newEventType === 'period_start' ? newEventFlow : undefined,
          bbt: validTemp
        };
        const updated = [...events, created].sort((a, b) => b.date.localeCompare(a.date));
        persistCloud(updated);
        setSelectedDay(newEventDate);
        setModalOpen(false);
      };

      const handleDeleteEvent = (id) => {
        persistCloud(events.filter(ev => ev.id !== id));
      };

      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const daysInMonth = new Date(currentMonth.year, currentMonth.month + 1, 0).getDate();
      const firstWeekday = new Date(currentMonth.year, currentMonth.month, 1).getDay();

      const prevMonth = () => setCurrentMonth(prev => prev.month === 0 ? { year: prev.year - 1, month: 11 } : { year: prev.year, month: prev.month - 1 });
      const nextMonth = () => setCurrentMonth(prev => prev.month === 11 ? { year: prev.year + 1, month: 0 } : { year: prev.year, month: prev.month + 1 });

      const selectedDayInfo = getDayStatus(selectedDay);
      const sortedEvents = [...events].sort((a, b) => b.date.localeCompare(a.date));

      const getEventBadge = (type) => {
        switch (type) {
          case 'period_start': return { icon: '🩸', label: 'Inicio Periodo', color: 'bg-rose-100 text-rose-700 border-rose-200' };
          case 'period_day': return { icon: '💧', label: 'Sangrado', color: 'bg-rose-50 text-rose-700 border-rose-200' };
          case 'intimacy_protected': return { icon: '🛡️❤️', label: 'Con protección', color: 'bg-purple-100 text-purple-700 border-purple-200' };
          case 'intimacy_unprotected': return { icon: '❤️', label: 'Sin protección', color: 'bg-pink-100 text-pink-700 border-pink-200' };
          case 'pill': return { icon: '💊', label: 'Emergencia', color: 'bg-amber-100 text-amber-800 border-amber-200' };
          default: return { icon: '🩺', label: 'Síntoma / BBT', color: 'bg-sky-100 text-sky-700 border-sky-200' };
        }
      };

      const handleExportMedicalReport = () => {
        const reportWindow = window.open('', '_blank', 'width=850,height=900');
        if (!reportWindow) { window.print(); return; }

        const cyclesHtml = cycleAnalytics.historyRows.map(c => `
          <tr>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${formatDateES(c.start)} – ${formatDateES(c.end)} (${c.bleedDays}d)</td>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${c.length ? c.length + ' días' : 'En curso'}</td>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${c.isAltered ? 'Alterado (Postday)' : 'Natural'}</td>
          </tr>
        `).join('');

        const eventsHtml = sortedEvents.map(ev => {
          const tagsText = (ev.tags || []).map(tid => SYMPTOM_TAGS.find(t => t.id === tid)?.label).filter(Boolean).join(', ');
          const bbtText = typeof ev.bbt === 'number' ? `BBT: ${ev.bbt}°C` : '';
          return `
            <tr>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;white-space:nowrap;">${formatDateES(ev.date)}</td>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;font-weight:bold;">${ev.title}</td>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${ev.details}${bbtText ? ' • ' + bbtText : ''}${tagsText ? ' [' + tagsText + ']' : ''}</td>
            </tr>
          `;
        }).join('');

        reportWindow.document.write(`
          <!DOCTYPE html><html lang="es"><head><meta charset="UTF-8" /><title>Reporte Ginecológico</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1e293b; padding: 32px; max-width: 800px; margin: 0 auto; }
            h1 { color: #e11d48; margin-bottom: 4px; font-size: 22px; }
            .sub { color: #64748b; font-size: 13px; margin-bottom: 24px; }
            .summary-box { display: flex; gap: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
            .summary-item { flex: 1; }
            .summary-item span { display: block; font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold; }
            .summary-item strong { font-size: 14px; color: #0f172a; }
            h2 { font-size: 16px; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; margin-top: 24px; }
            table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
            th { background: #f8fafc; padding: 8px; border-bottom: 2px solid #cbd5e1; color: #475569; }
            @media print { .no-print { display: none; } }
          </style></head><body>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h1>Resumen Clínico y Control de Ciclo Menstrual</h1>
              <div class="sub">Generado el ${formatDateES(todayStr)} • Método: ${activeMethod.label} • Objetivo: ${activeGoal.label}</div>
            </div>
            <button class="no-print" onclick="window.print()" style="background:#0f172a;color:white;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer;">🖨️ Imprimir / PDF</button>
          </div>
          <div class="summary-box">
            <div class="summary-item"><span>Último Periodo (FUM)</span><strong>${formatDateES(activePeriodStart)}</strong></div>
            <div class="summary-item"><span>Promedio / Rango</span><strong>${cycleAnalytics.baseCycleLength}d (${cycleAnalytics.minObservedCycle}–${cycleAnalytics.maxObservedCycle}d)</strong></div>
            <div class="summary-item"><span>Temp. Basal Base</span><strong>${cycleAnalytics.baselineTemp ? cycleAnalytics.baselineTemp + '°C' : 'Sin registro'}</strong></div>
            <div class="summary-item"><span>Próximo Periodo Est.</span><strong>${formatDateES(nextPeriodEst)}</strong></div>
          </div>
          <h2>Historial de Ciclos Menstruales</h2>
          <table><thead><tr><th>Sangrado</th><th>Duración Ciclo</th><th>Clasificación</th></tr></thead><tbody>${cyclesHtml}</tbody></table>
          <h2>Bitácora Clínica, Flujo y Síntomas</h2>
          <table><thead><tr><th>Fecha</th><th>Evento</th><th>Detalle</th></tr></thead><tbody>${eventsHtml}</tbody></table>
          </body></html>
        `);
        reportWindow.document.close();
      };

      const svgRadius = 96;
      const svgCircumference = 2 * Math.PI * svgRadius;
      const cycleProgress = Math.min(1, cycleDay / cycleAnalytics.baseCycleLength);
      const strokeDashoffset = svgCircumference * (1 - cycleProgress);

      const heroHeadline = (() => {
        if (cycleDay <= 5) return { top: 'PERIODO', big: `Día ${cycleDay}`, sub: `Ciclo promedio ${cycleAnalytics.baseCycleLength} días` };
        if (daysUntilNext > 0) return { top: 'PRÓXIMO PERIODO EN', big: `${daysUntilNext} ${daysUntilNext === 1 ? 'día' : 'días'}`, sub: `Día ${cycleDay} del ciclo` };
        if (daysUntilNext === 0) return { top: 'PERIODO ESPERADO', big: 'Hoy', sub: `Día ${cycleDay} del ciclo` };
        return { top: 'POSIBLE RETRASO', big: `${Math.abs(daysUntilNext)} ${Math.abs(daysUntilNext) === 1 ? 'día' : 'días'}`, sub: `Día ${cycleDay} del ciclo` };
      })();

      if (!isUnlocked) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-rose-50 via-white to-fuchsia-50">
            <div className="bg-white rounded-3xl shadow-xl border border-rose-100 max-w-sm w-full p-7 text-center">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-500 to-fuchsia-500 flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-md">
                🔒
              </div>
              <h1 className="text-xl font-extrabold text-slate-900">Espacio Privado</h1>
              <p className="text-xs text-slate-500 mt-1 mb-6">
                Ingresa el código de seguridad para ver y editar el calendario.
              </p>
              <form onSubmit={handleUnlock} className="space-y-4">
                <input
                  type="password" inputMode="numeric" value={pinInput}
                  onChange={(e) => { setPinInput(e.target.value); setPinError(false); }}
                  placeholder="••••" maxLength={8} autoFocus
                  className="w-full text-center text-2xl tracking-[0.5em] font-bold border-2 border-slate-200 rounded-2xl py-3 px-4 focus:outline-none focus:border-rose-500 transition"
                />
                {pinError && <p className="text-xs font-bold text-rose-600">Código incorrecto. Intenta de nuevo.</p>}
                <button type="submit" className="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-md transition">
                  Desbloquear
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto px-4 pt-3">
          {/* HEADER + SWITCH PAREJA + MODO DISCRETO */}
          <header className="bg-white rounded-2xl shadow-sm border border-slate-100 p-3.5 mb-4 flex flex-col gap-3 no-print">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-2.5">
                <div className={`w-10 h-10 rounded-2xl flex items-center justify-center text-white text-lg shadow-sm ${discreetMode ? 'bg-slate-800' : viewMode === 'jorge' ? 'bg-gradient-to-tr from-indigo-600 to-purple-600' : 'bg-gradient-to-tr from-rose-500 to-fuchsia-500'}`}>
                  {discreetMode ? '🕶️' : viewMode === 'jorge' ? '💞' : '💗'}
                </div>
                <div>
                  <h1 className="text-base font-extrabold text-slate-900 leading-tight">
                    {discreetMode ? 'Bienestar Diario' : 'Ciclo & Bienestar'}
                  </h1>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span className={`inline-block w-2 h-2 rounded-full ${syncStatus === 'synced' ? 'bg-emerald-500' : syncStatus === 'error' ? 'bg-rose-500' : 'bg-amber-400 animate-pulse'}`}></span>
                    <span className="text-[11px] font-medium text-slate-500">
                      {syncStatus === 'synced' ? 'Sincronizado' : syncStatus === 'error' ? 'Sin conexión' : 'Sincronizando...'}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setDiscreetMode(prev => !prev)}
                  title="Modo discreto (oculta etiquetas sensibles)"
                  className={`text-xs font-bold px-2.5 py-2 rounded-xl border transition ${discreetMode ? 'bg-slate-900 text-white border-slate-900' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`}
                >
                  🕶️
                </button>
                <button onClick={() => setSettingsModalOpen(true)} title="Ajustes, método y respaldo" className="text-xs font-bold px-2.5 py-2 rounded-xl bg-slate-100 text-slate-700 hover:bg-slate-200 transition flex items-center gap-1">
                  <span>⚙️</span> <span className="hidden sm:inline">Ajustes</span>
                </button>
                {!discreetMode && (
                  <button onClick={() => setWelcomeModalOpen(true)} title="Mensaje del día" className="text-xs font-bold px-2.5 py-2 rounded-xl bg-fuchsia-50 text-fuchsia-700 border border-fuchsia-200 hover:bg-fuchsia-100 transition">
                    💌
                  </button>
                )}
                <button onClick={handleInstallClick} title="Instalar App" className="text-xs font-bold px-2.5 py-2 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 transition">
                  📲
                </button>
                <button onClick={handleLock} title="Bloquear" className="text-xs font-bold px-2.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition">
                  🔒
                </button>
              </div>
            </div>

            {!discreetMode && (
              <div className="flex items-center justify-between gap-2 bg-slate-50 p-1 rounded-xl border border-slate-100">
                <button
                  onClick={() => toggleViewMode('angie')}
                  className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${viewMode === 'angie' ? 'bg-white text-rose-600 shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  <span>🌷</span> Vista Angie
                </button>
                <button
                  onClick={() => toggleViewMode('jorge')}
                  className={`flex-1 py-1.5 rounded-lg text-xs font-bold transition flex items-center justify-center gap-1.5 ${viewMode === 'jorge' ? 'bg-white text-indigo-600 shadow-xs' : 'text-slate-500 hover:text-slate-800'}`}
                >
                  <span>💞</span> Vista Pareja (Jorge)
                </button>
              </div>
            )}

            <nav className="hidden md:flex bg-slate-100 p-1 rounded-xl gap-1">
              <button onClick={() => setActiveTab('today')} className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'today' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Hoy</button>
              <button onClick={() => setActiveTab('calendar')} className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'calendar' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Calendario</button>
              <button onClick={() => setActiveTab('history')} className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'history' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}>Historial y Patrones</button>
            </nav>
          </header>

          {/* PESTAÑA HOY */}
          {activeTab === 'today' && (
            <div className="space-y-4">
              {/* TIRA SEMANAL */}
              <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-3.5">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-2">
                    <span className="text-sm font-extrabold text-slate-900 capitalize">{formatDateES(referenceDate)}</span>
                    {referenceDate === todayStr ? (
                      <span className="text-[10px] font-bold bg-rose-100 text-rose-700 px-2 py-0.5 rounded-full">HOY</span>
                    ) : (
                      <button onClick={() => setReferenceDate(todayStr)} className="text-[11px] font-bold bg-slate-900 text-white px-2.5 py-0.5 rounded-full hover:bg-slate-700 transition">
                        Volver a Hoy
                      </button>
                    )}
                  </div>
                  <div className="flex items-center gap-1.5">
                    <button onClick={() => setReferenceDate(addDays(referenceDate, -7))} className="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">◀</button>
                    <input type="date" value={referenceDate} onChange={(e) => e.target.value && setReferenceDate(e.target.value)} className="w-7 h-7 opacity-70 hover:opacity-100 text-xs border border-slate-200 rounded-lg px-1 cursor-pointer" title="Elegir fecha" />
                    <button onClick={() => setReferenceDate(addDays(referenceDate, 7))} className="w-7 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-bold">▶</button>
                  </div>
                </div>

                <div className="grid grid-cols-7 gap-1">
                  {weekStrip.map(d => {
                    let dotColor = 'bg-transparent';
                    if (d.status.isPeriod) dotColor = 'bg-rose-500';
                    else if (d.status.isPeak) dotColor = 'bg-red-500';
                    else if (d.status.isFertile) dotColor = 'bg-amber-400';
                    else if (d.status.isLowRisk) dotColor = 'bg-emerald-400';

                    return (
                      <button
                        key={d.dateStr}
                        onClick={() => setReferenceDate(d.dateStr)}
                        className={`flex flex-col items-center py-2 rounded-2xl transition ${
                          d.isSelected ? 'bg-slate-900 text-white shadow-sm' : d.isToday ? 'bg-rose-50 text-rose-700 ring-1 ring-rose-300' : 'hover:bg-slate-50 text-slate-700'
                        }`}
                      >
                        <span className={`text-[10px] font-bold ${d.isSelected ? 'text-slate-300' : 'text-slate-400'}`}>{d.letter}</span>
                        <span className="text-sm font-extrabold my-0.5">{d.dayNum}</span>
                        <div className="flex items-center gap-0.5 h-1.5">
                          <span className={`w-1.5 h-1.5 rounded-full ${dotColor}`}></span>
                          {d.status.dayEvents.length > 0 && <span className={`w-1.5 h-1.5 rounded-full ${d.isSelected ? 'bg-fuchsia-400' : 'bg-purple-500'}`}></span>}
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* ALERTA DE CICLO ALTERADO */}
              {activePillInCycle && !discreetMode && (
                <div className="bg-amber-50 border border-amber-300 rounded-2xl p-3.5 flex items-start gap-3">
                  <span className="text-xl mt-0.5">⚠️</span>
                  <div>
                    <p className="text-xs font-extrabold text-amber-950">Ciclo en ajuste por anticoncepción de emergencia</p>
                    <p className="text-xs text-amber-900 mt-0.5 leading-relaxed">
                      Registrada el <strong>{formatDateES(activePillInCycle.date, false)}</strong>. La ovulación y el periodo pueden recorrerse; mantener protección de barrera hasta confirmar el siguiente periodo.
                    </p>
                  </div>
                </div>
