          {catchGameOpen && <CatchGiftGameModal onClose={() => setCatchGameOpen(false)} onWin={handleGameWin} />}
          {memoryGameOpen && <MemoryGameModal onClose={() => setMemoryGameOpen(false)} onWin={handleGameWin} />}
          {simonGameOpen && <SimonGameModal onClose={() => setSimonGameOpen(false)} onWin={handleGameWin} />}
          {breathingOpen && <BreathingGameModal onClose={() => setBreathingOpen(false)} onCompleteSession={() => handleGameWin(10, false)} />}

          {/* Drawer de Ajustes */}
          {settingsDrawerOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-end sm:items-center justify-center sm:p-4 z-50">
              <div className="liquid-glass rounded-t-[34px] sm:rounded-[34px] max-w-md w-full p-6 shadow-2xl animate-sheet max-h-[85vh] overflow-y-auto space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-base font-extrabold text-[#2D2229]">Perfil & Ajustes (v{APP_VERSION})</h3>
                  <button onClick={() => setSettingsDrawerOpen(false)} className="w-8 h-8 rounded-full liquid-pill text-xs font-bold">✕</button>
                </div>
                <div className="bg-white/60 rounded-2xl p-4 flex items-center justify-between">
                  <div>
                    <p className="text-xs font-extrabold">Notificaciones Push</p>
                    <p className="text-[11px] text-[#7A6370]">{pushEnabled ? `Activo (${viewMode})` : 'Pendiente'}</p>
                  </div>
                  <button onClick={handleEnablePush} className="px-4 py-2 rounded-full bg-[#E94B77] text-white text-xs font-bold">Activar</button>
                </div>
                <div className="bg-white/60 rounded-2xl p-4 space-y-1.5">
                  <p className="text-xs font-extrabold">URL de Sincronización en la Nube (opcional)</p>
                  <input
                    type="url"
                    value={cloudUrl}
                    onChange={e => {
                      setCloudUrl(e.target.value);
                      try { localStorage.setItem('ciclo_cloud_url_v1', e.target.value); } catch {}
                    }}
                    placeholder="https://tu-proyecto.firebaseio.com"
                    className="w-full bg-white/90 rounded-xl px-3 py-2 text-xs"
                  />
                </div>
                <button
                  onClick={() => {
                    const merged = mergeEventsById(events, INITIAL_EVENTS, []);
                    persistCloud(merged, { ...settings, deletedEventIds: [] });
                    setSettingsDrawerOpen(false);
                    setRewardToast('¡Registros base restaurados!');
                    setTimeout(() => setRewardToast(''), 3000);
                  }}
                  className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-bold"
                >
                  Restaurar registros base (Ago–Nov)
                </button>
                <button
                  onClick={() => {
                    setIsUnlocked(false);
                    setSettingsDrawerOpen(false);
                    try { sessionStorage.removeItem('ciclo_unlocked_v9'); } catch {}
                  }}
                  className="w-full py-3 rounded-full liquid-pill text-[#6B5460] text-xs font-bold"
                >
                  Bloquear sesión
                </button>
              </div>
            </div>
          )}

          {/* Modal de Novedades */}
          {updateModalOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-center justify-center p-5 z-50">
              <div className="liquid-glass rounded-[32px] max-w-sm w-full p-6 shadow-2xl animate-sheet relative">
                <span className="inline-block text-[10px] font-extrabold uppercase liquid-pill text-[#E94B77] px-3 py-1 rounded-full">v{CHANGELOG.version}</span>
                <h3 className="text-lg font-extrabold text-[#2D2229] mt-2">{CHANGELOG.title}</h3>
                <div className="space-y-2.5 my-4">
                  {CHANGELOG.items.map((it, idx) => (
                    <div key={idx} className="flex items-start gap-2.5 bg-white/70 p-3 rounded-2xl">
                      <span className="text-lg">{it.icon}</span>
                      <div>
                        <p className="text-xs font-extrabold">{it.title}</p>
                        <p className="text-[11px] text-[#6B5460]">{it.desc}</p>
                      </div>
                    </div>
                  ))}
                </div>
                <button onClick={dismissUpdateModal} className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-extrabold">Entendido</button>
              </div>
            </div>
          )}

          {/* Modal de Desglose Matemático y Farmacológico del Día */}
          {safeDaysModalOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-center justify-center p-5 z-50">
              <div className="liquid-glass rounded-[30px] max-w-sm w-full p-6 shadow-2xl animate-sheet max-h-[85vh] overflow-y-auto space-y-3.5">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#E94B77]">Desglose Clínico (Wilcox + OMS)</span>
                  <button onClick={() => setSafeDaysModalOpen(false)} className="w-7 h-7 rounded-full liquid-pill text-xs font-bold">✕</button>
                </div>

                <div>
                  <h3 className="text-base font-extrabold text-[#2D2229]">
                    {phase.name} • Wilcox {fertilityScore.pct}%
                  </h3>
                  <p className="text-xs text-[#6B5460] mt-1 leading-relaxed">
                    {fertilityScore.explanation}
                  </p>
                </div>

                {fertilityScore.isHormoneAltered && fertilityScore.compound && (
                  <div className="bg-amber-50/95 border border-amber-300 rounded-2xl p-3.5 space-y-1.5 text-[11px] text-amber-950">
                    <p className="font-extrabold">💊 Compuesto activo: {fertilityScore.compound.shortName}</p>
                    <p><strong>Marcas:</strong> {fertilityScore.compound.brands} (Ventana hasta {fertilityScore.compound.windowHours}h)</p>
                    <p><strong>Auditoría de toma:</strong> {fertilityScore.intakeWindowStatus}</p>
                    <p><strong>Mecanismo:</strong> {fertilityScore.compound.mechanism}</p>
                    <p><strong>Regla post-toma:</strong> {fertilityScore.compound.postTakeRule}</p>
                  </div>
                )}

                <div className="bg-white/75 rounded-2xl p-3.5 border border-white space-y-2 text-[11px]">
                  <p className="font-extrabold text-[#2D2229]">Variables aplicadas hoy ({formatDateES(referenceDate, false)}):</p>
                  <div className="flex justify-between text-[#6B5460]">
                    <span>• Inicio del ciclo activo:</span>
                    <span className="font-bold text-[#2D2229]">{formatDateES(fertilityScore.cycleStart, false)} (Día {fertilityScore.cDay})</span>
                  </div>
                  <div className="flex justify-between text-[#6B5460]">
                    <span>• Duración base EWMA (FIGO):</span>
                    <span className="font-bold text-[#2D2229]">{cycleAnalytics.baseCycleLength} días (±{cycleAnalytics.marginDays}d)</span>
                  </div>
                  <div className="flex justify-between text-[#6B5460]">
                    <span>• Ovulación est. (base / ajustada):</span>
                    <span className="font-bold text-[#2D2229]">
                      Día {fertilityScore.ovDay}{fertilityScore.shiftedOvDay !== fertilityScore.ovDay ? ` → Día ${fertilityScore.shiftedOvDay}` : ''}
                    </span>
                  </div>
                  <div className="flex justify-between text-[#6B5460]">
                    <span>• Probabilidad Wilcox convolucionada:</span>
                    <span className="font-bold text-[#E94B77]">{fertilityScore.wilcoxPct}% (pico máx. real 33%)</span>
                  </div>
                  <div className="flex justify-between text-[#6B5460]">
                    <span>• Pastilla en ciclo activo:</span>
                    <span className={`font-bold ${fertilityScore.isHormoneAltered ? 'text-amber-600' : 'text-emerald-600'}`}>
                      {fertilityScore.isHormoneAltered ? `${fertilityScore.compound.brands} (${formatDateES(fertilityScore.pillDate, false)})` : 'Ninguna'}
                    </span>
                  </div>
                </div>

                <button onClick={() => setSafeDaysModalOpen(false)} className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-extrabold">Entendido</button>
              </div>
            </div>
          )}

          {/* Modal Comparador Farmacológico Femelle One vs Postday */}
          {pharmaCompareModalOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-center justify-center p-5 z-50">
              <div className="liquid-glass rounded-[30px] max-w-md w-full p-6 shadow-2xl animate-sheet max-h-[85vh] overflow-y-auto space-y-3.5">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#5B4BDB]">Farmacología Comparada</span>
                  <button onClick={() => setPharmaCompareModalOpen(false)} className="w-7 h-7 rounded-full liquid-pill text-xs font-bold">✕</button>
                </div>
                <h3 className="text-base font-extrabold text-[#2D2229]">Femelle One (Ulipristal) vs. Postday (Levonorgestrel)</h3>
                {Object.values(PHARMACOLOGY_DB).map(comp => (
                  <div key={comp.id} className="bg-white/80 rounded-2xl p-3.5 border border-white space-y-1.5 text-[11px]">
                    <div className="flex items-center justify-between">
                      <span className="font-extrabold text-xs text-[#2D2229]">{comp.brands}</span>
                      <span className="px-2 py-0.5 rounded-full bg-amber-100 text-amber-900 font-bold text-[10px]">Hasta {comp.windowHours}h</span>
                    </div>
                    <p className="font-bold text-[#E94B77]">{comp.shortName} • {comp.pharmacologicalClass}</p>
                    <p className="text-[#6B5460]"><strong>Mecanismo:</strong> {comp.mechanism}</p>
                    <p className="text-[#6B5460]"><strong>Efecto en calendario:</strong> {comp.cycleEffect}</p>
                    <p className="text-[#6B5460]"><strong>Nota clínica:</strong> {comp.bmiNote}</p>
                  </div>
                ))}
                <button onClick={() => setPharmaCompareModalOpen(false)} className="w-full py-3 rounded-full bg-[#5B4BDB] text-white text-xs font-extrabold">Cerrar</button>
              </div>
            </div>
          )}

          {/* Modal Agregar / Editar Registro */}
          {modalOpen && (
            <div className="fixed inset-0 bg-black/45 backdrop-blur-md flex items-end sm:items-center justify-center sm:p-4 z-50">
              <div className="liquid-glass rounded-t-[34px] sm:rounded-[34px] max-w-md w-full p-6 shadow-2xl animate-sheet max-h-[88vh] overflow-y-auto">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-base font-extrabold text-[#2D2229]">
                    {editingEventId ? 'Editar registro' : 'Nuevo registro'}
                  </h3>
                  <button onClick={() => { setEditingEventId(null); setModalOpen(false); }} className="w-8 h-8 rounded-full liquid-pill text-xs font-bold">✕</button>
                </div>
                <form onSubmit={handleSaveEvent} className="space-y-3">
                  <div className="grid grid-cols-2 gap-1.5">
                    {EVENT_TYPE_OPTIONS.map(opt => (
                      <button
                        key={opt.id}
                        type="button"
                        onClick={() => handleSelectModalType(opt)}
                        className={`p-2.5 rounded-2xl border text-left text-[11px] font-extrabold flex items-center gap-2 transition ${
                          newEventType === opt.id
                            ? 'bg-[#E94B77] text-white border-[#E94B77] shadow-sm'
                            : 'bg-white/75 text-[#2D2229] border-white'
                        }`}
                      >
                        <span className="text-sm">{opt.icon}</span>
                        <span className="leading-tight">{opt.label}</span>
                      </button>
                    ))}
                  </div>

                  {newEventType === 'pill' && (
                    <div className="bg-amber-50/95 border border-amber-300 rounded-2xl p-3 space-y-2">
                      <span className="text-[11px] font-extrabold text-amber-950 block">Selecciona el compuesto activo tomado:</span>
                      <div className="grid grid-cols-2 gap-2">
                        {Object.values(PHARMACOLOGY_DB).map(comp => (
                          <button
                            key={comp.id}
                            type="button"
                            onClick={() => handleSelectPillCompound(comp.id)}
                            className={`p-2.5 rounded-xl border text-left transition ${
                              newEventPillKind === comp.id
                                ? 'bg-amber-500 text-white border-amber-500 shadow-xs'
                                : 'bg-white/90 text-[#2D2229] border-white'
                            }`}
                          >
                            <p className="text-[11px] font-extrabold leading-tight">{comp.brands}</p>
                            <p className={`text-[9px] mt-0.5 ${newEventPillKind === comp.id ? 'text-white/90' : 'text-[#7A6370]'}`}>
                              {comp.shortName}
                            </p>
                          </button>
                        ))}
                      </div>
                      <p className="text-[10px] text-amber-900 leading-snug">
                        {PHARMACOLOGY_DB[newEventPillKind].cycleEffect}
                      </p>
                    </div>
                  )}

                  <input
                    type="text"
                    value={newEventTitle}
                    onChange={e => setNewEventTitle(e.target.value)}
                    placeholder="Título del registro"
                    required
                    className="w-full bg-white/85 rounded-2xl px-3.5 py-2.5 text-xs font-bold text-[#2D2229]"
                  />

                  <div className="grid grid-cols-2 gap-2">
                    <input type="date" value={newEventDate} onChange={e => setNewEventDate(e.target.value)} required className="bg-white/85 rounded-2xl px-3 py-2 text-xs font-bold" />
                    <input type="number" step="0.01" value={newEventTemp} onChange={e => setNewEventTemp(e.target.value)} placeholder="Temp °C (ej. 36.45)" className="bg-white/85 rounded-2xl px-3 py-2 text-xs font-bold" />
                  </div>

                  {newEventType === 'period_start' && (
                    <div className="grid grid-cols-4 gap-1.5">
                      {FLOW_LEVELS.map(fl => (
                        <button
                          key={fl.id}
                          type="button"
                          onClick={() => setNewEventFlow(fl.id)}
                          className={`py-2 rounded-xl border text-[10px] font-bold ${newEventFlow === fl.id ? fl.active : 'bg-white/70 text-[#6B5460] border-white'}`}
                        >
                          {fl.label}
                        </button>
                      ))}
                    </div>
                  )}

                  <div className="flex flex-wrap gap-1.5">
                    {BIOMARKER_TAGS.map(tag => {
                      const active = newEventTags.includes(tag.id);
                      return (
                        <button
                          key={tag.id}
                          type="button"
                          onClick={() => toggleModalTag(tag.id)}
                          className={`px-2.5 py-1 rounded-full text-[10px] font-bold border transition ${active ? 'bg-[#5B4BDB] text-white border-[#5B4BDB]' : 'bg-white/75 text-[#6B5460] border-white'}`}
                        >
                          {tag.label}
                        </button>
                      );
                    })}
                  </div>

                  <textarea rows="2" value={newEventDetails} onChange={e => setNewEventDetails(e.target.value)} placeholder="Notas adicionales..." className="w-full bg-white/85 rounded-2xl px-3.5 py-2 text-xs"></textarea>
                  <button type="submit" className="w-full py-3 rounded-full bg-[#E94B77] text-white text-xs font-extrabold shadow-md">
                    {editingEventId ? 'Guardar cambios' : 'Guardar registro'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
