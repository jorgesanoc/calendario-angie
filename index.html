    function getTodayLocal() {
      const now = new Date();
      return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
    }

    function parseLocalDate(dateStr) {
      const [y, m, d] = (dateStr || getTodayLocal()).split('-').map(Number);
      return new Date(y, (m || 1) - 1, d || 1);
    }

    function formatDateES(dateStr, includeYear = true) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      return includeYear ? `${d} de ${months[m - 1]} ${y}` : `${d} de ${months[m - 1]}`;
    }

    function formatMonthYear(dateStr) {
      const [y, m] = dateStr.split('-').map(Number);
      const months = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      return `${months[m - 1]} ${y}`;
    }

    function addDays(dateStr, days) {
      const dt = parseLocalDate(dateStr);
      dt.setDate(dt.getDate() + days);
      return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;

      const [currentDailyMsg, setCurrentDailyMsg] = useState(null);

      const triggerPinCheck = (nextPin) => {
        if (nextPin.length === ACCESS_PIN.length) {
          if (nextPin === ACCESS_PIN) {
            setIsUnlocked(true);
            setPinError(false);
            setPinInput('');
            try { sessionStorage.setItem('ciclo_unlocked_v7', 'true'); } catch {}
          } else {
            setPinError(true);
            setTimeout(() => {
              setPinInput('');
              setPinError(false);
            }, 450);
          }
        }
      };

      const handlePinDigit = (digit) => {
        if (pinError || pinInput.length >= ACCESS_PIN.length) return;
        const next = pinInput + digit;
        setPinInput(next);
        triggerPinCheck(next);
      };

      const handlePinDelete = () => {
        if (pinError) return;
        setPinInput(prev => prev.slice(0, -1));
      };

      useEffect(() => {
        if (isUnlocked) return;
        const onKeyDown = (e) => {
          if (e.key >= '0' && e.key <= '9') handlePinDigit(e.key);
          else if (e.key === 'Backspace') handlePinDelete();
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [isUnlocked, pinInput, pinError]);

        if (!cloudUrl || !isUnlocked) return;
        const endpoint = `${cloudUrl.trim().replace(/\/+$/, '')}/ciclo_data.json`;

          try {
            const res = await fetch(endpoint);

              const data = await res.json();
              if (data && Array.isArray(data.events) && data.events.length > 0) {
                setEvents(data.events);
                localStorage.setItem('ciclo_bienestar_events_v7', JSON.stringify(data.events));

                setSyncStatus('synced');
              } else {
                await fetch(endpoint, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ events, settings, updatedAt: Date.now() })
                });
                setSyncStatus('synced');
              }
            }
          } catch { setSyncStatus('error'); }
        };
        fetchRemote();
        const interval = setInterval(fetchRemote, 6000);
        return () => clearInterval(interval);
      }, [cloudUrl, isUnlocked]);

      const persistCloud = async (updatedEvents, updatedSettings = settings) => {
        setEvents(updatedEvents);
        setSettings(updatedSettings);
        try {
          localStorage.setItem('ciclo_bienestar_events_v7', JSON.stringify(updatedEvents));
          localStorage.setItem('ciclo_bienestar_settings_v1', JSON.stringify(updatedSettings));
        } catch {}
        if (cloudUrl) {
          setSyncStatus('syncing');
          try {
            await fetch(`${cloudUrl.trim().replace(/\/+$/, '')}/ciclo_data.json`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ events: updatedEvents, settings: updatedSettings, updatedAt: Date.now() })
            });
            setSyncStatus('synced');
          } catch { setSyncStatus('error'); }
        }
      };

      const toggleBleedingDay = (dateStr, flowLevel = 'medium') => {
        const existing = events.find(e => e.date === dateStr && (e.type === 'period_day' || e.type === 'period_start'));
        if (existing) {
          if (existing.flow === flowLevel) {
            persistCloud(events.filter(e => e.id !== existing.id));
          } else {
            persistCloud(events.map(e => e.id === existing.id ? { ...e, flow: flowLevel, details: `Flujo ${FLOW_LEVELS.find(f => f.id === flowLevel)?.label.toLowerCase()}.` } : e));
          }
        } else {
          const hadPrev = events.some(e => e.date === addDays(dateStr, -1) && (e.type === 'period_day' || e.type === 'period_start'));
          const created = {
            id: String(Date.now()),
            date: dateStr,
            type: hadPrev ? 'period_day' : 'period_start',
            title: hadPrev ? 'Día de Periodo' : 'Inicio de Periodo',
            details: `Flujo ${FLOW_LEVELS.find(f => f.id === flowLevel)?.label.toLowerCase()}.`,
            tags: [],
            flow: flowLevel,
            alteredCycle: false
          };
          persistCloud([...events, created].sort((a, b) => b.date.localeCompare(a.date)));
        }
      };

      const cycleAnalytics = useMemo(() => {
        const periodStarts = events.filter(e => e.type === 'period_start').sort((a, b) => a.date.localeCompare(b.date));
        const periodDaySet = new Set(events.filter(e => e.type === 'period_day' || e.type === 'period_start').map(e => e.date));
        const starts = periodStarts.length ? periodStarts.map(e => e.date) : [todayStr];
        const historyRows = [];
        const naturalLengths = [];

        for (let i = 0; i < periodStarts.length; i++) {
          const curr = periodStarts[i];
          const next = periodStarts[i + 1];
          const length = next ? diffDays(curr.date, next.date) : null;
          const hasPillBetween = next ? events.some(ev => ev.type === 'pill' && ev.date >= curr.date && ev.date < next.date) : false;
          let bleedDays = 1;
          while (periodDaySet.has(addDays(curr.date, bleedDays)) && bleedDays < 12) bleedDays++;
          const estimatedBleedDays = bleedDays > 1 ? bleedDays : 5;

          if (length !== null && !hasPillBetween && !next?.alteredCycle && length >= 21 && length <= 45) {
            naturalLengths.push(length);
          }
          historyRows.push({
            id: curr.id, start: curr.date, end: addDays(curr.date, estimatedBleedDays - 1),
            bleedDays: estimatedBleedDays, length,
            isAltered: Boolean(hasPillBetween || next?.alteredCycle || (length !== null && length < 21))
          });
        }

        const avgCycleLength = naturalLengths.length > 0 ? Math.round(naturalLengths.reduce((a, b) => a + b, 0) / naturalLengths.length) : 28;
        const minObservedCycle = naturalLengths.length > 0 ? Math.min(...naturalLengths) : 28;
        const maxObservedCycle = naturalLengths.length > 0 ? Math.max(...naturalLengths, 28) : 28;
        const isIrregular = (maxObservedCycle - minObservedCycle) >= 7;

        const peakOvulationOffset = Math.max(10, avgCycleLength - 14);
        const peakStartOffset = Math.max(8, peakOvulationOffset - 2);
        const peakEndOffset = peakOvulationOffset + 1;
        const safeFertileStartOffset = Math.max(5, Math.min(8, peakOvulationOffset - 5));
        const safeFertileEndOffset = Math.min(avgCycleLength - 3, Math.max(peakOvulationOffset + 3, maxObservedCycle > 30 ? 21 : 16));

        const cleanTempLogs = events.filter(ev => typeof ev.bbt === 'number' && !Number.isNaN(ev.bbt))
          .map(ev => ({ date: ev.date, temp: ev.bbt, noisy: (ev.tags || []).includes('poor_sleep') }))
          .sort((a, b) => a.date.localeCompare(b.date));
        const validTemps = cleanTempLogs.filter(x => !x.noisy);
        const baselineTemp = validTemps.length > 0 ? Number((validTemps.reduce((a, c) => a + c.temp, 0) / validTemps.length).toFixed(2)) : null;
        const thermalOvulationConfirmed = baselineTemp !== null && validTemps.filter(x => x.temp >= baselineTemp + 0.2).length >= 3;

        const prePeriodTagCounts = {};
        periodStarts.forEach(ps => {
          events.filter(ev => { const d = diffDays(ev.date, ps.date); return d >= 1 && d <= 3; })
            .forEach(ev => (ev.tags || []).forEach(tid => { prePeriodTagCounts[tid] = (prePeriodTagCounts[tid] || 0) + 1; }));
        });
        const correlatedSymptoms = Object.entries(prePeriodTagCounts).filter(([, c]) => c >= 2)
          .map(([tid, count]) => { const t = SYMPTOM_TAGS.find(x => x.id === tid); return t ? { ...t, count } : null; }).filter(Boolean);

        return {
          starts, periodDaySet, historyRows: historyRows.reverse(), baseCycleLength: avgCycleLength,
          minObservedCycle, maxObservedCycle, isIrregular,
          safeFertileStartOffset, peakStartOffset, peakOvulationOffset, peakEndOffset, safeFertileEndOffset,
          cleanTempLogs, baselineTemp, thermalOvulationConfirmed, correlatedSymptoms
        };

      const activeMethod = useMemo(() => BIRTH_CONTROL_METHODS.find(m => m.id === settings.birthControlMethod) || BIRTH_CONTROL_METHODS[0], [settings.birthControlMethod]);

      const activePeriodStart = useMemo(() => {

      const activePillInCycle = useMemo(() => events.find(ev => ev.type === 'pill' && ev.date >= activePeriodStart && ev.date <= referenceDate), [events, activePeriodStart, referenceDate]);

      const cycleDay = Math.max(1, diffDays(activePeriodStart, referenceDate) + 1);

          possibleSymptoms: ['Antojos', 'Cansancio', 'Sensibilidad']

      }, [cycleDay, cycleAnalytics, activePillInCycle]);

      const getDayStatus = (dateStr) => {
        const allStarts = [...cycleAnalytics.starts, ...projectedPeriodStarts];
        const explicitBleed = cycleAnalytics.periodDaySet.has(dateStr);
        const periodMatch = allStarts.find(s => {

          const dur = hist ? hist.bleedDays - 1 : 4;

          tags: newEventTags, alteredCycle: newEventType === 'period_start' ? newEventAltered : false,
          flow: newEventType === 'period_start' ? newEventFlow : undefined, bbt: validTemp
        };

        setSelectedDay(newEventDate);
        setModalOpen(false);
      };

      const handleExportJsonBackup = () => {

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `ciclo-respaldo-${todayStr}.json`; a.click();

      const handleImportJsonBackup = (e) => {

        };
        reader.readAsText(file);
      };

      const handleExportMedicalReport = () => {
        const w = window.open('', '_blank', 'width=850,height=900');
        if (!w) { window.print(); return; }
        const rows = cycleAnalytics.historyRows.map(c => `<tr><td style="padding:8px;border-bottom:1px solid #eee">${formatDateES(c.start)} – ${formatDateES(c.end)}</td><td style="padding:8px;border-bottom:1px solid #eee">${c.length ? c.length + ' días' : 'En curso'}</td><td style="padding:8px;border-bottom:1px solid #eee">${c.isAltered ? 'Alterado' : 'Natural'}</td></tr>`).join('');
        w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Reporte Clínico</title><style>body{font-family:sans-serif;padding:28px;color:#222}h1{color:#E94B77}table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;padding:8px;border-bottom:2px solid #ddd}</style></head><body><h1>Resumen Clínico de Ciclo</h1><p>Generado: ${formatDateES(todayStr)} • Promedio: ${cycleAnalytics.baseCycleLength} días • Método: ${activeMethod.label}</p><table><thead><tr><th>Periodo</th><th>Duración</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table><script>window.print()<\/script></body></html>`);
        w.document.close();
      };

      const heroBig = cycleDay <= 5 ? `Día ${cycleDay}` : daysUntilNext === 0 ? 'Hoy' : `${Math.abs(daysUntilNext)} ${Math.abs(daysUntilNext) === 1 ? 'día' : 'días'}`;

      const daysInMonth = new Date(currentMonth.year, currentMonth.month + 1, 0).getDate();

          >

                  <div className="flex gap-2">
                    <button type="button" onClick={() => setModalOpen(false)} className="flex-1 py-3 rounded-full bg-[#FFF0F4] text-[#E94B77] text-xs font-bold">Cancelar</button>
                    <button type="submit" className="flex-1 py-3 rounded-full bg-[#E94B77] text-white text-xs font-bold shadow-md shadow-rose-200">Guardar</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
