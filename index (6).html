    function formatDateES(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      return `${d} de ${months[m - 1]} ${y}`;
    }

    function addDays(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      const yy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    function diffDays(startStr, endStr) {
      const [y1, m1, d1] = startStr.split('-').map(Number);
      const [y2, m2, d2] = endStr.split('-').map(Number);
      const dt1 = new Date(y1, m1 - 1, d1);
      const dt2 = new Date(y2, m2 - 1, d2);
      return Math.round((dt2 - dt1) / (1000 * 60 * 60 * 24));
    }

      try {

      if (seen.length >= pool.length) {
        seen = [];
      }

      const available = [];
      for (let i = 0; i < pool.length; i++) {
        if (!seen.includes(i)) available.push(i);
      }

      const chosenIdx = available[Math.floor(Math.random() * available.length)];
      seen.push(chosenIdx);
      try {
        localStorage.setItem(storageKey, JSON.stringify(seen));
      } catch {}

      return {
        ...pool[chosenIdx],
        number: seen.length,
        total: pool.length
      };
    }

        const peakEndOffset = 14;         // Día 15
        const safeFertileEndOffset = maxObservedCycle > 30 ? 21 : 16; // Día 22

        return {
          starts,
          historyRows: historyRows.reverse(),
          baseCycleLength,
          maxObservedCycle,
          safeFertileStartOffset,
          peakStartOffset,
          peakOvulationOffset,
          peakEndOffset,
          safeFertileEndOffset
        };
      }, [events]);

      const activePeriodStart = useMemo(() => {
        const valid = cycleAnalytics.starts.filter(d => d <= referenceDate);
        return valid.length ? valid[valid.length - 1] : cycleAnalytics.starts[0];
      }, [cycleAnalytics.starts, referenceDate]);

      const cycleDay = Math.max(1, diffDays(activePeriodStart, referenceDate) + 1);
      const nextPeriodEst = addDays(activePeriodStart, cycleAnalytics.baseCycleLength);
      const daysUntilNext = diffDays(referenceDate, nextPeriodEst);
      const fertileStart = addDays(activePeriodStart, cycleAnalytics.safeFertileStartOffset);
      const fertileEnd = addDays(activePeriodStart, cycleAnalytics.safeFertileEndOffset);
      const ovulationDay = addDays(activePeriodStart, cycleAnalytics.peakOvulationOffset);

      const getPhaseKey = (day) => {
        const fStart = cycleAnalytics.safeFertileStartOffset + 1;
        const fEnd = cycleAnalytics.safeFertileEndOffset + 1;
        if (day <= 5) return 'menstrual';
        if (day >= fStart && day <= fEnd) return 'ovulatory';
        if (day < fStart) return 'folicular';
        return 'luteal';
      };

      const currentPhaseKey = getPhaseKey(cycleDay);

      // Generar mensaje inicial cuando entra o cambia de fase
      useEffect(() => {
        if (isUnlocked && !currentDailyMsg) {
          setCurrentDailyMsg(pickNextDailyMessage(currentPhaseKey));
          setWelcomeModalOpen(true);
        }
      }, [isUnlocked, currentPhaseKey]);

      const handleUnlock = (e) => {
        e.preventDefault();
        if (pinInput.trim() === ACCESS_PIN) {
          setIsUnlocked(true);
          setPinError(false);
          try { sessionStorage.setItem('ciclo_unlocked_v7', 'true'); } catch {}
          setCurrentDailyMsg(pickNextDailyMessage(currentPhaseKey));
          setWelcomeModalOpen(true);
        } else {
          setPinError(true);
          setPinInput('');
        }
      };

      const handleLock = () => {
        setIsUnlocked(false);
        setPinInput('');
        setCurrentDailyMsg(null);
        try { sessionStorage.removeItem('ciclo_unlocked_v7'); } catch {}
      };

      const handleNewMotivationalMsg = () => {
        setCurrentDailyMsg(pickNextDailyMessage(currentPhaseKey));
      };

      const safeWindows = useMemo(() => {
        const safeEndOffset = cycleAnalytics.safeFertileEndOffset;
        const preOvStart = addDays(activePeriodStart, 5);
        const preOvEnd = addDays(activePeriodStart, cycleAnalytics.safeFertileStartOffset - 1);
        const postOvStart = addDays(activePeriodStart, safeEndOffset + 1);
        const postOvEnd = addDays(nextPeriodEst, -1);

        const nextPreOvStart = addDays(nextPeriodEst, 5);
        const nextPreOvEnd = addDays(nextPeriodEst, cycleAnalytics.safeFertileStartOffset - 1);
        const nextPostOvStart = addDays(nextPeriodEst, safeEndOffset + 1);
        const nextPostOvEnd = addDays(nextPeriodEst, cycleAnalytics.baseCycleLength - 1);

        const isCurrentlySafe = (referenceDate >= preOvStart && referenceDate <= preOvEnd) ||
                                (referenceDate >= postOvStart && referenceDate <= postOvEnd) ||
                                (cycleDay <= 5);

        let nextSafeRange = null;
        if (referenceDate < preOvStart) {
          nextSafeRange = { start: preOvStart, end: preOvEnd, label: 'Fase Folicular Temprana (Días 6–8)', risk: 'Muy Bajo' };
        } else if (referenceDate <= preOvEnd) {
          nextSafeRange = { start: referenceDate, end: preOvEnd, label: 'Hoy están dentro de ventana de bajo riesgo (Días 6–8)', risk: 'Muy Bajo' };
        } else if (referenceDate < postOvStart) {
          nextSafeRange = { start: postOvStart, end: postOvEnd, label: 'Fase Lútea Segura post-ovulación (Días 23–28)', risk: 'Mínimo (Óvulo ya no viable)' };
        } else if (referenceDate <= postOvEnd) {
          nextSafeRange = { start: referenceDate, end: postOvEnd, label: 'Hoy están en la etapa más segura del ciclo (Días 23–28)', risk: 'Mínimo' };
        } else {
          nextSafeRange = { start: nextPreOvStart, end: nextPreOvEnd, label: 'Siguiente ciclo post-periodo (Días 6–8)', risk: 'Muy Bajo' };
        }

        return {
          preOvStart,
          preOvEnd,
          postOvStart,
          postOvEnd,
          nextPreOvStart,
          nextPreOvEnd,
          nextPostOvStart,
          nextPostOvEnd,
          isCurrentlySafe,
          nextSafeRange
        };
      }, [activePeriodStart, nextPeriodEst, referenceDate, cycleDay, cycleAnalytics]);

      const getPhaseInfo = (day) => {
        const fStart = cycleAnalytics.safeFertileStartOffset + 1;
        const pStart = cycleAnalytics.peakStartOffset + 1;
        const pEnd = cycleAnalytics.peakEndOffset + 1;
        const fEnd = cycleAnalytics.safeFertileEndOffset + 1;

        if (day <= 5) {
          return {
            name: 'Fase Menstrual',
            fertility: 'Muy Baja (Menor Riesgo)',
            desc: 'Días de sangrado menstrual. Priorizar descanso, calor local e hidratación.',
            partnerTip: 'Modo Pareja: Nivel de energía bajo y posible sensibilidad física. Ideal consentirla, evitar esfuerzos pesados y ofrecer algo calientito.',
            ringColor: '#FF4B72',
            badgeBg: 'bg-rose-100 text-rose-700',
            emoji: '🌷'
          };
        }
        if (day >= pStart && day <= pEnd) {
          return {
            name: 'Pico de Ovulación',
            fertility: 'Muy Alta (Riesgo Máximo)',
            desc: 'Días centrales de máxima fertilidad en ciclo estándar de 28 días. Uso obligatorio de condón.',
            partnerTip: 'Modo Pareja: Máxima fertilidad biológica y pico hormonal. Precaución absoluta: usar protección de barrera desde el inicio en cada encuentro.',
            ringColor: '#EF4444',
            badgeBg: 'bg-red-100 text-red-700',
            emoji: '✨'
          };
        }
        if (day >= fStart && day <= fEnd) {
          return {
            name: 'Ventana Fértil Ampliada',
            fertility: 'Alta (Margen Seguridad)',
            desc: 'Dentro del margen de seguridad (Días 9–22) que cubre tanto ciclo de 28 días como posibles desfases hormonales.',
            partnerTip: 'Modo Pareja: Zona de precaución activa por margen de seguridad amplio. Mantener uso estricto de protección de barrera hasta pasar el día 22.',
            ringColor: '#F59E0B',
            badgeBg: 'bg-amber-100 text-amber-800',
            emoji: '☀️'
          };
        }
        if (day < fStart) {
          return {
            name: 'Fase Folicular Temprana',
            fertility: 'Baja (Menor Riesgo)',
            desc: 'Días inmediatos posteriores al periodo antes de abrir la ventana fértil.',
            partnerTip: 'Modo Pareja: Buen ánimo, claridad mental y energía en subida. Buen momento para salidas o planes activos juntos.',
            ringColor: '#10B981',
            badgeBg: 'bg-emerald-100 text-emerald-800',
            emoji: '🌱'
          };
        }
        return {
          name: 'Fase Lútea Segura',
          fertility: 'Mínima (Menor Riesgo)',
          desc: 'Etapa posterior al margen fértil ampliado hasta el inicio del siguiente periodo.',
          partnerTip: 'Modo Pareja: Etapa de menor riesgo biológico del ciclo. Posible cansancio premenstrual; ideal planes relajados y consentirla.',
          ringColor: '#10B981',
          badgeBg: 'bg-emerald-100 text-emerald-800',
          emoji: '🌙'
        };
      };

      const phase = getPhaseInfo(cycleDay);

      const openAddModal = (type, dateOverride) => {
        const targetDate = dateOverride || referenceDate;

        const defaultTitles = {

      const handleSaveEvent = (e) => {

        const created = {

          details: newEventDetails.trim() || 'Registrado en bitácora.',

        const updated = [...events, created].sort((a, b) => b.date.localeCompare(a.date));
        persistEvents(updated);
        setSelectedDay(newEventDate);
        setModalOpen(false);
      };

      const handleDeleteEvent = (id) => {
        const updated = events.filter(ev => ev.id !== id);
        persistEvents(updated);

      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const daysInMonth = new Date(currentMonth.year, currentMonth.month + 1, 0).getDate();
      const firstWeekday = new Date(currentMonth.year, currentMonth.month, 1).getDay();

      const prevMonth = () => {
        setCurrentMonth(prev => prev.month === 0 ? { year: prev.year - 1, month: 11 } : { year: prev.year, month: prev.month - 1 });
      };
      const nextMonth = () => {
        setCurrentMonth(prev => prev.month === 11 ? { year: prev.year + 1, month: 0 } : { year: prev.year, month: prev.month + 1 });
      };

      const getDayStatus = (dateStr) => {
        const allPeriodStarts = [...cycleAnalytics.starts, nextPeriodEst];
        const allPeriods = allPeriodStarts.map(s => ({
          start: s,
          end: addDays(s, 4),
          isProjected: s === nextPeriodEst
        }));
        const periodMatch = allPeriods.find(r => dateStr >= r.start && dateStr <= r.end);

        const isPeak = allPeriodStarts.some(s =>
          dateStr >= addDays(s, cycleAnalytics.peakStartOffset) &&
          dateStr <= addDays(s, cycleAnalytics.peakEndOffset)
        );
        const isFertile = allPeriodStarts.some(s =>
          dateStr >= addDays(s, cycleAnalytics.safeFertileStartOffset) &&
          dateStr <= addDays(s, cycleAnalytics.safeFertileEndOffset)
        );

        const isLowRisk = allPeriodStarts.some(s => {
          const d6 = addDays(s, 5);
          const d8 = addDays(s, cycleAnalytics.safeFertileStartOffset - 1);
          const d23 = addDays(s, cycleAnalytics.safeFertileEndOffset + 1);
          const d28 = addDays(s, cycleAnalytics.baseCycleLength - 1);
          return (dateStr >= d6 && dateStr <= d8) || (dateStr >= d23 && dateStr <= d28);
        });

        const dayEvents = events.filter(e => e.date === dateStr);
        return {
          isPeriod: Boolean(periodMatch),
          isProjectedPeriod: Boolean(periodMatch && periodMatch.isProjected),
          isFertile,
          isPeak,
          isLowRisk,
          dayEvents
        };
      };

      const selectedDayInfo = getDayStatus(selectedDay);
      const sortedEvents = [...events].sort((a, b) => b.date.localeCompare(a.date));

      const getEventBadge = (type) => {
        switch (type) {

          case 'intimacy_protected': return { icon: '🛡️❤️', label: 'Con protección', color: 'bg-purple-100 text-purple-700 border-purple-200' };
          case 'intimacy_unprotected': return { icon: '❤️', label: 'Sin protección', color: 'bg-pink-100 text-pink-700 border-pink-200' };
          case 'pill': return { icon: '💊', label: 'Emergencia', color: 'bg-amber-100 text-amber-800 border-amber-200' };
          default: return { icon: '🩺', label: 'Síntoma / Nota', color: 'bg-sky-100 text-sky-700 border-sky-200' };
        }
      };

      const handleExportMedicalReport = () => {
        const reportWindow = window.open('', '_blank', 'width=850,height=900');
        if (!reportWindow) {
          window.print();
          return;
        }
        const cyclesHtml = cycleAnalytics.historyRows.map(c => `
          <tr>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${formatDateES(c.start)} – ${formatDateES(c.end)}</td>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${c.length ? c.length + ' días' : 'En curso'}</td>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${c.isAltered ? 'Alterado (Postday)' : 'Natural'}</td>
          </tr>
        `).join('');

        const eventsHtml = sortedEvents.map(ev => {
          const tagsText = (ev.tags || [])
            .map(tid => SYMPTOM_TAGS.find(t => t.id === tid)?.label)
            .filter(Boolean)
            .join(', ');
          return `
            <tr>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;white-space:nowrap;">${formatDateES(ev.date)}</td>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;font-weight:bold;">${ev.title}</td>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${ev.details}${tagsText ? ' [' + tagsText + ']' : ''}</td>
            </tr>
          `;
        }).join('');

        reportWindow.document.write(`
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <title>Reporte Ginecológico - Ciclo & Bienestar</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1e293b; padding: 32px; max-width: 800px; margin: 0 auto; }
              h1 { color: #e11d48; margin-bottom: 4px; font-size: 22px; }
              .sub { color: #64748b; font-size: 13px; margin-bottom: 24px; }
              .summary-box { display: flex; gap: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 24px; }
              .summary-item { flex: 1; }
              .summary-item span { display: block; font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: bold; }
              .summary-item strong { font-size: 16px; color: #0f172a; }
              h2 { font-size: 16px; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; margin-top: 24px; }
              table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
              th { background: #f8fafc; padding: 8px; border-bottom: 2px solid #cbd5e1; color: #475569; }
              @media print { .no-print { display: none; } }
            </style>
          </head>
          <body>
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div>
                <h1>Resumen Clínico y Control de Ciclo Menstrual</h1>
                <div class="sub">Generado el ${formatDateES(referenceDate)} • Registro histórico sincronizado</div>
              </div>
              <button class="no-print" onclick="window.print()" style="background:#0f172a;color:white;border:none;padding:10px 16px;border-radius:8px;font-weight:bold;cursor:pointer;">🖨️ Imprimir / Guardar PDF</button>
            </div>

            <div class="summary-box">
              <div class="summary-item">
                <span>Último Periodo (FUM)</span>
                <strong>${formatDateES(activePeriodStart)}</strong>
              </div>
              <div class="summary-item">
                <span>Ciclo Base / Máx. Obs.</span>
                <strong>28 días (máx. ${cycleAnalytics.maxObservedCycle}d)</strong>
              </div>
              <div class="summary-item">
                <span>Margen Fértil Ampliado</span>
                <strong>${formatDateES(fertileStart)} – ${formatDateES(fertileEnd)}</strong>
              </div>
              <div class="summary-item">
                <span>Próximo Periodo Est.</span>
                <strong>${formatDateES(nextPeriodEst)}</strong>
              </div>
            </div>

            <h2>Historial de Ciclos Menstruales</h2>
            <table>
              <thead>
                <tr><th>Fechas de Sangrado</th><th>Duración del Ciclo</th><th>Clasificación</th></tr>
              </thead>
              <tbody>${cyclesHtml}</tbody>
            </table>

            <h2>Bitácora Clínica, Estudios y Síntomas</h2>
            <table>
              <thead>
                <tr><th>Fecha</th><th>Evento</th><th>Detalle y Sintomatología</th></tr>
              </thead>
              <tbody>${eventsHtml}</tbody>
            </table>
          </body>
          </html>
        `);
        reportWindow.document.close();
      };

      if (!isUnlocked) {
        return (
          <div className="min-h-screen flex items-center justify-center px-4 bg-gradient-to-br from-rose-50 via-white to-fuchsia-50">
            <div className="bg-white rounded-3xl shadow-xl border border-rose-100 max-w-sm w-full p-7 text-center">
              <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-rose-500 to-fuchsia-500 flex items-center justify-center text-white text-3xl mx-auto mb-4 shadow-md">
                🔒
              </div>
              <h1 className="text-xl font-extrabold text-slate-900">Espacio Privado</h1>
              <p className="text-xs text-slate-500 mt-1 mb-6">
                Ingresa el código de seguridad para ver y editar el calendario de Ciclo & Bienestar.
              </p>

              <form onSubmit={handleUnlock} className="space-y-4">
                <input
                  type="password"
                  inputMode="numeric"
                  value={pinInput}
                  onChange={(e) => { setPinInput(e.target.value); setPinError(false); }}
                  placeholder="••••"
                  maxLength={8}
                  autoFocus
                  className="w-full text-center text-2xl tracking-[0.5em] font-bold border-2 border-slate-200 rounded-2xl py-3 px-4 focus:outline-none focus:border-rose-500 transition"
                />
                {pinError && (
                  <p className="text-xs font-bold text-rose-600">Código incorrecto. Intenta de nuevo.</p>
                )}
                <button
                  type="submit"
                  className="w-full py-3.5 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm shadow-md transition"
                >
                  Desbloquear Calendario
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-3xl mx-auto px-4 pt-4">
          <header className="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 mb-5 flex flex-col gap-3 no-print">
            <div className="flex items-center justify-between gap-2">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-rose-500 to-fuchsia-500 flex items-center justify-center text-white text-xl shadow-sm">
                  💗
                </div>
                <div>
                  <h1 className="text-lg font-bold text-slate-900 leading-tight">Ciclo & Bienestar</h1>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <span className={`inline-block w-2 h-2 rounded-full ${syncStatus === 'synced' ? 'bg-emerald-500' : syncStatus === 'error' ? 'bg-rose-500' : 'bg-amber-400 animate-pulse'}`}></span>
                    <span className="text-[11px] font-medium text-slate-500">
                      {syncStatus === 'synced' ? 'Sincronizado en tiempo real' : syncStatus === 'error' ? 'Sin conexión a la nube' : 'Sincronizando...'}
                    </span>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-1.5">
                <button
                  onClick={() => setWelcomeModalOpen(true)}
                  title="Ver mensaje bonito del día"
                  className="text-xs font-bold px-2.5 py-2 rounded-xl bg-fuchsia-50 text-fuchsia-700 border border-fuchsia-200 hover:bg-fuchsia-100 transition flex items-center gap-1"
                >
                  <span>💌</span> <span className="hidden sm:inline">Mensaje</span>
                </button>
                <button
                  onClick={() => setSafeDaysModalOpen(true)}
                  className="text-xs font-bold px-2.5 py-2 rounded-xl bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition flex items-center gap-1"
                >
                  <span>🟢</span> <span className="hidden sm:inline">Seguros</span>
                </button>
                <button
                  onClick={handleInstallClick}
                  title="Instalar como App en el celular"
                  className="text-xs font-bold px-2.5 py-2 rounded-xl bg-rose-50 text-rose-700 hover:bg-rose-100 transition flex items-center gap-1"
                >
                  <span>📲</span>
                </button>
                <button
                  onClick={handleLock}
                  title="Bloquear aplicación"
                  className="text-xs font-bold px-2.5 py-2 rounded-xl bg-slate-100 text-slate-600 hover:bg-slate-200 transition flex items-center gap-1"
                >
                  <span>🔒</span>
                </button>
              </div>
            </div>

            <nav className="hidden md:flex bg-slate-100 p-1 rounded-xl gap-1">
              <button
                onClick={() => setActiveTab('today')}
                className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'today' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >

              <button
                onClick={() => setActiveTab('calendar')}
                className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'calendar' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                Calendario Mensual
              </button>
              <button
                onClick={() => setActiveTab('history')}
                className={`flex-1 py-2 rounded-lg text-sm font-semibold transition ${activeTab === 'history' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                Historial y Reporte
              </button>
            </nav>
          </header>

          {activeTab === 'today' && (
            <div className="space-y-4">
              {/* Banner compacto del Mensaje Bonito del Día en Hoy */}
              {currentDailyMsg && (
                <div
                  onClick={() => setWelcomeModalOpen(true)}
                  className="bg-gradient-to-r from-rose-500 via-pink-500 to-fuchsia-600 text-white rounded-2xl p-4 shadow-sm cursor-pointer hover:opacity-95 transition relative overflow-hidden"
                >
                  <div className="flex items-start justify-between gap-3">
                    <div className="flex items-start gap-3">
                      <span className="text-2xl mt-0.5">{phase.emoji}</span>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-[10px] font-bold uppercase tracking-wider bg-white/20 px-2 py-0.5 rounded-full">
                            Para ti hoy • Día {cycleDay} ({phase.name})
                          </span>
                        </div>
                        <p className="text-sm font-semibold mt-1.5 leading-snug">
                          "{currentDailyMsg.main}"

                        <p className="text-xs text-rose-100 mt-1 italic">
                          {currentDailyMsg.moral}
                        </p>
                      </div>
                    </div>
                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); handleNewMotivationalMsg(); }}
                      title="Ver otro mensaje"
                      className="bg-white/20 hover:bg-white/30 text-white text-xs font-bold px-2.5 py-1.5 rounded-xl shrink-0 transition"
                    >
                      🔄
                    </button>
                  </div>
                </div>
              )}

              <div className="bg-white rounded-2xl shadow-sm border border-slate-100 p-3.5 flex flex-wrap items-center justify-between gap-2">
                <div className="flex items-center gap-2 text-sm">

                </div>

                <p className="text-xs text-slate-600 mb-4 leading-relaxed">
                  Calculados excluyendo toda la ventana fértil ampliada (<strong>Días 9 al 22</strong>). En estas fechas la probabilidad biológica de embarazo es mínima, aunque siempre se recomienda mantener protección de barrera para mayor tranquilidad.
                </p>

                <div className="space-y-3">
                  <div className="p-3.5 rounded-xl bg-emerald-50 border border-emerald-200">
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold uppercase tracking-wider text-emerald-700">Etapa Más Segura • Ciclo Actual</span>
                      <span className="text-[10px] font-bold bg-emerald-600 text-white px-2 py-0.5 rounded-full">Días 23–28</span>
                    </div>
                    <p className="text-base font-extrabold text-emerald-950 mt-1">
                      {formatDateES(safeWindows.postOvStart)} al {formatDateES(safeWindows.postOvEnd)}
                    </p>
                    <p className="text-xs text-emerald-800 mt-1">
                      Posterior a la ovulación (el óvulo ya no es viable y falta poco para el periodo).
                    </p>
                  </div>

                  <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                    <div className="flex items-center justify-between">
                      <span className="text-[11px] font-bold uppercase tracking-wider text-slate-500">Ventana Pre-Ovulatoria • Ciclo Actual</span>
                      <span className="text-[10px] font-bold bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full">Días 6–8</span>
                    </div>
                    <p className="text-sm font-bold text-slate-800 mt-1">
                      {formatDateES(safeWindows.preOvStart)} al {formatDateES(safeWindows.preOvEnd)}
                    </p>
                    <p className="text-xs text-slate-500 mt-0.5">
                      Días inmediatos al terminar el periodo menstrual.
                    </p>
                  </div>

                  <div className="p-3.5 rounded-xl bg-teal-50/60 border border-teal-200">
                    <span className="text-[11px] font-bold uppercase tracking-wider text-teal-700">Proyección Siguiente Ciclo (Dic 2026)</span>
                    <div className="mt-1.5 space-y-1 text-xs text-slate-700">
                      <p>• <strong>Post-periodo (Días 6–8):</strong> {formatDateES(safeWindows.nextPreOvStart).replace(' 2026', '')} al {formatDateES(safeWindows.nextPreOvEnd).replace(' 2026', '')}</p>
                      <p>• <strong>Fase Lútea Segura (Días 23–28):</strong> {formatDateES(safeWindows.nextPostOvStart).replace(' 2026', '')} al {formatDateES(safeWindows.nextPostOvEnd).replace(' 2026', '')}</p>
                    </div>
                  </div>
                </div>

                <button
                  onClick={() => setSafeDaysModalOpen(false)}
                  className="w-full mt-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold hover:bg-slate-800"
                >
                  Entendido
                </button>
              </div>
            </div>
          )}

          {modalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl my-8">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-900">Nuevo Registro</h3>
                  <button onClick={() => setModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveEvent} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Tipo de evento</label>
                    <select
                      value={newEventType}
                      onChange={(e) => setNewEventType(e.target.value)}
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
                    >
                      <option value="period_start">🩸 Inicio de Periodo</option>
                      <option value="intimacy_protected">🛡️❤️ Relación con Condón</option>
                      <option value="intimacy_unprotected">❤️ Relación sin Protección</option>
                      <option value="pill">💊 Pastilla de Emergencia</option>
                      <option value="medical">🩺 Síntomas / Ánimo / Estudio</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Fecha</label>
                    <input
                      type="date"
                      value={newEventDate}
                      onChange={(e) => setNewEventDate(e.target.value)}
                      required
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
                    />
                  </div>

                  {newEventType === 'period_start' && (
                    <label className="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-xs text-amber-900 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={newEventAltered}
                        onChange={(e) => setNewEventAltered(e.target.checked)}
                        className="rounded text-rose-500"
                      />
                      <span>Este periodo se adelantó/retrasó por pastilla de emergencia</span>
                    </label>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Título</label>
                    <input
                      type="text"
                      value={newEventTitle}
                      onChange={(e) => setNewEventTitle(e.target.value)}
                      required
                      placeholder="Ej. Registro del día"
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1.5">Etiquetas rápidas de síntomas y ánimo</label>
                    <div className="flex flex-wrap gap-1.5">
                      {SYMPTOM_TAGS.map(tag => {
                        const active = newEventTags.includes(tag.id);
                        return (
                          <button
                            type="button"
                            key={tag.id}
                            onClick={() => toggleTag(tag.id)}
                            className={`text-[11px] px-2.5 py-1 rounded-full border font-medium transition ${active ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                          >
                            {tag.icon} {tag.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Detalles / Notas (opcional)</label>
                    <textarea
                      rows="2"
                      value={newEventDetails}
                      onChange={(e) => setNewEventDetails(e.target.value)}
                      placeholder="Notas adicionales..."
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
                    ></textarea>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setModalOpen(false)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-bold hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-rose-500 text-white text-sm font-bold hover:bg-rose-600"
                    >
                      Guardar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showPwaGuide && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-base font-bold text-slate-900">Instalar como App Nativa</h3>
                  <button onClick={() => setShowPwaGuide(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>
                <div className="space-y-3 text-xs text-slate-600 leading-relaxed">
                  <p>Esta aplicación ya incluye su propio ícono y configuración de pantalla completa:</p>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p className="font-bold text-slate-900 mb-1">En iPhone (Safari):</p>
                    <p>Toca el botón <strong>Compartir</strong> (cuadro con flecha hacia arriba abajo) y selecciona <strong>"Agregar a inicio"</strong>.</p>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p className="font-bold text-slate-900 mb-1">En Android (Chrome):</p>
                    <p>Toca los <strong>3 puntos</strong> (arriba a la derecha) y elige <strong>"Instalar aplicación"</strong> o <strong>"Agregar a la pantalla principal"</strong>.</p>
                  </div>
                </div>
                <button
                  onClick={() => setShowPwaGuide(false)}
                  className="w-full mt-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold"
                >
                  Entendido
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
