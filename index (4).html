  <script>
    (function() {
      const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FF4B72"/><stop offset="100%" stop-color="#D946EF"/></linearGradient></defs><rect width="512" height="512" rx="115" fill="url(#g)"/><path d="M256 388s-124-76-124-168c0-44 34-78 76-78 26 0 40 14 48 26 8-12 22-26 48-26 42 0 76 34 76 78 0 92-124 168-124 168z" fill="#ffffff"/></svg>`;
      const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);
      document.getElementById('apple-touch-icon').setAttribute('href', iconUrl);

      const manifest = {
        name: "Ciclo & Bienestar",
        short_name: "Ciclo",
        description: "Control Compartido y Calendario Menstrual",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#F8FAFC",
        theme_color: "#FF4B72",
        icons: [
          { src: iconUrl, sizes: "192x192", type: "image/svg+xml", purpose: "any maskable" },
          { src: iconUrl, sizes: "512x512", type: "image/svg+xml", purpose: "any maskable" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      document.getElementById('pwa-manifest').setAttribute('href', URL.createObjectURL(blob));
    })();
  </script>
</head>
<body class="bg-slate-50 text-slate-800 pb-24 md:pb-10">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // CONFIGURACIÓN DE SEGURIDAD Y SINCRONIZACIÓN DE FÁBRICA
    const ACCESS_PIN = "0414";
    const DEFAULT_CLOUD_URL = "https://control-81285-default-rtdb.firebaseio.com";

    const SYMPTOM_TAGS = [
      { id: 'cramps_mild', label: 'Cólicos leves', icon: '🩸' },
      { id: 'cramps_strong', label: 'Cólicos fuertes', icon: '⚡' },
      { id: 'headache', label: 'Dolor de cabeza', icon: '🤕' },
      { id: 'fatigue', label: 'Cansancio / Sueño', icon: '😴' },
      { id: 'nausea', label: 'Náuseas / Mareo', icon: '🤢' },
      { id: 'cravings', label: 'Antojos / Apetito', icon: '🍫' },
      { id: 'sensitive', label: 'Sensible / Emotiva', icon: '🥺' },
      { id: 'good_mood', label: 'Buen ánimo / Energía', icon: '✨' },
      { id: 'bloating', label: 'Inflamación', icon: '🎈' },
      { id: 'altered_cycle', label: 'Ciclo alterado (Postday)', icon: '⚠️' }
    ];

    const INITIAL_EVENTS = [
      { id: '1', date: '2026-08-03', type: 'period_start', title: 'Inicio de Periodo (Agosto)', details: 'Duración estimada 5 días (3 - 7 Ago).', tags: ['cramps_mild'], alteredCycle: false },
      { id: '2', date: '2026-08-31', type: 'period_start', title: 'Inicio de Periodo (Septiembre)', details: 'Duración estimada 5 días (31 Ago - 4 Sep).', tags: [], alteredCycle: false },
      { id: '3', date: '2026-10-12', type: 'period_start', title: 'Inicio de Periodo (Octubre)', details: 'Duración 5 días (12 - 16 Oct). Cólicos fuertes el 14 Oct.', tags: ['cramps_strong'], alteredCycle: false },
      { id: '4', date: '2026-10-21', type: 'intimacy_unprotected', title: 'Relación (Sin protección / Sin eyaculación)', details: 'Registrado en bitácora.', tags: [] },
      { id: '5', date: '2026-10-22', type: 'pill', title: 'Pastilla de Emergencia', details: 'Toma nocturna (Levonorgestrel).', tags: ['altered_cycle'] },
      { id: '6', date: '2026-10-24', type: 'intimacy_unprotected', title: 'Relación (Sin protección)', details: 'Madrugada.', tags: [] },
      { id: '7', date: '2026-10-26', type: 'medical', title: 'Ultrasonido Transvaginal', details: 'Endometrio inactivo (1.7-1.9 mm) y ovarios en reposo. Sin riesgo.', tags: [] },
      { id: '8', date: '2026-10-31', type: 'period_start', title: 'Inicio de Periodo Confirmatorio', details: 'Duración 5 días (31 Oct - 4 Nov). Reinicio de ciclo confirmado.', tags: ['altered_cycle'], alteredCycle: true },
      { id: '9', date: '2026-11-07', type: 'intimacy_protected', title: 'Relaciones con Condón (3x)', details: 'Protección de barrera usada en todo momento.', tags: ['good_mood'] },
      { id: '10', date: '2026-11-08', type: 'medical', title: 'Síntomas físicos / Chequeo', details: 'Mareos y náuseas por ayuno prolongado y ajuste hormonal.', tags: ['nausea', 'fatigue'] }
    ];

    function formatDateES(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-').map(Number);
      const months = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
      return `${d} de ${months[m - 1]} ${y}`;
    }

    function addDays(dateStr, days) {
      const [y, m, d] = dateStr.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      const yy = dt.getFullYear();
      const mm = String(dt.getMonth() + 1).padStart(2, '0');
      const dd = String(dt.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    function diffDays(startStr, endStr) {
      const [y1, m1, d1] = startStr.split('-').map(Number);
      const [y2, m2, d2] = endStr.split('-').map(Number);
      const dt1 = new Date(y1, m1 - 1, d1);
      const dt2 = new Date(y2, m2 - 1, d2);
      return Math.round((dt2 - dt1) / (1000 * 60 * 60 * 24));
    }

    function App() {
      const [isUnlocked, setIsUnlocked] = useState(() => {
        try {
          return sessionStorage.getItem('ciclo_unlocked_v5') === 'true';
        } catch { return false; }
      });
      const [pinInput, setPinInput] = useState('');
      const [pinError, setPinError] = useState(false);

      const [cloudUrl] = useState(DEFAULT_CLOUD_URL);
      const [syncStatus, setSyncStatus] = useState('syncing');

      const [activeTab, setActiveTab] = useState('today');
      const [referenceDate, setReferenceDate] = useState('2026-11-12');
      const [currentMonth, setCurrentMonth] = useState({ year: 2026, month: 10 });
      const [selectedDay, setSelectedDay] = useState('2026-11-12');
      const [events, setEvents] = useState(() => {
        try {
          const saved = localStorage.getItem('ciclo_bienestar_events_v5');
          return saved ? JSON.parse(saved) : INITIAL_EVENTS;
        } catch {
          return INITIAL_EVENTS;
        }
      });

      const [modalOpen, setModalOpen] = useState(false);
      const [newEventType, setNewEventType] = useState('intimacy_protected');
      const [newEventDate, setNewEventDate] = useState('2026-11-12');
      const [newEventTitle, setNewEventTitle] = useState('');
      const [newEventDetails, setNewEventDetails] = useState('');
      const [newEventTags, setNewEventTags] = useState([]);
      const [newEventAltered, setNewEventAltered] = useState(false);

      const [deferredPrompt, setDeferredPrompt] = useState(null);
      const [showPwaGuide, setShowPwaGuide] = useState(false);

      useEffect(() => {
        const handler = (e) => {
          e.preventDefault();
          setDeferredPrompt(e);
        };
        window.addEventListener('beforeinstallprompt', handler);
        return () => window.removeEventListener('beforeinstallprompt', handler);
      }, []);

      const handleInstallClick = async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          await deferredPrompt.userChoice;
          setDeferredPrompt(null);
        } else {
          setShowPwaGuide(true);
        }
      };

      // Sincronización en tiempo real con Firebase
      useEffect(() => {
        if (!cloudUrl || !isUnlocked) return;
        const cleanUrl = cloudUrl.trim().replace(/\/+$/, '');
        const endpoint = `${cleanUrl}/ciclo_data.json`;

        const fetchRemote = async () => {
          try {
            const res = await fetch(endpoint);
            if (res.ok) {
              const data = await res.json();
              if (data && Array.isArray(data.events)) {
                setEvents(data.events);
                localStorage.setItem('ciclo_bienestar_events_v5', JSON.stringify(data.events));
                setSyncStatus('synced');
              } else {
                await fetch(endpoint, {
                  method: 'PUT',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ events, updatedAt: Date.now() })
                });
                setSyncStatus('synced');
              }
            }
          } catch (e) {
            setSyncStatus('error');
          }
        };

        fetchRemote();
        const interval = setInterval(fetchRemote, 6000);
        return () => clearInterval(interval);
      }, [cloudUrl, isUnlocked]);

      const persistEvents = async (updatedEvents) => {
        setEvents(updatedEvents);
        try {
          localStorage.setItem('ciclo_bienestar_events_v5', JSON.stringify(updatedEvents));
        } catch (e) {}

        if (cloudUrl) {
          setSyncStatus('syncing');
          try {
            const cleanUrl = cloudUrl.trim().replace(/\/+$/, '');
            await fetch(`${cleanUrl}/ciclo_data.json`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ events: updatedEvents, updatedAt: Date.now() })
            });
            setSyncStatus('synced');
          } catch (e) {
            setSyncStatus('error');
          }
        }
      };

      const handleUnlock = (e) => {
        e.preventDefault();
        if (pinInput.trim() === ACCESS_PIN) {
          setIsUnlocked(true);
          setPinError(false);
          try { sessionStorage.setItem('ciclo_unlocked_v5', 'true'); } catch {}
        } else {
          setPinError(true);
          setPinInput('');
        }
      };

      const handleLock = () => {
        setIsUnlocked(false);
        setPinInput('');
        try { sessionStorage.removeItem('ciclo_unlocked_v5'); } catch {}
      };

      // MODELO CON MARGEN DE SEGURIDAD AMPLIO (Cubre tanto ciclo estándar de 28 días como desfases largos de hasta 42 días)
      const cycleAnalytics = useMemo(() => {
        const periodEvents = events
          .filter(e => e.type === 'period_start')
          .sort((a, b) => a.date.localeCompare(b.date));

        const starts = periodEvents.length ? periodEvents.map(e => e.date) : ['2026-10-31'];
        const historyRows = [];
        const naturalLengths = [];

        for (let i = 0; i < periodEvents.length; i++) {
          const curr = periodEvents[i];
          const next = periodEvents[i + 1];
          const length = next ? diffDays(curr.date, next.date) : null;
          const hasPillBetween = next
            ? events.some(ev => ev.type === 'pill' && ev.date >= curr.date && ev.date < next.date)
            : false;
          const isAltered = Boolean(next && (next.alteredCycle || hasPillBetween || (length !== null && length < 21)));

          if (length !== null && !isAltered && length >= 21 && length <= 45) {
            naturalLengths.push(length);
          }

          historyRows.push({
            id: curr.id,
            start: curr.date,
            end: addDays(curr.date, 4),
            length,
            isAltered,
            title: curr.title
          });
        }

        // Ciclo base estándar 28 días (y margen extendido hasta el ciclo más largo registrado si hubo desfase)
        const baseCycleLength = 28;
        const maxObservedCycle = naturalLengths.length > 0 ? Math.max(...naturalLengths, 28) : 28;

        // Ventana de seguridad amplia:
        // - Inicio fértil: Día 9 del ciclo (offset +8) para cubrir ovulación temprana de ciclo 28d
        // - Pico central estándar: Días 12-15 del ciclo (offset +11 a +14, pico día 14 = offset +13)
        // - Extensión de seguridad por desfase: hasta Día 22 (offset +21) si hubo ciclos largos
        const safeFertileStartOffset = 8; // Día 9
        const peakStartOffset = 11;       // Día 12
        const peakOvulationOffset = 13;   // Día 14
        const peakEndOffset = 14;         // Día 15
        const safeFertileEndOffset = maxObservedCycle > 30 ? 21 : 16; // Día 22 si hay antecedentes de desfase, Día 17 si es regular

        return {
          starts,
          historyRows: historyRows.reverse(),
          baseCycleLength,
          maxObservedCycle,
          safeFertileStartOffset,
          peakStartOffset,
          peakOvulationOffset,
          peakEndOffset,
          safeFertileEndOffset
        };
      }, [events]);

      const activePeriodStart = useMemo(() => {
        const valid = cycleAnalytics.starts.filter(d => d <= referenceDate);
        return valid.length ? valid[valid.length - 1] : cycleAnalytics.starts[0];
      }, [cycleAnalytics.starts, referenceDate]);

      const cycleDay = Math.max(1, diffDays(activePeriodStart, referenceDate) + 1);
      const nextPeriodEst = addDays(activePeriodStart, cycleAnalytics.baseCycleLength);
      const daysUntilNext = diffDays(referenceDate, nextPeriodEst);
      const fertileStart = addDays(activePeriodStart, cycleAnalytics.safeFertileStartOffset);
      const fertileEnd = addDays(activePeriodStart, cycleAnalytics.safeFertileEndOffset);
      const ovulationDay = addDays(activePeriodStart, cycleAnalytics.peakOvulationOffset);

      // Guía hormonal y nivel de riesgo conservador (nunca da falsa seguridad en días centrales)
      const getPhaseInfo = (day) => {
        const fStart = cycleAnalytics.safeFertileStartOffset + 1; // Día 9
        const pStart = cycleAnalytics.peakStartOffset + 1;       // Día 12
        const pEnd = cycleAnalytics.peakEndOffset + 1;           // Día 15
        const fEnd = cycleAnalytics.safeFertileEndOffset + 1;     // Día 22

        if (day <= 5) {
          return {
            name: 'Fase Menstrual',
            fertility: 'Muy Baja',
            desc: 'Días de sangrado menstrual. Priorizar descanso, calor local e hidratación.',
            partnerTip: 'Modo Pareja: Nivel de energía bajo y posible sensibilidad física. Ideal consentirla, evitar esfuerzos pesados y ofrecer algo calientito.',
            ringColor: '#FF4B72',
            badgeBg: 'bg-rose-100 text-rose-700'
          };
        }
        if (day >= pStart && day <= pEnd) {
          return {
            name: 'Pico de Ovulación',
            fertility: 'Muy Alta (Riesgo Máximo)',
            desc: 'Días centrales de máxima fertilidad en ciclo estándar de 28 días. Uso obligatorio de condón.',
            partnerTip: 'Modo Pareja: Máxima fertilidad biológica y pico hormonal. Precaución absoluta: usar protección de barrera desde el inicio en cada encuentro.',
            ringColor: '#EF4444',
            badgeBg: 'bg-red-100 text-red-700'
          };
        }
        if (day >= fStart && day <= fEnd) {
          return {
            name: 'Ventana Fértil Ampliada',
            fertility: 'Alta (Margen Seguridad)',
            desc: 'Dentro del margen de seguridad (Días 9–22) que cubre tanto ciclo de 28 días como posibles desfases hormonales.',
            partnerTip: 'Modo Pareja: Zona de precaución activa por margen de seguridad amplio. Mantener uso estricto de protección de barrera hasta pasar el día 22.',
            ringColor: '#F59E0B',
            badgeBg: 'bg-amber-100 text-amber-800'
          };
        }
        if (day < fStart) {
          return {
            name: 'Fase Folicular Temprana',
            fertility: 'Baja',
            desc: 'Días inmediatos posteriores al periodo antes de abrir la ventana fértil.',
            partnerTip: 'Modo Pareja: Buen ánimo, claridad mental y energía en subida. Buen momento para salidas o planes activos juntos.',
            ringColor: '#00D4B2',
            badgeBg: 'bg-teal-100 text-teal-800'
          };
        }
        return {
          name: 'Fase Lútea Segura',
          fertility: 'Baja',
          desc: 'Etapa posterior al margen fértil ampliado hasta el inicio del siguiente periodo.',
          partnerTip: 'Modo Pareja: Posible cansancio, antojos o cambios de humor premenstruales. Paciencia extra, escucha activa y planes relajados.',
          ringColor: '#6366F1',
          badgeBg: 'bg-indigo-100 text-indigo-800'
        };
      };

      const phase = getPhaseInfo(cycleDay);

      const openAddModal = (type, dateOverride) => {
        const targetDate = dateOverride || referenceDate;
        setNewEventType(type);
        setNewEventDate(targetDate);
        const defaultTitles = {
          period_start: 'Inicio de Periodo',
          intimacy_protected: 'Relación con Condón',
          intimacy_unprotected: 'Relación sin Protección',
          pill: 'Pastilla de Emergencia',
          medical: 'Registro de Síntomas / Nota'
        };
        setNewEventTitle(defaultTitles[type] || '');
        setNewEventDetails('');
        setNewEventTags([]);
        setNewEventAltered(false);
        setModalOpen(true);
      };

      const toggleTag = (tagId) => {
        setNewEventTags(prev =>
          prev.includes(tagId) ? prev.filter(t => t !== tagId) : [...prev, tagId]
        );
      };

      const handleSaveEvent = (e) => {
        e.preventDefault();
        if (!newEventTitle.trim()) return;
        const created = {
          id: String(Date.now()),
          date: newEventDate,
          type: newEventType,
          title: newEventTitle.trim(),
          details: newEventDetails.trim() || 'Registrado en bitácora.',
          tags: newEventTags,
          alteredCycle: newEventType === 'period_start' ? newEventAltered : false
        };
        const updated = [...events, created].sort((a, b) => b.date.localeCompare(a.date));
        persistEvents(updated);
        setSelectedDay(newEventDate);
        setModalOpen(false);
      };

      const handleDeleteEvent = (id) => {
        const updated = events.filter(ev => ev.id !== id);
        persistEvents(updated);
      };

      const monthNames = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
      const daysInMonth = new Date(currentMonth.year, currentMonth.month + 1, 0).getDate();
      const firstWeekday = new Date(currentMonth.year, currentMonth.month, 1).getDay();

      const prevMonth = () => {
        setCurrentMonth(prev => prev.month === 0 ? { year: prev.year - 1, month: 11 } : { year: prev.year, month: prev.month - 1 });
      };
      const nextMonth = () => {
        setCurrentMonth(prev => prev.month === 11 ? { year: prev.year + 1, month: 0 } : { year: prev.year, month: prev.month + 1 });
      };

      const getDayStatus = (dateStr) => {
        const allPeriodStarts = [...cycleAnalytics.starts, nextPeriodEst];
        const allPeriods = allPeriodStarts.map(s => ({
          start: s,
          end: addDays(s, 4),
          isProjected: s === nextPeriodEst
        }));
        const periodMatch = allPeriods.find(r => dateStr >= r.start && dateStr <= r.end);

        // Pico central (Días 12-15) y Ventana Fértil Ampliada (Días 9-22)
        const isPeak = allPeriodStarts.some(s =>
          dateStr >= addDays(s, cycleAnalytics.peakStartOffset) &&
          dateStr <= addDays(s, cycleAnalytics.peakEndOffset)
        );
        const isFertile = allPeriodStarts.some(s =>
          dateStr >= addDays(s, cycleAnalytics.safeFertileStartOffset) &&
          dateStr <= addDays(s, cycleAnalytics.safeFertileEndOffset)
        );

        const dayEvents = events.filter(e => e.date === dateStr);
        return {
          isPeriod: Boolean(periodMatch),
          isProjectedPeriod: Boolean(periodMatch && periodMatch.isProjected),
          isFertile,
          isPeak,
          dayEvents
        };
      };

      const selectedDayInfo = getDayStatus(selectedDay);
      const sortedEvents = [...events].sort((a, b) => b.date.localeCompare(a.date));

      const getEventBadge = (type) => {
        switch (type) {
          case 'period_start': return { icon: '🩸', label: 'Periodo', color: 'bg-rose-100 text-rose-700 border-rose-200' };
          case 'intimacy_protected': return { icon: '🛡️❤️', label: 'Con protección', color: 'bg-purple-100 text-purple-700 border-purple-200' };
          case 'intimacy_unprotected': return { icon: '❤️', label: 'Sin protección', color: 'bg-pink-100 text-pink-700 border-pink-200' };
          case 'pill': return { icon: '💊', label: 'Emergencia', color: 'bg-amber-100 text-amber-800 border-amber-200' };
          default: return { icon: '🩺', label: 'Síntoma / Nota', color: 'bg-sky-100 text-sky-700 border-sky-200' };
        }
      };

      const handleExportMedicalReport = () => {
        const reportWindow = window.open('', '_blank', 'width=850,height=900');
        if (!reportWindow) {
          window.print();
          return;
        }
        const cyclesHtml = cycleAnalytics.historyRows.map(c => `
          <tr>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${formatDateES(c.start)} – ${formatDateES(c.end)}</td>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${c.length ? c.length + ' días' : 'En curso'}</td>
            <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${c.isAltered ? 'Alterado (Postday)' : 'Natural'}</td>
          </tr>
        `).join('');

        const eventsHtml = sortedEvents.map(ev => {
          const tagsText = (ev.tags || [])
            .map(tid => SYMPTOM_TAGS.find(t => t.id === tid)?.label)
            .filter(Boolean)
            .join(', ');
          return `
            <tr>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;white-space:nowrap;">${formatDateES(ev.date)}</td>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;font-weight:bold;">${ev.title}</td>
              <td style="padding:8px;border-bottom:1px solid #e2e8f0;">${ev.details}${tagsText ? ' [' + tagsText + ']' : ''}</td>
            </tr>
          `;
        }).join('');

        reportWindow.document.write(`
          <!DOCTYPE html>
          <html lang="es">
          <head>
            <meta charset="UTF-8" />
            <title>Reporte Ginecológico - Ciclo & Bienestar</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1e293b; padding: 32px; max-width: 800px; margin: 0 auto; }
              h1 { color: #e11d48; margin-bottom: 4px; font-size: 22px; }
              .sub { color: #64748b; font-size: 13px; margin-bottom: 24px; }
              .summary-box { display: flex; gap: 16px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 24px; }

                      <div key={ev.id} className="p-3.5 rounded-xl border border-slate-100 flex items-start justify-between gap-3 hover:bg-slate-50 transition">
                        <div>
                          <div className="flex flex-wrap items-center gap-2">
                            <span className="text-xs font-bold text-slate-500">{formatDateES(ev.date)}</span>
                            <span className={`text-[11px] font-bold px-2 py-0.5 rounded-full border ${badge.color}`}>
                              {badge.icon} {badge.label}
                            </span>
                          </div>
                          <p className="text-sm font-bold text-slate-900 mt-1">{ev.title}</p>
                          <p className="text-xs text-slate-600 mt-0.5">{ev.details}</p>
                          {ev.tags && ev.tags.length > 0 && (
                            <div className="flex flex-wrap gap-1.5 mt-2">
                              {ev.tags.map(tid => {
                                const t = SYMPTOM_TAGS.find(x => x.id === tid);
                                return t ? (
                                  <span key={tid} className="text-[11px] bg-slate-100 text-slate-700 px-2.5 py-0.5 rounded-full font-medium">
                                    {t.icon} {t.label}
                                  </span>
                                ) : null;
                              })}
                            </div>
                          )}
                        </div>
                        <button
                          onClick={() => handleDeleteEvent(ev.id)}
                          title="Eliminar registro"
                          className="text-slate-400 hover:text-rose-600 text-xs p-1 no-print"
                        >
                          ✕
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}

          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 grid grid-cols-3 py-2 px-2 z-40 no-print">
            <button
              onClick={() => setActiveTab('today')}
              className={`flex flex-col items-center py-1 text-xs font-semibold ${activeTab === 'today' ? 'text-rose-600' : 'text-slate-500'}`}
            >
              <span className="text-base mb-0.5">💗</span>
              Hoy
            </button>
            <button
              onClick={() => setActiveTab('calendar')}
              className={`flex flex-col items-center py-1 text-xs font-semibold ${activeTab === 'calendar' ? 'text-rose-600' : 'text-slate-500'}`}
            >
              <span className="text-base mb-0.5">📅</span>
              Calendario
            </button>
            <button
              onClick={() => setActiveTab('history')}
              className={`flex flex-col items-center py-1 text-xs font-semibold ${activeTab === 'history' ? 'text-rose-600' : 'text-slate-500'}`}
            >
              <span className="text-base mb-0.5">📋</span>
              Historial
            </button>
          </nav>

          {modalOpen && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50 overflow-y-auto">
              <div className="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl my-8">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="text-base font-bold text-slate-900">Nuevo Registro</h3>
                  <button onClick={() => setModalOpen(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                <form onSubmit={handleSaveEvent} className="space-y-3.5">
                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Tipo de evento</label>
                    <select
                      value={newEventType}
                      onChange={(e) => setNewEventType(e.target.value)}
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
                    >
                      <option value="period_start">🩸 Inicio de Periodo</option>
                      <option value="intimacy_protected">🛡️❤️ Relación con Condón</option>
                      <option value="intimacy_unprotected">❤️ Relación sin Protección</option>
                      <option value="pill">💊 Pastilla de Emergencia</option>
                      <option value="medical">🩺 Síntomas / Ánimo / Estudio</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Fecha</label>
                    <input
                      type="date"
                      value={newEventDate}
                      onChange={(e) => setNewEventDate(e.target.value)}
                      required
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
                    />
                  </div>

                  {newEventType === 'period_start' && (
                    <label className="flex items-center gap-2 bg-amber-50 border border-amber-200 rounded-xl p-2.5 text-xs text-amber-900 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={newEventAltered}
                        onChange={(e) => setNewEventAltered(e.target.checked)}
                        className="rounded text-rose-500"
                      />
                      <span>Este periodo se adelantó/retrasó por pastilla de emergencia</span>
                    </label>
                  )}

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Título</label>
                    <input
                      type="text"
                      value={newEventTitle}
                      onChange={(e) => setNewEventTitle(e.target.value)}
                      required
                      placeholder="Ej. Registro del día"
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1.5">Etiquetas rápidas de síntomas y ánimo</label>
                    <div className="flex flex-wrap gap-1.5">
                      {SYMPTOM_TAGS.map(tag => {
                        const active = newEventTags.includes(tag.id);
                        return (
                          <button
                            type="button"
                            key={tag.id}
                            onClick={() => toggleTag(tag.id)}
                            className={`text-[11px] px-2.5 py-1 rounded-full border font-medium transition ${active ? 'bg-rose-500 text-white border-rose-500' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}`}
                          >
                            {tag.icon} {tag.label}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-600 mb-1">Detalles / Notas (opcional)</label>
                    <textarea
                      rows="2"
                      value={newEventDetails}
                      onChange={(e) => setNewEventDetails(e.target.value)}
                      placeholder="Notas adicionales..."
                      className="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-rose-400"
                    ></textarea>
                  </div>

                  <div className="flex gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setModalOpen(false)}
                      className="flex-1 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-bold hover:bg-slate-200"
                    >
                      Cancelar
                    </button>
                    <button
                      type="submit"
                      className="flex-1 py-2.5 rounded-xl bg-rose-500 text-white text-sm font-bold hover:bg-rose-600"
                    >
                      Guardar
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showPwaGuide && (
            <div className="fixed inset-0 bg-slate-900/50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 shadow-xl">
                <div className="flex items-center justify-between mb-3">
                  <h3 className="text-base font-bold text-slate-900">Instalar como App Nativa</h3>
                  <button onClick={() => setShowPwaGuide(false)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>
                <div className="space-y-3 text-xs text-slate-600 leading-relaxed">
                  <p>Esta aplicación ya incluye su propio ícono y configuración de pantalla completa:</p>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p className="font-bold text-slate-900 mb-1">En iPhone (Safari):</p>
                    <p>Toca el botón <strong>Compartir</strong> (cuadro con flecha hacia arriba abajo) y selecciona <strong>"Agregar a inicio"</strong>.</p>
                  </div>
                  <div className="bg-slate-50 p-3 rounded-xl border border-slate-100">
                    <p className="font-bold text-slate-900 mb-1">En Android (Chrome):</p>
                    <p>Toca los <strong>3 puntos</strong> (arriba a la derecha) y elige <strong>"Instalar aplicación"</strong> o <strong>"Agregar a la pantalla principal"</strong>.</p>
                  </div>
                </div>
                <button
                  onClick={() => setShowPwaGuide(false)}
                  className="w-full mt-4 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold"
                >
                  Entendido
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
